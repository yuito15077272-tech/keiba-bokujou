<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>競馬牧場</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",
  "Hiragino Kaku Gothic ProN",Meiryo,sans-serif;
  background:#f4f6f8;
  color:#172033;
}

body{
  padding-bottom:40px;
}

button,input,select{
  font:inherit;
}

button{
  -webkit-tap-highlight-color:transparent;
}

.header{
  background:#0f172a;
  color:#fff;
  padding:18px 16px 16px;
  position:sticky;
  top:0;
  z-index:20;
}

.header-title{
  font-size:22px;
  font-weight:800;
}

.header-sub{
  margin-top:4px;
  font-size:12px;
  opacity:.75;
}

.container{
  max-width:900px;
  margin:0 auto;
  padding:14px;
}

.nav{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-bottom:14px;
}

.nav button{
  min-height:44px;
  border:0;
  border-radius:10px;
  background:#fff;
  color:#475467;
  font-weight:800;
}

.nav button.active{
  background:#2563eb;
  color:#fff;
}

.page{
  display:none;
}

.page.active{
  display:block;
}

.card{
  background:#fff;
  border-radius:16px;
  padding:16px;
  margin-bottom:14px;
  box-shadow:0 4px 16px rgba(15,23,42,.07);
}

.card-title{
  font-size:17px;
  font-weight:800;
  margin-bottom:12px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.field{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.field.full{
  grid-column:1/-1;
}

label{
  font-size:12px;
  font-weight:700;
  color:#667085;
}

input,select{
  width:100%;
  min-height:46px;
  border:1px solid #d9dee7;
  border-radius:10px;
  background:#fff;
  padding:10px 12px;
  color:#172033;
  outline:none;
}

input:focus,select:focus{
  border-color:#2563eb;
}

.btn{
  width:100%;
  min-height:48px;
  border:0;
  border-radius:12px;
  font-weight:800;
  cursor:pointer;
}

.btn-primary{
  background:#2563eb;
  color:#fff;
}

.btn-secondary{
  background:#e9eef5;
  color:#172033;
}

.btn-danger{
  background:#fee2e2;
  color:#b91c1c;
}

.empty{
  text-align:center;
  color:#98a2b3;
  padding:30px 10px;
}

.horse-row{
  margin-bottom:8px;
  padding:8px;
  border:1px solid #e4e7ec;
  border-radius:10px;
  background:#fff;
}

.stat-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.stat-box{
  background:#f8fafc;
  border-radius:12px;
  padding:12px;
}

.stat-label{
  font-size:11px;
  color:#667085;
}

.stat-value{
  font-size:21px;
  font-weight:800;
  margin-top:4px;
}

.table-wrap{
  width:100%;
  overflow-x:auto;
}

.stats-table{
  width:100%;
  min-width:500px;
  border-collapse:collapse;
  font-size:12px;
}

.stats-table th,
.stats-table td{
  padding:10px 6px;
  border-bottom:1px solid #eef0f3;
}

.stats-table th{
  text-align:right;
  border-bottom:2px solid #e4e7ec;
}

.stats-table th:first-child,
.stats-table td:first-child{
  text-align:left;
}

.profit-positive{
  color:#15803d;
  font-weight:800;
}

.profit-negative{
  color:#dc2626;
  font-weight:800;
}

@media(max-width:600px){

  .grid{
    grid-template-columns:1fr;
  }

  .field.full{
    grid-column:auto;
  }

  .nav{
    grid-template-columns:repeat(4,1fr);
  }

  .nav button{
    font-size:12px;
  }

}
</style>
</head>

<body>

<header class="header">
  <div class="header-title">🏇 競馬牧場</div>
  <div class="header-sub">競馬予想・成績・収支分析</div>
</header>

<main class="container">

<nav class="nav">
  <button type="button" class="active" data-page="inputPage">入力</button>
  <button type="button" data-page="resultPage">結果</button>
  <button type="button" data-page="statsPage">分析</button>
  <button type="button" data-page="historyPage">履歴</button>
</nav>


<!-- =========================
     入力
========================= -->

<section id="inputPage" class="page active">

  <div class="card">

    <div class="card-title">🏇 レース情報</div>

    <div class="grid">

      <div class="field">
        <label>競馬場</label>
        <select id="track">
          <option value="">選択してください</option>
          <option>札幌</option>
          <option>函館</option>
          <option>福島</option>
          <option>新潟</option>
          <option>東京</option>
          <option>中山</option>
          <option>中京</option>
          <option>京都</option>
          <option>阪神</option>
          <option>小倉</option>
        </select>
      </div>

      <div class="field">
        <label>レース番号</label>
        <select id="raceNo">
          <option value="">選択</option>
          <option>1R</option>
          <option>2R</option>
          <option>3R</option>
          <option>4R</option>
          <option>5R</option>
          <option>6R</option>
          <option>7R</option>
          <option>8R</option>
          <option>9R</option>
          <option>10R</option>
          <option>11R</option>
          <option>12R</option>
        </select>
      </div>

      <div class="field">
        <label>馬場</label>
        <select id="surface">
          <option value="">選択してください</option>
          <option>芝</option>
          <option>ダート</option>
          <option>障害</option>
        </select>
      </div>

      <div class="field">
        <label>距離</label>
        <select id="distance">
          <option value="">選択してください</option>
        </select>
      </div>

      <div class="field">
        <label>クラス</label>
        <select id="raceClass">
          <option value="">選択してください</option>
          <option>新馬</option>
          <option>未勝利</option>
          <option>1勝クラス</option>
          <option>2勝クラス</option>
          <option>3勝クラス</option>
          <option>オープン</option>
          <option>G3</option>
          <option>G2</option>
          <option>G1</option>
        </select>
      </div>

      <div class="field">
        <label>馬場状態</label>
        <select id="ground">
          <option value="">選択してください</option>
          <option>良</option>
          <option>稍重</option>
          <option>重</option>
          <option>不良</option>
        </select>
      </div>

      <div class="field">
        <label>頭数</label>
        <select id="fieldSize">
          <option value="">選択してください</option>
        </select>
      </div>

    </div>
  </div>


  <div class="card">

    <div class="card-title">🐎 出走馬</div>

    <div id="horseList"></div>

    <button
      type="button"
      class="btn btn-secondary"
      id="addHorseBtn">
      ＋ 馬を追加
    </button>

  </div>


  <div class="card">

    <div class="card-title">💰 収支</div>

    <div class="grid">

      <div class="field">
        <label>投資額</label>
        <input
          id="investment"
          type="number"
          inputmode="numeric"
          placeholder="0">
      </div>

      <div class="field">
        <label>回収額</label>
        <input
          id="returnAmount"
          type="number"
          inputmode="numeric"
          placeholder="0">
      </div>

      <div class="field full">
        <label>レース名・メモ</label>
        <input
          id="raceName"
          type="text"
          placeholder="例：新潟記念">
      </div>

    </div>

  </div>


  <button
    type="button"
    class="btn btn-primary"
    id="savePredictionBtn">
    💾 予想を保存
  </button>

</section>


<!-- =========================
     結果
========================= -->

<section id="resultPage" class="page">

  <div class="card">

    <div class="card-title">🏁 結果入力</div>

    <div id="resultContent">
      <div class="empty">
        保存した予想を選択すると結果を入力できます。
      </div>
    </div>

  </div>

</section>


<!-- =========================
     分析
========================= -->

<section id="statsPage" class="page">

  <div class="card">

    <div class="card-title">📊 成績分析</div>

    <div id="statsSummary"></div>

  </div>


  <div class="card">
    <div class="card-title">🏇 競馬場別</div>
    <div id="trackStats"></div>
  </div>


  <div class="card">
    <div class="card-title">📏 距離別</div>
    <div id="distanceStats"></div>
  </div>


  <div class="card">
    <div class="card-title">🌱 芝・ダート・障害</div>
    <div id="surfaceStats"></div>
  </div>


  <div class="card">
    <div class="card-title">🏆 クラス別</div>
    <div id="classStats"></div>
  </div>


  <div class="card">
    <div class="card-title">🌦 馬場状態別</div>
    <div id="groundStats"></div>
  </div>


  <div class="card">
    <div class="card-title">🎽 枠番別</div>
    <div id="frameStats"></div>
  </div>


  <div class="card">
    <div class="card-title">⭐ 印別</div>
    <div id="markStats"></div>
  </div>


  <div class="card">
    <div class="card-title">🐎 頭数別</div>
    <div id="fieldSizeStats"></div>
  </div>


  <div class="card">
    <div class="card-title">🔥 人気別</div>
    <div id="popularityStats"></div>
  </div>


  <div class="card">

    <div class="card-title">📈 累計収支</div>

    <div style="width:100%;overflow:hidden;">

      <canvas
        id="profitChart"
        style="display:block;width:100%;height:260px;">
      </canvas>

    </div>

  </div>

</section>


<!-- =========================
     履歴
========================= -->

<section id="historyPage" class="page">

  <div class="card">

    <div class="card-title">📚 予想履歴</div>

    <div id="historyContent">
      <div class="empty">
        まだ予想が保存されていません。
      </div>
    </div>

  </div>

</section>

</main>


<script>

/* =================================
   基本設定
================================= */

const STORAGE_KEY = "keiba_bokujou_final_v2";

const DISTANCES = [
  1000,1100,1200,1300,1400,1500,1600,
  1700,1800,1900,2000,2100,2200,2300,
  2400,2500,2600,3000,3200,3400,3600
];

const MARKS = [
  "◎",
  "○",
  "▲",
  "☆",
  "△",
  "消",
  "－"
];

const appState = {
  predictions:[],
  currentPredictionId:null
};


/* =================================
   ID取得
================================= */

function $(id){
  return document.getElementById(id);
}


/* =================================
   HTMLエスケープ
================================= */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =================================
   データ保存
================================= */

function saveData(){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(appState)
  );

}


/* =================================
   データ読み込み
================================= */

function loadData(){

  try{

    const saved =
      localStorage.getItem(STORAGE_KEY);

    if(!saved) return;

    const data =
      JSON.parse(saved);

    if(!data || typeof data !== "object"){
      return;
    }

    appState.predictions =
      Array.isArray(data.predictions)
      ? data.predictions
      : [];

    appState.currentPredictionId =
      data.currentPredictionId || null;

  }catch(error){

    console.error(
      "データ読み込みエラー:",
      error
    );

    appState.predictions = [];
    appState.currentPredictionId = null;

  }

}


/* =================================
   ページ切り替え
================================= */

function showPage(pageId){

  document
    .querySelectorAll(".page")
    .forEach(page=>{
      page.classList.remove("active");
    });

  const target =
    $(pageId);

  if(target){
    target.classList.add("active");
  }

  document
    .querySelectorAll(".nav button")
    .forEach(button=>{

      button.classList.toggle(
        "active",
        button.dataset.page === pageId
      );

    });


  if(pageId === "resultPage"){
    renderResultPage();
  }

  if(pageId === "statsPage"){
    renderStatsPage();
  }

  if(pageId === "historyPage"){
    renderHistoryPage();
  }

}
/* =================================
   ナビゲーション
   確実にページ切り替え
================================= */

function showPage(pageId){

  const pages =
    document.querySelectorAll(".page");

  pages.forEach(function(page){

    page.classList.remove("active");

  });


  const target =
    document.getElementById(pageId);

  if(target){

    target.classList.add("active");

  }


  const buttons =
    document.querySelectorAll(".nav button");

  buttons.forEach(function(button){

    button.classList.remove("active");

    if(
      button.getAttribute("data-page") === pageId
    ){

      button.classList.add("active");

    }

  });


  /* ページごとの更新 */

  if(pageId === "resultPage"){

    renderResultPage();

  }


  if(pageId === "statsPage"){

    renderStatsPage();

  }


  if(pageId === "historyPage"){

    renderHistoryPage();

  }

}


/* ナビボタン */

document.querySelectorAll(".nav button").forEach(
  function(button){

    button.onclick = function(){

      const pageId =
        this.getAttribute("data-page");

      showPage(pageId);

    };

  }
);


/* =================================
   距離・頭数
================================= */

function setupSelects(){

  const distance =
    $("distance");

  DISTANCES.forEach(value=>{

    const option =
      document.createElement("option");

    option.value = value;
    option.textContent = value + "m";

    distance.appendChild(option);

  });


  const fieldSize =
    $("fieldSize");

  for(let i=1;i<=18;i++){

    const option =
      document.createElement("option");

    option.value = i;
    option.textContent = i + "頭";

    fieldSize.appendChild(option);

  }

}


/* =================================
   馬入力
================================= */

let horseCount = 0;


function createHorseRow(){

  horseCount++;

  const row =
    document.createElement("div");

  row.className = "horse-row";

  row.innerHTML = `

    <div style="
      display:grid;
      grid-template-columns:72px 58px minmax(0,1fr) 58px;
      gap:6px;
      align-items:end;
    ">

      <div class="field">

        <label>枠番</label>

        <select class="horse-frame">

          <option value="">枠</option>

          <option value="1">1枠</option>
          <option value="2">2枠</option>
          <option value="3">3枠</option>
          <option value="4">4枠</option>
          <option value="5">5枠</option>
          <option value="6">6枠</option>
          <option value="7">7枠</option>
          <option value="8">8枠</option>

        </select>

      </div>


      <div class="field">

        <label>馬番</label>

        <select class="horse-number">

          <option value="">番</option>

          ${Array.from(
            {length:18},
            (_,i)=>
              `<option value="${i+1}">${i+1}</option>`
          ).join("")}

        </select>

      </div>


      <div class="field">

        <label>馬名</label>

        <input
          class="horse-name"
          type="text"
          placeholder="馬名">

      </div>


      <div class="field">

        <label>印</label>

        <select class="horse-mark">

          ${MARKS.map(mark=>
            `<option value="${mark}">${mark}</option>`
          ).join("")}

        </select>

      </div>

    </div>

  `;


  $("horseList").appendChild(row);

}


/* =================================
   馬取得
================================= */

function getHorseData(){

  const rows =
    document.querySelectorAll(".horse-row");

  const horses = [];

  rows.forEach((row,index)=>{

    horses.push({

      id:index + 1,

      frame:
        row.querySelector(".horse-frame")?.value || "",

      number:
        row.querySelector(".horse-number")?.value || "",

      name:
        row.querySelector(".horse-name")?.value.trim() || "",

      mark:
        row.querySelector(".horse-mark")?.value || "",

      popularity:""

    });

  });

  return horses;

}


/* =================================
   頭数変更
================================= */

$("fieldSize")
  .addEventListener(
    "change",
    function(){

      const size =
        Number(this.value);

      $("horseList").innerHTML = "";

      horseCount = 0;

      if(!size) return;

      for(let i=0;i<size;i++){
        createHorseRow();
      }

    }
  );


/* =================================
   馬追加
================================= */

$("addHorseBtn")
  .addEventListener(
    "click",
    createHorseRow
  );


/* =================================
   予想保存
================================= */

$("savePredictionBtn")
  .addEventListener(
    "click",
    function(){

      const track =
        $("track").value;

      const raceNo =
        $("raceNo").value;

      const surface =
        $("surface").value;

      const distance =
        $("distance").value;

      const raceClass =
        $("raceClass").value;

      const ground =
        $("ground").value;

      const fieldSize =
        $("fieldSize").value;

      const raceName =
        $("raceName").value.trim();

      const investment =
        Number(
          $("investment").value
        ) || 0;

      const returnAmount =
        Number(
          $("returnAmount").value
        ) || 0;

      const horses =
        getHorseData();


      if(!track){

        alert(
          "競馬場を選択してください。"
        );

        return;

      }


      if(!raceNo){

        alert(
          "レース番号を選択してください。"
        );

        return;

      }


      if(!fieldSize){

        alert(
          "頭数を選択してください。"
        );

        return;

      }


      if(horses.length === 0){

        alert(
          "出走馬を入力してください。"
        );

        return;

      }


      const prediction = {

        id:
          Date.now().toString(),

        createdAt:
          new Date().toISOString(),

        raceName,

        track,

        raceNo,

        surface,

        distance,

        raceClass,

        ground,

        fieldSize:
          Number(fieldSize),

        horses,

        investment,

        returnAmount,

        profit:
          returnAmount - investment,

        result:{
          first:"",
          second:"",
          third:""
        }

      };


      appState.predictions.unshift(
        prediction
      );

      appState.currentPredictionId =
        prediction.id;

      saveData();

      alert(
        "予想を保存しました！"
      );

      showPage(
        "resultPage"
      );

    }
  );


/* =================================
   結果一覧
================================= */

function renderResultPage(){

  const container =
    $("resultContent");

  if(!container) return;

  if(
    appState.predictions.length === 0
  ){

    container.innerHTML = `
      <div class="empty">
        まだ保存された予想がありません。
      </div>
    `;

    return;

  }


  container.innerHTML = `

    <div>
      ${appState.predictions.map(
        prediction=>{

          const title =
            prediction.raceName ||
            (
              prediction.track +
              " " +
              prediction.raceNo
            );

          const resultSaved =
            prediction.result &&
            prediction.result.first &&
            prediction.result.second &&
            prediction.result.third;

          return `

            <div style="
              border:1px solid #e4e7ec;
              border-radius:12px;
              padding:12px;
              margin-bottom:10px;
              background:#fff;
            ">

              <div style="
                font-weight:800;
                font-size:15px;
              ">
                ${escapeHTML(title)}
              </div>

              <div style="
                margin-top:5px;
                font-size:12px;
                color:#667085;
              ">
                ${escapeHTML(prediction.track)}
                ${escapeHTML(prediction.raceNo)}
                ／
                ${escapeHTML(prediction.surface || "")}
                ${escapeHTML(prediction.distance || "")}m
              </div>

              <div style="
                margin-top:6px;
                font-size:12px;
                color:#667085;
              ">
                ${
                  resultSaved
                  ? "🏁 結果入力済み"
                  : "⏳ 結果未入力"
                }
              </div>

              <button
                type="button"
                class="btn btn-secondary"
                style="margin-top:10px;"
                onclick="openResultEditor('${prediction.id}')">
                🏁 結果を入力
              </button>

            </div>

          `;

        }
      ).join("")}
    </div>

  `;

}


/* =================================
   結果編集
================================= */

function openResultEditor(id){

  const prediction =
    appState.predictions.find(
      item => item.id === id
    );

  if(!prediction){

    alert(
      "予想データが見つかりません。"
    );

    return;

  }


  appState.currentPredictionId = id;

  saveData();


  const container =
    $("resultContent");


  container.innerHTML = `

    <div style="
      background:#f8fafc;
      border-radius:12px;
      padding:12px;
      margin-bottom:14px;
    ">

      <div style="
        font-weight:800;
        font-size:16px;
      ">
        ${escapeHTML(
          prediction.raceName ||
          (
            prediction.track +
            " " +
            prediction.raceNo
          )
        )}
      </div>

    </div>


    <div class="field" style="margin-bottom:12px;">

      <label>🥇 1着</label>

      <select id="resultFirst">

        <option value="">
          選択してください
        </option>

        ${createResultOptions(
          prediction.horses,
          prediction.result.first
        )}

      </select>

    </div>


    <div class="field" style="margin-bottom:12px;">

      <label>🥈 2着</label>

      <select id="resultSecond">

        <option value="">
          選択してください
        </option>

        ${createResultOptions(
          prediction.horses,
          prediction.result.second
        )}

      </select>

    </div>


    <div class="field" style="margin-bottom:16px;">

      <label>🥉 3着</label>

      <select id="resultThird">

        <option value="">
          選択してください
        </option>

        ${createResultOptions(
          prediction.horses,
          prediction.result.third
        )}

      </select>

    </div>


    <button
      type="button"
      class="btn btn-primary"
      onclick="saveRaceResult('${prediction.id}')">
      💾 結果を保存
    </button>


    <button
      type="button"
      class="btn btn-secondary"
      style="margin-top:8px;"
      onclick="renderResultPage()">
      ← レース一覧へ戻る
    </button>

  `;

}


function createResultOptions(
  horses,
  selected
){

  if(!Array.isArray(horses)){
    return "";
  }

  return horses.map(horse=>{

    const value =
      horse.number ||
      horse.id;

    const label =
      horse.number
      ? `${horse.number}番 ${horse.name || "馬名未入力"}`
      : (horse.name || "馬名未入力");

    return `
      <option
        value="${escapeHTML(String(value))}"
        ${
          String(selected) ===
          String(value)
          ? "selected"
          : ""
        }>
        ${escapeHTML(label)}
      </option>
    `;

  }).join("");

}


/* =================================
   結果保存
================================= */

function saveRaceResult(id){

  const prediction =
    appState.predictions.find(
      item => item.id === id
    );

  if(!prediction){

    alert(
      "予想データが見つかりません。"
    );

    return;

  }


  const first =
    $("resultFirst").value;

  const second =
    $("resultSecond").value;

  const third =
    $("resultThird").value;


  if(!first || !second || !third){

    alert(
      "1着・2着・3着をすべて選択してください。"
    );

    return;

  }


  if(
    first === second ||
    first === third ||
    second === third
  ){

    alert(
      "1着・2着・3着は別々の馬を選択してください。"
    );

    return;

  }


  prediction.result = {

    first,
    second,
    third

  };


  prediction.resultSavedAt =
    new Date().toISOString();


  saveData();


  alert(
    "レース結果を保存しました！"
  );


  renderResultPage();

  renderStatsPage();

}


/* =================================
   完了レース
================================= */

function getFinishedPredictions(){

  return appState.predictions.filter(
    prediction =>
      prediction &&
      prediction.result &&
      prediction.result.first &&
      prediction.result.second &&
      prediction.result.third
  );

}


/* =================================
   円表示
================================= */

function formatYen(value){

  return (
    Number(value) || 0
  ).toLocaleString("ja-JP") +
  "円";

}


/* =================================
   集計
================================= */

function calculateStats(items){

  if(!items || items.length === 0){

    return {
      total:0,
      investment:0,
      returns:0,
      profit:0,
      recovery:0
    };

  }


  let investment = 0;
  let returns = 0;
  let profit = 0;


  items.forEach(item=>{

    investment +=
      Number(item.investment) || 0;

    returns +=
      Number(item.returnAmount) || 0;

    profit +=
      Number(item.profit) || 0;

  });


  return {

    total:items.length,

    investment,

    returns,

    profit,

    recovery:
      investment > 0
      ? returns / investment * 100
      : 0

  };

}


/* =================================
   グループ集計
================================= */

function buildStats(
  predictions,
  keyFunction
){

  const groups = {};

  predictions.forEach(prediction=>{

    const key =
      keyFunction(prediction);

    if(
      key === null ||
      key === undefined ||
      key === ""
    ){
      return;
    }

    if(!groups[key]){
      groups[key] = [];
    }

    groups[key].push(prediction);

  });


  return Object.keys(groups).map(
    label=>{

      const stats =
        calculateStats(
          groups[label]
        );

      return {
        label,
        total:stats.total,
        investment:stats.investment,
        returns:stats.returns,
        profit:stats.profit,
        recovery:stats.recovery
      };

    }
  );

}


/* =================================
   統計表
================================= */

function createStatsTable(data){

  if(!data || data.length === 0){

    return `
      <div class="empty">
        データがありません。
      </div>
    `;

  }


  return `

    <div class="table-wrap">

      <table class="stats-table">

        <thead>

          <tr>
            <th>項目</th>
            <th>件数</th>
            <th>投資</th>
            <th>回収</th>
            <th>収支</th>
            <th>回収率</th>
          </tr>

        </thead>

        <tbody>

          ${data.map(row=>`

            <tr>

              <td>
                ${escapeHTML(row.label)}
              </td>

              <td style="text-align:right;">
                ${row.total}
              </td>

              <td style="text-align:right;">
                ${formatYen(row.investment)}
              </td>

              <td style="text-align:right;">
                ${formatYen(row.returns)}
              </td>

              <td
                style="text-align:right;"
                class="${
                  Number(row.profit) >= 0
                  ? "profit-positive"
                  : "profit-negative"
                }">
                ${
                  Number(row.profit) >= 0
                  ? "+"
                  : ""
                }${formatYen(row.profit)}
              </td>

              <td style="
                text-align:right;
                font-weight:800;
              ">
                ${row.recovery.toFixed(1)}%
              </td>

            </tr>

          `).join("")}

        </tbody>

      </table>

    </div>

  `;

}

/* =================================
   累計収支グラフ
================================= */

function renderProfitChart(predictions){

  const canvas =
    $("profitChart");

  if(!canvas) return;


  const parent =
    canvas.parentElement;

  const width =
    Math.max(
      280,
      parent
      ? parent.clientWidth
      : 320
    );

  const height = 260;

  const ratio =
    window.devicePixelRatio || 1;


  canvas.width =
    width * ratio;

  canvas.height =
    height * ratio;

  canvas.style.width =
    width + "px";

  canvas.style.height =
    height + "px";


  const ctx =
    canvas.getContext("2d");


  ctx.setTransform(
    ratio,
    0,
    0,
    ratio,
    0,
    0
  );


  ctx.clearRect(
    0,
    0,
    width,
    height
  );


  if(
    !predictions ||
    predictions.length === 0
  ){

    ctx.fillStyle =
      "#98a2b3";

    ctx.font =
      "14px sans-serif";

    ctx.textAlign =
      "center";

    ctx.fillText(
      "結果が保存されたレースがありません",
      width / 2,
      height / 2
    );

    return;

  }


  let cumulative = 0;

  const values = [];


  predictions
    .slice()
    .reverse()
    .forEach(prediction=>{

      cumulative +=
        Number(prediction.profit) || 0;

      values.push(
        cumulative
      );

    });


  const dataMin =
    Math.min(0,...values);

  const dataMax =
    Math.max(0,...values);


  let minValue =
    Math.floor(
      dataMin / 500
    ) * 500;

  let maxValue =
    Math.ceil(
      dataMax / 500
    ) * 500;


  if(
    minValue === 0 &&
    maxValue === 0
  ){

    minValue = -1000;
    maxValue = 1000;

  }


  if(
    minValue === 0 &&
    maxValue > 0
  ){

    minValue = -500;

  }


  if(
    maxValue === 0 &&
    minValue < 0
  ){

    maxValue = 500;

  }


  const paddingLeft = 62;
  const paddingRight = 14;
  const paddingTop = 20;
  const paddingBottom = 35;


  const chartWidth =
    width -
    paddingLeft -
    paddingRight;

  const chartHeight =
    height -
    paddingTop -
    paddingBottom;


  function xPosition(index){

    if(values.length === 1){

      return (
        paddingLeft +
        chartWidth / 2
      );

    }

    return (
      paddingLeft +
      index /
      (values.length - 1) *
      chartWidth
    );

  }


  function yPosition(value){

    return (
      paddingTop +
      (
        maxValue - value
      ) /
      (
        maxValue - minValue
      ) *
      chartHeight
    );

  }


  for(
    let value=maxValue;
    value>=minValue;
    value-=500
  ){

    const y =
      yPosition(value);


    ctx.strokeStyle =
      "#e4e7ec";

    ctx.lineWidth = 1;

    ctx.beginPath();

    ctx.moveTo(
      paddingLeft,
      y
    );

    ctx.lineTo(
      width-paddingRight,
      y
    );

    ctx.stroke();


    ctx.fillStyle =
      "#667085";

    ctx.font =
      "10px sans-serif";

    ctx.textAlign =
      "right";


    const label =
      value > 0
      ? "+" +
        value.toLocaleString("ja-JP")
      : value.toLocaleString("ja-JP");


    ctx.fillText(
      label,
      paddingLeft-7,
      y+3
    );

  }


  const zeroY =
    yPosition(0);


  ctx.strokeStyle =
    "#667085";

  ctx.lineWidth = 2;

  ctx.beginPath();

  ctx.moveTo(
    paddingLeft,
    zeroY
  );

  ctx.lineTo(
    width-paddingRight,
    zeroY
  );

  ctx.stroke();


  ctx.beginPath();


  values.forEach(
    (value,index)=>{

      const x =
        xPosition(index);

      const y =
        yPosition(value);


      if(index === 0){

        ctx.moveTo(x,y);

      }else{

        ctx.lineTo(x,y);

      }

    }
  );


  ctx.strokeStyle =
    "#2563eb";

  ctx.lineWidth = 3;

  ctx.lineJoin =
    "round";

  ctx.lineCap =
    "round";

  ctx.stroke();


  values.forEach(
    (value,index)=>{

      const x =
        xPosition(index);

      const y =
        yPosition(value);


      ctx.beginPath();

      ctx.arc(
        x,
        y,
        3,
        0,
        Math.PI * 2
      );

      ctx.fillStyle =
        "#2563eb";

      ctx.fill();

    }
  );


  ctx.fillStyle =
    "#667085";

  ctx.font =
    "10px sans-serif";

  ctx.textAlign =
    "center";


  ctx.fillText(
    "1",
    xPosition(0),
    height-10
  );


  if(values.length > 1){

    ctx.fillText(
      String(values.length),
      xPosition(values.length-1),
      height-10
    );

  }

}


/* =================================
   履歴
================================= */

function renderHistoryPage(){

  const container =
    $("historyContent");

  if(!container) return;


  if(
    appState.predictions.length === 0
  ){

    container.innerHTML = `
      <div class="empty">
        まだ予想が保存されていません。
      </div>
    `;

    return;

  }


  container.innerHTML =
    appState.predictions
      .map(prediction=>{

        const title =
          prediction.raceName ||
          (
            prediction.track +
            " " +
            prediction.raceNo
          );


        const profit =
          Number(prediction.profit) || 0;


        const resultSaved =
          prediction.result &&
          prediction.result.first &&
          prediction.result.second &&
          prediction.result.third;


        const horses =
          Array.isArray(prediction.horses)
          ? prediction.horses
          : [];


        const horseText =
          horses
            .filter(h=>h.name)
            .map(h=>{

              const number =
                h.number
                ? h.number + "番 "
                : "";

              const mark =
                h.mark
                ? " " + h.mark
                : "";

              return (
                number +
                escapeHTML(h.name) +
                mark
              );

            })
            .join("、");


        return `

          <div style="
            border:1px solid #e4e7ec;
            border-radius:14px;
            padding:14px;
            margin-bottom:10px;
            background:#fff;
          ">

            <div style="
              font-size:16px;
              font-weight:800;
            ">
              ${escapeHTML(title)}
            </div>


            <div style="
              margin-top:6px;
              font-size:12px;
              color:#667085;
            ">
              ${escapeHTML(prediction.track)}
              ${escapeHTML(prediction.raceNo)}
              ／
              ${escapeHTML(prediction.surface || "")}
              ${escapeHTML(prediction.distance || "")}m
            </div>


            <div style="
              margin-top:10px;
              line-height:1.8;
              font-size:13px;
            ">

              <div>
                💰 投資：
                ${formatYen(prediction.investment)}
              </div>

              <div>
                💵 回収：
                ${formatYen(prediction.returnAmount)}
              </div>

              <div class="${
                profit >= 0
                ? "profit-positive"
                : "profit-negative"
              }">
                📊 収支：
                ${profit >= 0 ? "+" : ""}
                ${formatYen(profit)}
              </div>

              <div>
                ${
                  resultSaved
                  ? "🏁 結果入力済み"
                  : "⏳ 結果未入力"
                }
              </div>

            </div>


            ${
              horseText
              ? `
                <div style="
                  margin-top:10px;
                  padding:10px;
                  background:#f8fafc;
                  border-radius:10px;
                  font-size:12px;
                  line-height:1.8;
                ">
                  🐎 ${horseText}
                </div>
              `
              : ""
            }


            <button
              type="button"
              class="btn btn-secondary"
              style="margin-top:10px;"
              onclick="openHistoryResult('${prediction.id}')">
              ${
                resultSaved
                ? "🏁 結果を確認"
                : "🏁 結果を入力"
              }
            </button>


            <button
              type="button"
              class="btn btn-danger"
              style="margin-top:8px;"
              onclick="deletePrediction('${prediction.id}')">
              🗑 この予想を削除
            </button>

          </div>

        `;

      })
      .join("");

}


/* =================================
   履歴から結果
================================= */

function openHistoryResult(id){

  const prediction =
    appState.predictions.find(
      item=>item.id===id
    );

  if(!prediction){

    alert(
      "予想データが見つかりません。"
    );

    return;

  }


  appState.currentPredictionId =
    id;

  saveData();

  showPage("resultPage");

  openResultEditor(id);

}


/* =================================
   削除
================================= */

function deletePrediction(id){

  const prediction =
    appState.predictions.find(
      item=>item.id===id
    );

  if(!prediction) return;


  const title =
    prediction.raceName ||
    (
      prediction.track +
      " " +
      prediction.raceNo
    );


  if(
    !confirm(
      "「" +
      title +
      "」の予想を削除しますか？\n\n" +
      "この操作は元に戻せません。"
    )
  ){

    return;

  }


  appState.predictions =
    appState.predictions.filter(
      item=>item.id!==id
    );


  if(
    appState.currentPredictionId === id
  ){

    appState.currentPredictionId =
      null;

  }


  saveData();

  renderHistoryPage();

  renderResultPage();

  renderStatsPage();

}


/* =================================
   起動
================================= */

function initializeApp(){

  loadData();

  setupSelects();

  renderResultPage();

  renderHistoryPage();

  renderStatsPage();

}


/* =================================
   実行
================================= */

initializeApp();


/* =================================
   グラフサイズ変更
================================= */

window.addEventListener(
  "resize",
  function(){

    const active =
      document
        .querySelector(".page.active");

    if(
      active &&
      active.id === "statsPage"
    ){

      renderProfitChart(
        getFinishedPredictions()
      );

    }

  }
);
