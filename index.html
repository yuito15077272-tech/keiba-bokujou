<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>競馬牧場</title>

<style>
:root{
  --bg:#f4f6f8;
  --card:#fff;
  --ink:#172033;
  --muted:#667085;
  --line:#e4e7ec;
  --navy:#0f172a;
  --blue:#2563eb;
  --green:#16a34a;
  --red:#dc2626;
  --gold:#d4a72c;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,
  "Hiragino Kaku Gothic ProN","Yu Gothic",
  Meiryo,sans-serif;
}

button,input,select{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  max-width:760px;
  margin:auto;
  padding-bottom:92px;
}

header{
  position:sticky;
  top:0;
  z-index:30;
  background:linear-gradient(135deg,#0b1220,#1e293b);
  color:#fff;
  padding:17px 15px;
  box-shadow:0 3px 14px #0003;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.brand-mark{
  width:42px;
  height:42px;
  border-radius:13px;
  background:#ffffff12;
  display:grid;
  place-items:center;
  font-size:24px;
}

.title{
  font-size:23px;
  font-weight:950;
}

.subtitle{
  font-size:11px;
  color:#cbd5e1;
  margin-top:2px;
}

.page{
  display:none;
  padding:14px;
}

.page.active{
  display:block;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:17px;
  padding:15px;
  margin-bottom:12px;
  box-shadow:0 2px 10px #1018280a;
}

h2{
  font-size:18px;
  margin:0 0 12px;
  font-weight:950;
}

h3{
  font-size:15px;
  margin:0 0 9px;
}

label{
  display:block;
  font-size:12px;
  font-weight:900;
  color:var(--muted);
  margin-bottom:6px;
}

input,select{
  width:100%;
  height:46px;
  border:1px solid #d0d5dd;
  border-radius:11px;
  background:#fff;
  color:var(--ink);
  padding:0 12px;
  outline:none;
}

input:focus,select:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 3px #2563eb18;
}

.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.btn{
  border:0;
  border-radius:11px;
  min-height:44px;
  padding:10px 13px;
  font-weight:950;
}

.btn:active{
  transform:scale(.985);
}

.primary{
  background:var(--navy);
  color:#fff;
}

.green{
  background:var(--green);
  color:#fff;
}

.red{
  background:var(--red);
  color:#fff;
}

.light{
  background:#eef2f6;
  color:var(--ink);
}

.full{
  width:100%;
}

.small{
  font-size:12px;
  color:var(--muted);
}

.center{
  text-align:center;
}

.plus{
  color:var(--green)!important;
}

.minus{
  color:var(--red)!important;
}

/* ================= CHARACTER ================= */

.hero{
  overflow:hidden;
  background:linear-gradient(150deg,#f0fdf4,#fff);
}

.character-wrap{
  height:270px;
  border-radius:15px;
  background:
    linear-gradient(
      #dff3ff 0%,
      #e8f7dc 64%,
      #b9dda0 64%
    );
  position:relative;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  overflow:hidden;
  margin-bottom:11px;
}

.character-wrap:after{
  content:"";
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  height:58px;
  background:
    repeating-linear-gradient(
      155deg,
      #83b972 0 7px,
      #a9d494 7px 14px
    );
  opacity:.8;
}

.character-svg{
  position:relative;
  z-index:2;
  width:94%;
  height:250px;
  filter:drop-shadow(0 8px 5px #0003);
}

.levelline{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
}

.level{
  font-size:21px;
  font-weight:950;
}

.pill{
  border-radius:999px;
  padding:5px 9px;
  font-size:11px;
  font-weight:950;
  background:#eef2f6;
}

.expbar{
  height:11px;
  border-radius:99px;
  background:#e5e7eb;
  overflow:hidden;
  margin:8px 0;
}

.expfill{
  height:100%;
  width:0;
  background:linear-gradient(90deg,#22c55e,#a3e635);
  transition:width .5s;
}

/* ================= STATS ================= */

.statgrid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
}

.stat{
  background:#f8fafc;
  border:1px solid var(--line);
  border-radius:12px;
  padding:10px;
}

.stat .v{
  font-size:20px;
  font-weight:950;
  margin-top:3px;
}

/* ================= HORSES ================= */

.horse{
  border:1px solid var(--line);
  border-radius:14px;
  padding:10px;
  margin:8px 0;
  background:#fff;
}

.horse-row{
  display:grid;
  grid-template-columns:42px 1fr auto;
  gap:9px;
  align-items:center;
}

.number{
  font-size:18px;
  font-weight:950;
  text-align:center;
}

.mark-btn{
  border:1px solid #cfd4dc;
  background:#f8fafc;
  border-radius:10px;
  padding:8px 10px;
  min-width:88px;
  font-weight:950;
}

.mark-btn.set{
  background:#111827;
  color:#fff;
}

/* ================= MARK ================= */

.mark-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
}

.mark{
  border:0;
  border-radius:11px;
  padding:12px 10px;
  font-weight:950;
  font-size:16px;
}

.m-◎{background:#fee2e2;color:#b91c1c}
.m-○{background:#dbeafe;color:#1d4ed8}
.m-▲{background:#fef3c7;color:#92400e}
.m-☆{background:#fce7f3;color:#be185d}
.m-△{background:#dcfce7;color:#166534}
.m-消{background:#e5e7eb;color:#374151}
.m-－{background:#f3f4f6;color:#6b7280}

/* ================= RACE ================= */

.raceitem{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  border:1px solid var(--line);
  border-radius:13px;
  padding:12px;
  margin:8px 0;
  background:#fff;
}

.meta{
  font-size:12px;
  color:var(--muted);
  margin-top:3px;
}

.badge{
  border-radius:999px;
  padding:5px 9px;
  font-size:11px;
  font-weight:950;
  background:#eef2f6;
}

.badge.ok{
  background:#dcfce7;
  color:#166534;
}

.badge.ng{
  background:#fee2e2;
  color:#991b1b;
}

.sheet-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

canvas{
  width:100%;
  height:190px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#fff;
}

/* ================= NAV ================= */

.nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:40;
  background:#fff;
  border-top:1px solid var(--line);
  display:grid;
  grid-template-columns:repeat(4,1fr);
  padding-bottom:env(safe-area-inset-bottom);
}

.nav button{
  border:0;
  background:#fff;
  color:#667085;
  padding:9px 3px 8px;
  font-size:11px;
  font-weight:900;
}

.nav button strong{
  display:block;
  font-size:20px;
  line-height:21px;
}

.nav button.active{
  color:#111827;
}

/* ================= MODAL ================= */

.modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:60;
  background:#0008;
  align-items:flex-end;
}

.modal.show{
  display:flex;
}

.sheet{
  width:100%;
  max-width:760px;
  margin:auto;
  background:#fff;
  border-radius:20px 20px 0 0;
  padding:16px;
  max-height:90vh;
  overflow:auto;
}

.toast{
  position:fixed;
  left:50%;
  bottom:78px;
  z-index:90;
  transform:translate(-50%,20px);
  opacity:0;
  background:#111827;
  color:#fff;
  padding:11px 16px;
  border-radius:12px;
  font-weight:900;
  pointer-events:none;
  transition:.25s;
  white-space:nowrap;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

.evo-text{
  text-align:center;
  font-size:23px;
  font-weight:950;
  color:#b45309;
  margin:4px 0 10px;
}

.evo{
  animation:evo .7s ease;
}

@keyframes evo{
  0%{transform:scale(.5) rotate(-5deg);opacity:0}
  60%{transform:scale(1.1) rotate(2deg)}
  100%{transform:scale(1);opacity:1}
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:26px 8px;
}

@media(min-width:700px){
  .nav{
    position:static;
    max-width:760px;
    margin:auto;
    border:1px solid var(--line);
    border-radius:15px;
  }

  .app{
    padding-bottom:20px;
  }

  .toast{
    bottom:20px;
  }
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="brand">
    <div class="brand-mark">🐴</div>
    <div>
      <div class="title">競馬牧場</div>
      <div class="subtitle">予想するほど、あなたの馬が強くなる。</div>
    </div>
  </div>
</header>

<!-- HOME -->
<section id="home" class="page active">

  <div class="card hero">

    <div id="characterBox" class="character-wrap"></div>

    <div class="levelline">
      <div id="level" class="level">Lv.1</div>
      <div id="rank" class="pill">赤ちゃん馬</div>
    </div>

    <div class="small" id="expText">EXP 0 / 100</div>

    <div class="expbar">
      <div id="expFill" class="expfill"></div>
    </div>

    <div class="small">
      次の進化まであと
      <b id="nextText">100 EXP</b>
    </div>

  </div>

  <div class="card">

    <h2>📊 現在の成績</h2>

    <div class="statgrid">

      <div class="stat">
        <div class="small">総レース</div>
        <div id="sRaces" class="v">0</div>
      </div>

      <div class="stat">
        <div class="small">的中</div>
        <div id="sHits" class="v">0</div>
      </div>

      <div class="stat">
        <div class="small">回収率</div>
        <div id="sROI" class="v">0.0%</div>
      </div>

      <div class="stat">
        <div class="small">累計収支</div>
        <div id="sProfit" class="v">0円</div>
      </div>

    </div>

  </div>

  <button class="btn primary full" onclick="showPage('predict')">
    🏇 予想をはじめる
  </button>

  <div class="card" style="margin-top:12px">
    <h2>🌱 育成状況</h2>
    <div id="growthInfo" class="small"></div>
  </div>

</section>

<!-- PREDICT -->
<section id="predict" class="page">

  <div class="card">

    <h2>📝 予想を登録</h2>

    <div class="grid2">

      <div>
        <label>競馬場</label>
        <select id="track"></select>
      </div>

      <div>
        <label>レース</label>
        <select id="raceNo"></select>
      </div>

    </div>

    <div class="grid2" style="margin-top:10px">

      <div>
        <label>芝・ダート・障害</label>
        <select id="surface"></select>
      </div>

      <div>
        <label>距離</label>
        <select id="distance"></select>
      </div>

    </div>

    <div style="margin-top:10px">

      <label>頭数</label>
      <select id="fieldSize"></select>

    </div>

  </div>

  <div class="card">

    <h2>🐴 出走馬</h2>

    <div class="small">
      必要な馬だけ名前を入力して印を付けてもOK。
      5頭から18頭まで対応しています。
    </div>

    <div id="horses"></div>

  </div>

  <div class="card">

    <label>投資額</label>

    <input
      id="stake"
      type="number"
      min="0"
      step="100"
      placeholder="例：1000">

  </div>

  <button class="btn green full" onclick="savePrediction()">
    予想を登録する
  </button>

  <button
    id="editCancel"
    class="btn light full"
    style="display:none;margin-top:8px"
    onclick="cancelEdit()">
    編集をキャンセル
  </button>

</section>

<!-- RESULT -->
<section id="result" class="page">

  <div class="card">

    <h2>🏁 結果入力</h2>

    <div id="resultList"></div>

  </div>

</section>

<!-- HISTORY -->
<section id="history" class="page">

  <div class="card">

    <h2>📋 予想履歴</h2>

    <div id="historyList"></div>

  </div>

</section>

<!-- STATS -->
<section id="stats" class="page">

  <div class="card">

    <h2>📊 成績集計</h2>

    <div class="statgrid">

      <div class="stat">
        <div class="small">総レース</div>
        <div id="tRaces" class="v">0</div>
      </div>

      <div class="stat">
        <div class="small">的中率</div>
        <div id="tHitRate" class="v">0.0%</div>
      </div>

      <div class="stat">
        <div class="small">投資</div>
        <div id="tStake" class="v">0円</div>
      </div>

      <div class="stat">
        <div class="small">回収</div>
        <div id="tReturn" class="v">0円</div>
      </div>

      <div class="stat">
        <div class="small">回収率</div>
        <div id="tROI" class="v">0.0%</div>
      </div>

      <div class="stat">
        <div class="small">収支</div>
        <div id="tProfit" class="v">0円</div>
      </div>

    </div>

  </div>

  <div class="card">

    <h2>📈 累計収支推移</h2>

    <canvas id="chart"></canvas>

    <div
      id="chartNote"
      class="small center"
      style="margin-top:7px">
      結果入力したレースから自動計算
    </div>

  </div>

</section>

<nav class="nav">

  <button id="nav-home" onclick="showPage('home')">
    <strong>🏠</strong>
    ホーム
  </button>

  <button id="nav-predict" onclick="showPage('predict')">
    <strong>📝</strong>
    予想
  </button>

  <button id="nav-history" onclick="showPage('history')">
    <strong>📋</strong>
    履歴
  </button>

  <button id="nav-stats" onclick="showPage('stats')">
    <strong>📊</strong>
    成績
  </button>

</nav>

</div>

<!-- MARK MODAL -->
<div
  id="markModal"
  class="modal"
  onclick="if(event.target===this)closeMark()">

  <div class="sheet">

    <h2>🎯 印を選択</h2>

    <div id="markChoices" class="mark-grid"></div>

    <button
      class="btn light full"
      style="margin-top:9px"
      onclick="closeMark()">
      閉じる
    </button>

  </div>

</div>

<!-- DETAIL -->
<div
  id="detailModal"
  class="modal"
  onclick="if(event.target===this)closeDetail()">

  <div class="sheet">
    <div id="detailContent"></div>
  </div>

</div>

<!-- EVOLUTION -->
<div id="evoModal" class="modal">

  <div class="sheet center">

    <div class="evo-text">✨ 進化！ ✨</div>

    <div id="evoChar" class="character-wrap"></div>

    <h2 id="evoTitle"></h2>

    <div id="evoSub" class="small"></div>

    <button
      class="btn primary full"
      style="margin-top:12px"
      onclick="closeEvo()">
      これからも育てる！
    </button>

  </div>

</div>

<div id="toast" class="toast"></div>

<script>

"use strict";

/* ================================
   STORAGE
================================ */

const STORE="keiba_bokujou_v5";

const MARKS=[
  "◎","○","▲","☆","△","消","－"
];

const TRACKS=[
  "札幌","函館","福島","新潟",
  "東京","中山","中京","京都",
  "阪神","小倉"
];

const SURFACES=[
  "芝","ダート","障害"
];

const DIST={
  芝:[
    "1000m","1200m","1400m","1500m",
    "1600m","1800m","2000m","2200m",
    "2300m","2400m","2500m","2600m",
    "3000m","3200m","3400m","3600m"
  ],
  ダート:[
    "1000m","1150m","1200m","1300m",
    "1400m","1500m","1600m","1700m",
    "1800m","1900m","2000m","2100m",
    "2400m","2500m"
  ],
  障害:[
    "2860m","2880m","2890m","2900m",
    "2910m","2930m","2970m","3000m",
    "3110m","3170m","3200m","3250m",
    "3300m","3350m","3390m","3410m",
    "3570m","3900m"
  ]
};

let db=loadDatabase();
let editId=null;
let markHorse=null;
window.marksForm={};

/* ================================
   DATABASE
================================ */

function freshDatabase(){
  return{
    version:5,
    races:[],
    lastEvolution:1
  };
}

function normalizeRace(r){

  const result=r.result||{};

  const horses=Array.isArray(r.horses)
    ? r.horses
    : [];

  return{
    id:r.id||String(Date.now()+Math.random()),
    date:r.date||new Date().toISOString(),

    track:r.track||"東京",

    raceNo:Number(r.raceNo)||1,

    surface:r.surface||"芝",

    distance:r.distance||"1600m",

    fieldSize:Number(r.fieldSize)||horses.length||5,

    stake:Number(r.stake)||0,

    horses:horses.map((h,i)=>({
      no:Number(h.no)||i+1,
      name:String(h.name||""),
      mark:MARKS.includes(h.mark)?h.mark:"－"
    })),

    result:{
      first:String(result.first||""),
      second:String(result.second||""),
      third:String(result.third||""),

      /* 結果入力時に手入力した馬名も保存 */
      firstName:String(result.firstName||""),
      secondName:String(result.secondName||""),
      thirdName:String(result.thirdName||""),

      returned:Number(result.returned)||0,

      done:!!result.done
    }
  };
}

function loadDatabase(){

  try{

    const raw=
      localStorage.getItem(STORE)
      ||
      localStorage.getItem("keiba_bokujou_v4")
      ||
      localStorage.getItem("keiba_bokujou_v3");

    if(!raw){
      return freshDatabase();
    }

    const x=JSON.parse(raw);

    x.races=(x.races||[]).map(normalizeRace);

    x.version=5;

    x.lastEvolution=
      Number(x.lastEvolution)||1;

    return x;

  }catch(e){

    console.error(e);

    return freshDatabase();
  }
}

function persist(){

  localStorage.setItem(
    STORE,
    JSON.stringify(db)
  );
}

/* ================================
   HELPERS
================================ */

function esc(s){

  return String(s??"")
    .replace(
      /[&<>"']/g,
      c=>({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"
      }[c])
    );
}

function yen(n){

  return Number(n||0)
    .toLocaleString("ja-JP")+"円";
}

function profit(r){

  if(!r.result.done){
    return 0;
  }

  return Number(r.result.returned||0)
    -Number(r.stake||0);
}

function hit(r){

  if(!r.result.done){
    return false;
  }

  return Number(r.result.returned||0)>0;
}

function toast(message){

  const el=document.getElementById("toast");

  el.textContent=message;

  el.classList.add("show");

  setTimeout(()=>{
    el.classList.remove("show");
  },1800);
}

/* ================================
   LEVEL SYSTEM
================================ */

function levelInfo(exp){

  const level=Math.min(
    50,
    Math.floor(exp/100)+1
  );

  const stages=[
    [1,4,"赤ちゃん馬","foal"],
    [5,9,"子馬","young"],
    [10,14,"若駒","juvenile"],
    [15,19,"成長した若駒","grown"],
    [20,29,"競走馬","racehorse"],
    [30,39,"強豪競走馬","champion"],
    [40,44,"王者","king"],
    [45,49,"最強競走馬","legend"],
    [50,50,"伝説の馬","myth"]
  ];

  const stage=stages.find(
    x=>level>=x[0]&&level<=x[1]
  );

  return{
    level,
    name:stage[2],
    stage:stage[3],
    current:level===50?100:exp%100,
    need:100
  };
}

/* ================================
   ORIGINAL HORSE CHARACTERS
   進化ごとに完全に見た目を変更
================================ */

function horseSVG(stage){

  const data={

    foal:{

/* ================================

================================ */

function fillSelect(id,arr,value,race=false){

  const select=document.getElementById(id);

  select.innerHTML="";

  arr.forEach(item=>{

    select.add(
      new Option(
        race?item+"R":item,
        item
      )
    );

  });

  select.value=value;
}

/* ================================
   INIT
================================ */

function init(){

  fillSelect(
    "track",
    TRACKS,
    "東京"
  );

  fillSelect(
    "raceNo",
    Array.from(
      {length:12},
      (_,i)=>i+1
    ),
    11,
    true
  );

  fillSelect(
    "surface",
    SURFACES,
    "芝"
  );

  /* 5頭〜18頭 */

  fillSelect(
    "fieldSize",
    Array.from(
      {length:14},
      (_,i)=>i+5
    ),
    5,
    true
  );

  document.getElementById(
    "surface"
  ).onchange=updateDistance;

  document.getElementById(

  updateDistance();

  renderHorses();

/* ================================
   DISTANCE
================================ */

function updateDistance(){

  const surface=
    document.getElementById(
      "surface"
    ).value;

  let defaultDistance="1600m";

  if(surface==="ダート"){
    defaultDistance="1200m";
  }

  if(surface==="障害"){
    defaultDistance="3000m";
  }

  fillSelect(
    "distance",
    DIST[surface],
    defaultDistance
  );
}

================================ */

function renderHorses(existing){

  const count=
    Number(
      document.getElementById(
        "fieldSize"
      ).value
    )||5;

  window.marksForm={};

  const container=
    document.getElementById("horses");

  container.innerHTML="";

  for(let i=1;i<=count;i++){

    const h=
      existing?.[i-1]||{
        no:i,
        name:"",
        mark:"－"
      };

    window.marksForm[i]=h.mark||"－";

    const row=
      document.createElement("div");

    row.className="horse";

    row.innerHTML=`

      <div class="horse-row">

        <div class="number">
          ${i}
        </div>

        <div>

          <input
            data-name="${i}"
            value="${esc(h.name)}"
            placeholder="馬名を入力">

        </div>

        <button
          class="mark-btn ${
            h.mark!=="－"?"set":""
          }"
          onclick="openMark(${i})">

            h.mark==="－"

/* ================================
   MARK
================================ */

function openMark(no){

  markHorse=no;

  const box=
    document.getElementById(
      "markChoices"
    );

  box.innerHTML="";

  MARKS.forEach(mark=>{

    const button=
      document.createElement("button");

    button.className=
      "mark m-"+mark;

    button.textContent=
      mark==="－"
      ?"－ 無印"
      :mark;

    button.onclick=()=>{
      setMark(mark);
    };

    box.appendChild(button);
  });

  document.getElementById(
    "markModal"
  ).classList.add("show");
}

function setMark(mark){

  if(markHorse===null)return;

  window.marksForm[markHorse]=mark;

  const button=
    document.querySelector(
      `[onclick="openMark(${markHorse})"]`
    );

  if(button){

    button.textContent=
      mark==="－"
      ?"印を選択"
      :mark;

    button.classList.toggle(
      "set",
      mark!=="－"
    );
  }

  closeMark();

  toast(
    mark==="－"
    ?"無印"
    :"印「"+mark+"」"
  );
}

function closeMark(){

  document.getElementById(
    "markModal"
  ).classList.remove("show");

  markHorse=null;
}

/* ================================
   COLLECT
================================ */

function collectPrediction(){

  const count=
    Number(
      document.getElementById(
        "fieldSize"
      ).value
    )||5;

  const horses=[];

  for(let i=1;i<=count;i++){

    const input=
      document.querySelector(
        `[data-name="${i}"]`
      );

    horses.push({

      no:i,

      name:(input?.value||"").trim(),

      mark:
        window.marksForm[i]||"－"
    });
  }

  return{

    track:
      document.getElementById("track").value,

    raceNo:
      Number(
        document.getElementById("raceNo").value
      ),

    surface:
      document.getElementById("surface").value,

    distance:
      document.getElementById("distance").value,

    fieldSize:count,

    stake:
      Number(
        document.getElementById("stake").value
      )||0,

    horses
  };
}

/* ================================
   SAVE PREDICTION
================================ */

function savePrediction(){

  const form=collectPrediction();

  if(!form.horses.some(h=>h.name)){

    toast("馬名を1頭以上入力してください");

    return;
  }

  const oldLevel=
    levelInfo(calcExp()).level;

  if(editId){

    const index=
      db.races.findIndex(
        r=>String(r.id)===String(editId)
      );

    if(index>=0){

      db.races[index]=
        normalizeRace({
          ...db.races[index],
          ...form
        });
    }

    toast("予想を更新しました");

    editId=null;

    document.getElementById(
      "editCancel"
    ).style.display="none";

  }else{

    db.races.unshift(
      normalizeRace({

        ...form,

        id:String(
          Date.now()+Math.random()
        ),

        date:new Date().toISOString(),

        result:{
          done:false,
          first:"",
          second:"",
          third:"",
          firstName:"",
          secondName:"",
          thirdName:"",
          returned:0
        }
      })
    );

    toast("予想を登録しました");
  }

  persist();

  resetForm();

  refresh();

  const newLevel=
    levelInfo(calcExp()).level;

  if(newLevel>oldLevel){

    showEvolution(newLevel);
  }

  showPage("history");
}

function saveResult(id){

  const oldLevel=
    levelInfo(calcExp()).level;

      document.getElementById("res1Name").value.trim(),

      document.getElementById("res2Name").value.trim(),

    thirdName:
      document.getElementById("res3Name").value.trim(),

    returned:
      Number(
        document.getElementById("ret").value
      )||0,

    done:true
  };

  persist();

  refresh();

  const newLevel=
    levelInfo(calcExp()).level;

  toast(

  );

  if(newLevel>oldLevel){

    setTimeout(()=>{
      showEvolution(newLevel);
    },300);
  }
}

/* ================================
   EXP
   勝ち額・回収率・的中で加速
================================ */

function calcExp(){

  let exp=0;

  db.races.forEach(race=>{

    /* 予想登録 */
    exp+=10;

    if(!race.result.done){
      return;
    }

    /* 結果入力 */
    exp+=5;

    const stake=
      Number(race.stake)||0;

    const returned=
      Number(race.result.returned)||0;

    /* 的中 */
    if(returned>0){

      exp+=25;

      /* 回収率 */
      if(stake>0){

        const roi=
          returned/stake*100;

        if(roi>=100){
          exp+=15;
        }

        if(roi>=200){
          exp+=20;
        }

        if(roi>=500){
          exp+=35;
        }

        if(roi>=1000){
          exp+=50;
        }
      }

      /* 勝ち額ボーナス */

      const p=
        returned-stake;

      if(p>=1000) exp+=5;
      if(p>=5000) exp+=10;
      if(p>=10000) exp+=20;
      if(p>=50000) exp+=40;
      if(p>=100000) exp+=80;
    }

  });

  return Math.floor(exp);
}

/* ================================
   STATS
================================ */

function stats(){

  const done=
    db.races.filter(
      r=>r.result.done
    );

  const stake=
    db.races.reduce(
      (sum,r)=>
        sum+Number(r.stake||0),
      0
    );

  const returned=
    done.reduce(
      (sum,r)=>
        sum+
        Number(
          r.result.returned||0
        ),
      0
    );

  const hits=
    done.filter(hit).length;

  return{

    races:db.races.length,

    done:done.length,

    hits,

    stake,

    returned,

    profit:
      returned-stake,

    roi:
      stake
      ?returned/stake*100
      :0,

    hitRate:
      done.length
      ?hits/done.length*100
      :0
  };
}

                p>=0?"plus":"minus"
              }"
              style="
                font-weight:950;
                margin-top:4px
              ">

              ${
                race.result.done
                ?(p>=0?"+":"")+yen(p)
                :"—"
              }

            </div>

          </div>

        </div>
      `;
    }).join("");
}

/* ================================
   DETAIL
================================ */

function detail(id){

  const race=
    db.races.find(
      r=>String(r.id)===String(id)
    );

  if(!race)return;

  const horses=
    race.horses.map(h=>`

      <div class="horse">

        <div class="horse-row">

          <div class="number">
            ${h.no}
          </div>

          <div class="horse-name">
            ${esc(h.name||"未入力")}
          </div>

          <div class="mark m-${h.mark}">
            ${h.mark}
          </div>

        </div>

      </div>

    `).join("");

  const resultText=
    race.result.done
    ?`

      1着
      ${race.result.first||"—"}番
      ${esc(race.result.firstName||"")}

      <br>

      2着
      ${race.result.second||"—"}番
      ${esc(race.result.secondName||"")}

      <br>

      3着
      ${race.result.third||"—"}番
      ${esc(race.result.thirdName||"")}

      <br><br>

      払戻
      ${yen(race.result.returned)}

      <br>

      収支

      <b class="${
        profit(race)>=0?"plus":"minus"
      }">

        ${profit(race)>=0?"+":""}
        ${yen(profit(race))}

      </b>
    `
    :"結果未入力";

  document.getElementById(
    "detailContent"
  ).innerHTML=`

    <h2>
      🏇
      ${race.track}
      ${race.raceNo}R
    </h2>

    <div class="small">

      ${race.date.slice(0,10)}

      ｜${race.surface}
      ${race.distance}

      ｜${race.horses.length}頭

    </div>

    <div
      class="card"
      style="margin-top:10px;padding:11px">

      <b>結果</b>

      <div style="margin-top:7px">
        ${resultText}
      </div>

    </div>

    <h3>予想印</h3>

    ${horses}

    <div class="sheet-actions">

      <button
        class="btn primary"
        onclick="
          closeDetail();
          editRace('${race.id}')
        ">
        予想を編集
      </button>

      <button
        class="btn green"
        onclick="
          closeDetail();
          resultEditor('${race.id}')
        ">
        結果を編集
      </button>

    </div>

    <button
      class="btn red full"
      style="margin-top:8px"
      onclick="
        closeDetail();
        deleteRace('${race.id}')
      ">
      この予想を削除
    </button>

    <button
      class="btn light full"
      style="margin-top:8px"
      onclick="closeDetail()">
      閉じる
    </button>
  `;

  document.getElementById(
    "detailModal"
  ).classList.add("show");
}

function closeDetail(){

  document.getElementById(
    "detailModal"
  ).classList.remove("show");
}

================================ */

function renderResultList(){

  const box=
    document.getElementById(
      "resultList"
    );

  const pending=
    db.races.filter(
      r=>!r.result.done

  if(!pending.length){

    box.innerHTML=`

      <div class="empty">

    return;
  }

  box.innerHTML=
    pending.map(race=>`

      <div class="raceitem">

        <div>

          <b>
            ${race.track}
            ${race.raceNo}R
          </b>

          <div class="meta">

            ${race.surface}
            ${race.distance}

          </div>

        </div>

        <button
          class="btn primary"
          onclick="
            resultEditor('${race.id}')
          ">
          結果入力
        </button>

      </div>

    `).join("");
}

/* ================================
   CHART
================================ */

function drawChart(){

  const canvas=
    document.getElementById("chart");

  if(!canvas)return;

  const width=
    Math.max(
      320,
      canvas.clientWidth||320
    );

  const height=190;

  const dpr=
    Math.max(
      1,
      window.devicePixelRatio||1
    );

  canvas.width=width*dpr;
  canvas.height=height*dpr;

  const ctx=canvas.getContext("2d");

  ctx.setTransform(
    dpr,0,0,dpr,0,0
  );

  ctx.clearRect(
    0,0,width,height
  );

  const values=[];

  let total=0;

  db.races
    .slice()
    .reverse()
    .forEach(race=>{

      if(!race.result.done){
        return;
      }

      total+=profit(race);

      values.push(total);
    });

  if(!values.length){

    ctx.fillStyle="#667085";
    ctx.font="12px sans-serif";

    ctx.fillText(
      "結果入力したレースが増えるとグラフが表示されます",
      16,
      96
    );

    return;
  }

  const max=Math.max(
    1000,
    ...values.map(v=>Math.abs(v))
  );

  const pad=28;
  const middle=height/2;

  function y(v){

    return pad+
      (max-v)/(max*2)*
      (height-pad*2);
  }

  function x(i){

    if(values.length===1){
      return width/2;
    }

    return pad+
      i*(width-pad*2)/
      (values.length-1);
  }

  ctx.strokeStyle="#d0d5dd";
  ctx.lineWidth=1;

  ctx.beginPath();
  ctx.moveTo(pad,middle);
  ctx.lineTo(width-pad,middle);
  ctx.stroke();

  ctx.fillStyle="#667085";
  ctx.font="11px sans-serif";

  ctx.fillText(
    "+"+yen(max),
    4,
    14
  );

  ctx.fillText(
    "0円",
    6,
    middle-4
  );

  ctx.fillText(
    yen(-max),
    4,
    height-4
  );

  ctx.beginPath();

  values.forEach((v,i)=>{

    if(i){
      ctx.lineTo(x(i),y(v));
    }else{
      ctx.moveTo(x(i),y(v));
    }

  });

  ctx.strokeStyle="#2563eb";
  ctx.lineWidth=2.4;
  ctx.stroke();

  values.forEach((v,i)=>{

    ctx.beginPath();

    ctx.arc(
      x(i),
      y(v),
      3.4,
      0,
      Math.PI*2
    );

    ctx.fillStyle=
      v>=0
      ?" #16a34a"
      :"#dc2626";

    ctx.fill();
  });

  document.getElementById(
    "chartNote"
  ).textContent=
    `${values.length}レース｜最終累計 `+
    (total>=0?"+":"")+
    yen(total);
}

/* ================================
   PAGE
================================ */

function showPage(id){

  document.querySelectorAll(
    ".page"
  ).forEach(
    el=>el.classList.remove("active")
  );

  document.getElementById(
    id
  ).classList.add("active");

  document.querySelectorAll(
    ".nav button"
  ).forEach(
    el=>el.classList.remove("active")
  );

  const nav=
    document.getElementById(
      "nav-"+id
    );

  if(nav){
    nav.classList.add("active");
  }

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

  if(id==="stats"){

    setTimeout(
      drawChart,
      50
    );
  }
}
