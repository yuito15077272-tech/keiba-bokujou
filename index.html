<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#101827">
<title>競馬牧場DX</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:#eef1f5;
  color:#172033;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",
  "Yu Gothic",Meiryo,sans-serif;
}

button,input,select{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  width:100%;
  max-width:760px;
  margin:auto;
  padding-bottom:40px;
}

/* HEADER */

.header{
  background:linear-gradient(135deg,#0b1220,#263858);
  color:#fff;
  padding:20px 16px 17px;
  border-bottom:4px solid #d5a82c;
  box-shadow:0 7px 22px #0002;
}

.logo{
  font-size:27px;
  font-weight:1000;
  color:#fff;
  text-shadow:0 2px 5px #000;
}

.subtitle{
  margin-top:5px;
  font-size:10px;
  color:#dce4ef;
  font-weight:bold;
}

/* NAV */

.nav{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
  padding:10px 12px;
  background:#fff;
  position:sticky;
  top:0;
  z-index:20;
  box-shadow:0 2px 10px #0001;
}

.nav button{
  border:0;
  border-radius:11px;
  padding:11px 3px;
  background:#f1f3f6;
  color:#687386;
  font-size:11px;
  font-weight:1000;
}

.nav button.active{
  background:#111827;
  color:#fff;
}

/* PAGE */

.page{
  display:none;
  padding:0 12px;
}

.page.active{
  display:block;
}

/* TITLES */

.title{
  margin:17px 2px 9px;
  color:#111827;
  font-size:17px;
  font-weight:1000;
  text-shadow:0 1px #fff;
}

/* CARD */

.card{
  background:#fff;
  border-radius:17px;
  padding:14px;
  box-shadow:0 5px 20px #17203312;
}

/* HOME */

.balanceCard{
  margin-top:8px;
  background:linear-gradient(135deg,#101827,#2c3e5e);
  border-radius:19px;
  color:#fff;
  padding:18px;
}

.balanceLabel{
  color:#d7b34a;
  font-size:9px;
  font-weight:1000;
}

.balance{
  margin-top:7px;
  font-size:30px;
  font-weight:1000;
}

.stats{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
  margin-top:9px;
}

.stat{
  background:#fff;
  border-radius:14px;
  padding:12px;
  box-shadow:0 4px 15px #1720330d;
}

.stat small{
  display:block;
  color:#788396;
  font-size:9px;
  font-weight:bold;
}

.stat strong{
  display:block;
  margin-top:4px;
  font-size:16px;
  font-weight:1000;
}

.green{
  color:#129568!important;
}

.red{
  color:#d93847!important;
}

/* SELECT */

.label{
  margin:11px 0 6px;
  color:#687386;
  font-size:9px;
  font-weight:1000;
}

.scroll{
  display:flex;
  gap:6px;
  overflow-x:auto;
  padding-bottom:3px;
  scrollbar-width:none;
}

.scroll::-webkit-scrollbar{
  display:none;
}

.choice{
  flex:0 0 auto;
  border:1px solid #dce1e8;
  border-radius:11px;
  background:#f8fafc;
  color:#172033;
  padding:10px 13px;
  font-size:11px;
  font-weight:1000;
}

.choice.active{
  background:#111827;
  color:#fff;
  border-color:#111827;
}

/* FORM */

.form{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.full{
  grid-column:1/-1;
}

label{
  display:block;
  margin-bottom:5px;
  color:#687386;
  font-size:9px;
  font-weight:1000;
}

input,select{
  width:100%;
  border:1px solid #dce1e8;
  border-radius:11px;
  background:#f8fafc;
  color:#172033;
  padding:11px;
  font-size:14px;
  outline:none;
}

input:focus,select:focus{
  background:#fff;
  border-color:#5d51d8;
}

/* HORSE */

.horseRow{
  display:grid;
  grid-template-columns:45px 1fr;
  gap:9px;
  padding:11px 0;
  border-bottom:1px solid #e4e7ec;
}

.frame{
  width:42px;
  height:42px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:9px;
  border:1px solid #aaa;
  font-size:17px;
  font-weight:1000;
}

.f1{background:#fff;color:#111;}
.f2{background:#111;color:#fff;}
.f3{background:#d93643;color:#fff;}
.f4{background:#2b71ca;color:#fff;}
.f5{background:#f0cd27;color:#111;}
.f6{background:#2fa25b;color:#fff;}
.f7{background:#ee8a22;color:#fff;}
.f8{background:#e76ca0;color:#fff;}

.horseName{
  font-size:13px;
  font-weight:1000;
  margin-bottom:5px;
}

.markList{
  display:flex;
  gap:4px;
  overflow-x:auto;
  scrollbar-width:none;
}

.markList::-webkit-scrollbar{
  display:none;
}

.mark{
  flex:0 0 39px;
  border:1px solid #dce1e8;
  border-radius:8px;
  background:#f7f9fb;
  padding:7px 2px;
  font-weight:1000;
  color:#172033;
}

.mark.active{
  background:#5d51d8;
  color:#fff;
  border-color:#5d51d8;
}

.horseInput{
  margin-bottom:5px;
}

.horseInput input{
  padding:8px;
  font-size:12px;
}

.horseActions{
  margin-top:5px;
}

.removeBtn{
  border:0;
  background:#f1f3f6;
  color:#7c8798;
  padding:5px 9px;
  border-radius:7px;
  font-size:9px;
}

/* BUTTONS */

.primary{
  width:100%;
  border:0;
  border-radius:12px;
  background:#5d51d8;
  color:#fff;
  padding:14px;
  margin-top:11px;
  font-weight:1000;
}

.resultButton{
  background:#129568;
}

.deleteButton{
  width:100%;
  border:0;
  border-radius:11px;
  background:#fff0f2;
  color:#d93847;
  padding:11px;
  margin-top:8px;
  font-weight:1000;
}

/* RESULT */

.resultGrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
}

.resultBox{
  background:#f7f9fb;
  border:1px solid #dce1e8;
  border-radius:11px;
  padding:9px;
}

.resultBox input{
  text-align:center;
}

/* HISTORY */

.history{
  background:#fff;
  border-radius:17px;
  padding:0 14px;
  box-shadow:0 5px 20px #17203312;
}

.historyItem{
  padding:14px 0;
  border-bottom:1px solid #e3e6eb;
  cursor:pointer;
}

.historyItem:last-child{
  border-bottom:0;
}

.historyTop{
  display:flex;
  justify-content:space-between;
  gap:8px;
}

.historyName{
  font-size:13px;
  font-weight:1000;
}

.historyMeta{
  margin-top:4px;
  color:#7a8494;
  font-size:9px;
}

.historyProfit{
  text-align:right;
  font-size:13px;
  font-weight:1000;
}

/* DETAIL */

.detailHead{
  background:#f5f7fa;
  border:1px solid #dce1e8;
  border-radius:14px;
  padding:12px;
}

.detailTitle{
  font-size:17px;
  font-weight:1000;
}

.detailMeta{
  margin-top:4px;
  color:#758093;
  font-size:9px;
}

.detailHorse{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:9px 0;
  border-bottom:1px solid #e4e7ec;
}

.detailMark{
  background:#f0f2f5;
  border-radius:8px;
  padding:6px 10px;
  font-weight:1000;
}

/* GRAPH */

.graphCard{
  background:#fff;
  border-radius:17px;
  padding:10px 8px 12px;
  box-shadow:0 5px 20px #17203312;
}

#graph{
  display:block;
  width:100%;
  height:190px;
}

.graphStats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
}

.graphStat{
  text-align:center;
  background:#f6f8fa;
  border-radius:9px;
  padding:8px 4px;
}

.graphStat small{
  display:block;
  font-size:8px;
  color:#7a8494;
}

.graphStat strong{
  display:block;
  margin-top:3px;
  font-size:11px;
}

/* EMPTY */

.empty{
  padding:16px 4px;
  text-align:center;
  color:#7b8595;
  font-size:10px;
}

/* TOAST */

.toast{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translate(-50%,20px);
  background:#111827;
  color:#fff;
  padding:11px 17px;
  border-radius:30px;
  font-size:10px;
  opacity:0;
  pointer-events:none;
  transition:.2s;
  z-index:100;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

@media(max-width:430px){
  .form{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }
}
</style>
</head>

<body>

<div class="app">

<div class="header">
  <div class="logo">🏇 競馬牧場DX</div>
  <div class="subtitle">
    予想・結果・収支をひとつにまとめる自分専用競馬管理帳
  </div>
</div>

<div class="nav">
  <button id="navHome" class="active" onclick="showPage('home')">🏠 ホーム</button>
  <button id="navPredict" onclick="showPage('predict')">🔮 予想登録</button>
  <button id="navHistory" onclick="showPage('history')">📋 履歴</button>
</div>


<!-- ================= HOME ================= -->

<section id="home" class="page active">

  <div class="balanceCard">
    <div class="balanceLabel">TOTAL PROFIT</div>
    <div id="balance" class="balance">¥0</div>
  </div>

  <div class="stats">

    <div class="stat">
      <small>総投資</small>
      <strong id="totalBet">¥0</strong>
    </div>

    <div class="stat">
      <small>総回収</small>
      <strong id="totalReturn">¥0</strong>
    </div>

    <div class="stat">
      <small>総収支</small>
      <strong id="totalProfit">¥0</strong>
    </div>

    <div class="stat">
      <small>回収率</small>
      <strong id="roi">—</strong>
    </div>

    <div class="stat">
      <small>予想レース</small>
      <strong id="raceCount">0R</strong>
    </div>

    <div class="stat">
      <small>的中率</small>
      <strong id="hitRate">—</strong>
    </div>

  </div>

  <h2 class="title">📊 成績</h2>

  <div class="stats">

    <div class="stat">
      <small>結果入力済</small>
      <strong id="resultCount">0R</strong>
    </div>

    <div class="stat">
      <small>的中</small>
      <strong id="hitCount">0R</strong>
    </div>

    <div class="stat">
      <small>不的中</small>
      <strong id="missCount">0R</strong>
    </div>

  </div>

  <h2 class="title">📈 収支推移</h2>

  <div class="graphCard">

    <canvas id="graph"></canvas>

    <div class="graphStats">

      <div class="graphStat">
        <small>最大プラス</small>
        <strong id="maxPlus" class="green">+¥0</strong>
      </div>

      <div class="graphStat">
        <small>現在収支</small>
        <strong id="graphCurrent">¥0</strong>
      </div>

      <div class="graphStat">
        <small>最大マイナス</small>
        <strong id="maxMinus" class="red">¥0</strong>
      </div>

    </div>

  </div>

</section>


<!-- ================= PREDICT ================= -->

<section id="predict" class="page">

  <h2 class="title">🔮 予想登録</h2>

  <div class="card">

    <div class="label">🏟️ 競馬場</div>

    <div class="scroll" id="trackList">

      <button class="choice" onclick="selectTrack(this,'札幌')">札幌</button>
      <button class="choice" onclick="selectTrack(this,'函館')">函館</button>
      <button class="choice" onclick="selectTrack(this,'福島')">福島</button>
      <button class="choice" onclick="selectTrack(this,'新潟')">新潟</button>
      <button class="choice" onclick="selectTrack(this,'東京')">東京</button>
      <button class="choice" onclick="selectTrack(this,'中山')">中山</button>
      <button class="choice" onclick="selectTrack(this,'中京')">中京</button>
      <button class="choice" onclick="selectTrack(this,'京都')">京都</button>
      <button class="choice" onclick="selectTrack(this,'阪神')">阪神</button>
      <button class="choice" onclick="selectTrack(this,'小倉')">小倉</button>

    </div>


    <div class="label">🌱 馬場</div>

    <div class="scroll" id="surfaceList">

      <button class="choice" onclick="selectSurface(this,'芝')">🌱 芝</button>

      <button class="choice" onclick="selectSurface(this,'ダート')">🟤 ダート</button>

      <button class="choice" onclick="selectSurface(this,'障害')">🐎 障害</button>

    </div>


    <div class="label">📏 距離</div>

    <div class="scroll" id="distanceList">
      <div class="empty">競馬場と馬場を選択してください</div>
    </div>


    <div class="label">🏁 レース</div>

    <div class="scroll" id="raceList">

      <script>
      for(let i=1;i<=12;i++){
        document.write(
          `<button class="choice" onclick="selectRace(this,'${i}R')">${i}R</button>`
        );
      }
      </script>

    </div>


    <div class="label">🐴 頭数</div>

    <div class="scroll" id="countList">

      <script>
      for(let i=8;i<=18;i++){
        document.write(
          `<button class="choice" onclick="selectCount(this,${i})">${i}頭</button>`
        );
      }
      </script>

    </div>


    <div class="form" style="margin-top:9px">

      <div>
        <label>開催日</label>
        <input type="date" id="raceDate">
      </div>

      <div>
        <label>レース名</label>
        <input id="raceName" placeholder="例：新潟記念">
      </div>

    </div>

  </div>


  <h2 class="title">🐴 出走馬</h2>

  <div class="card">

    <div id="horseList">

      <div class="empty">
        まず頭数を選択してください。
      </div>

    </div>

  </div>


  <h2 class="title">💰 買い目</h2>

  <div class="card">

    <div class="form">

      <div>
        <label>投資額</label>
        <input id="betMoney" type="number" min="0" placeholder="3000">
      </div>

      <div>
        <label>券種</label>

        <select id="betType">

          <option>3連複</option>
          <option>3連単</option>
          <option>馬連</option>
          <option>馬単</option>
          <option>ワイド</option>
          <option>単勝</option>
          <option>複勝</option>
          <option>その他</option>

        </select>

      </div>

      <div class="full">

        <label>買い目</label>

        <input id="buyText" placeholder="例：◎－○▲－○▲△">

      </div>

    </div>

    <button class="primary" onclick="savePrediction()">
      🔮 予想を登録
    </button>

  </div>


  <!-- RESULT AREA -->

  <div id="resultArea" style="display:none">

    <h2 class="title">🏁 結果入力</h2>

    <div class="card">

      <div id="resultRaceTitle"
           style="font-size:17px;font-weight:1000;margin-bottom:10px">
      </div>

      <div class="resultGrid">

        <div class="resultBox">
          <label>🥇 1着</label>
          <input id="firstPlace" placeholder="馬名">
        </div>

        <div class="resultBox">
          <label>🥈 2着</label>
          <input id="secondPlace" placeholder="馬名">
        </div>

        <div class="resultBox">
          <label>🥉 3着</label>
          <input id="thirdPlace" placeholder="馬名">
        </div>

      </div>


      <div class="form" style="margin-top:9px">

        <div>
          <label>回収額</label>
          <input id="returnMoney" type="number" min="0" placeholder="0">
        </div>

        <div>
          <label>結果</label>

          <select id="resultHit">
            <option value="true">🎯 的中</option>
            <option value="false">❌ 不的中</option>
          </select>

        </div>

      </div>


      <button class="primary resultButton" onclick="saveResult()">
        💰 結果を保存して収支へ反映
      </button>

    </div>

  </div>

</section>


<!-- ================= HISTORY ================= -->

<section id="history" class="page">

  <h2 class="title">📋 予想履歴</h2>

  <div id="historyList" class="history">

    <div class="empty">
      まだ予想がありません。
    </div>

  </div>

</section>


<!-- ================= DETAIL ================= -->

<section id="detail" class="page">

  <button class="choice" onclick="showPage('history')">
    ← 履歴へ戻る
  </button>

  <h2 class="title">🔎 レース詳細</h2>

  <div id="detailContent"></div>

</section>

</div>


<div id="toast" class="toast"></div>


<script>

/* ==========================================
   DATA
========================================== */

const STORAGE_KEY="keiba_bokujou_v2";

let db;

try{

  db=JSON.parse(
    localStorage.getItem(STORAGE_KEY)
  );

}catch(e){

  db=null;

}

if(!db || !Array.isArray(db.races)){

  db={
    races:[]
  };

}

let state={
  track:"",
  surface:"",
  distance:"",
  race:"",
  count:0,
  horses:[],
  editingId:null,
  resultId:null
};


/* ==========================================
   SAVE
========================================== */

function saveDB(){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(db)
  );

}


/* ==========================================
   PAGE
========================================== */

function showPage(name){

  document.querySelectorAll(".page")
    .forEach(p=>p.classList.remove("active"));

  document.getElementById(name)
    .classList.add("active");

  document.querySelectorAll(".nav button")
    .forEach(b=>b.classList.remove("active"));

  if(name==="home"){
    document.getElementById("navHome").classList.add("active");
    updateDashboard();
  }

  if(name==="predict"){
    document.getElementById("navPredict").classList.add("active");
  }

  if(name==="history"){
    document.getElementById("navHistory").classList.add("active");
    renderHistory();
  }

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* ==========================================
   TOAST
========================================== */

function toast(message){

  const el=document.getElementById("toast");

  el.textContent=message;

  el.classList.add("show");

  setTimeout(()=>{
    el.classList.remove("show");
  },1800);

}


/* ==========================================
   ACTIVE BUTTON
========================================== */

function activate(parent,btn){

  document.querySelectorAll(
    parent+" .choice"
  ).forEach(x=>{
    x.classList.remove("active");
  });

  btn.classList.add("active");

}


/* ==========================================
   TRACK
========================================== */

function selectTrack(btn,value){

  activate("#trackList",btn);

  state.track=value;

  state.distance="";

  renderDistances();

}


/* ==========================================
   SURFACE
========================================== */

function selectSurface(btn,value){

  activate("#surfaceList",btn);

  state.surface=value;

  state.distance="";

  renderDistances();

}


/* ==========================================
   DISTANCES
========================================== */

const distanceData={

札幌:{
芝:[1200,1500,1800,2000,2600],
ダート:[1000,1700,2400],
障害:[2800]
},

函館:{
芝:[1200,1800,2000,2600],
ダート:[1000,1700,2400],
障害:[2860]
},

福島:{
芝:[1200,1700,1800,2000,2600],
ダート:[1150,1700,2400],
障害:[2750,2770,2800,2850,2860,2900,3350]
},

新潟:{
芝:[1000,1200,1400,1600,1800,2000,2200,2400,2890,3000],
ダート:[1200,1800,2500],
障害:[2850,2890,3250,3290,3330,3500]
},

東京:{
芝:[1400,1600,1800,2000,2300,2400,2500,3400],
ダート:[1300,1400,1600,2100,2400],
障害:[3000,3100,3300,3400,3500,3570]
},

中山:{
芝:[1200,1600,1800,2000,2200,2500,3600],
ダート:[1200,1800,2400,2500],
障害:[2700,2880,3200,3210,3350,3570,4100]
},

中京:{
芝:[1200,1400,1600,2000,2200],
ダート:[1200,1400,1800,1900],
障害:[3000,3300,3900]
},

京都:{
芝:[1200,1400,1600,1800,2000,2200,2400,3000,3200],
ダート:[1200,1400,1800,1900],
障害:[2910,3170,3930]
},

阪神:{
芝:[1200,1400,1600,1800,2000,2200,2400,2600,3000,3200],
ダート:[1200,1400,1800,2000],
障害:[2970,3110,3140,3170,3900]
},

小倉:{
芝:[1200,1800,2000,2600],
ダート:[1000,1700,2400],
障害:[2860,2900,3390]
}

};


function renderDistances(){

  const box=document.getElementById("distanceList");

  if(!state.track || !state.surface){

    box.innerHTML=
      `<div class="empty">
        競馬場と馬場を選択してください
      </div>`;

    return;

  }

  const list=
    distanceData[state.track]?.[state.surface] || [];

  box.innerHTML=list.map(d=>`

    <button
      class="choice"
      onclick="selectDistance(this,${d})"
    >
      ${d}m
    </button>

  `).join("");

}


function selectDistance(btn,value){

  activate("#distanceList",btn);

  state.distance=value;

}


/* ==========================================
   RACE
========================================== */

function selectRace(btn,value){

  activate("#raceList",btn);

  state.race=value;

}


/* ==========================================
   COUNT
========================================== */

function selectCount(btn,value){

  activate("#countList",btn);

  state.count=value;

  createHorses(value);

}


/* ==========================================
   HORSES
========================================== */

function createHorses(count){

  state.horses=[];

  for(let i=1;i<=count;i++){

    state.horses.push({

      id:
        Date.now()+
        Math.random(),

      no:i,

      name:"",

      mark:""

    });

  }

  renderHorses();

}


function frameClass(no){

  if(no<=2)return "f1";
  if(no<=4)return "f2";
  if(no<=6)return "f3";
  if(no<=8)return "f4";
  if(no<=10)return "f5";
  if(no<=12)return "f6";
  if(no<=14)return "f7";
  return "f8";

}


function renderHorses(){

  const box=document.getElementById("horseList");

  if(!state.horses.length){

    box.innerHTML=
      `<div class="empty">
        まず頭数を選択してください。
      </div>`;

    return;

  }


  box.innerHTML=state.horses.map(h=>`

    <div class="horseRow">

      <div class="frame ${frameClass(h.no)}">
        ${h.no}
      </div>

      <div>

        <div class="horseInput">

          <input
            value="${escapeHTML(h.name)}"
            placeholder="${h.no}番の馬名"
            oninput="changeHorseName('${h.id}',this.value)"
          >

        </div>

        <div class="markList">

          ${["◎","○","▲","☆","△","消"].map(mark=>`

            <button
              class="mark ${h.mark===mark?"active":""}"
              onclick="setHorseMark('${h.id}','${mark}')"
            >
              ${mark}
            </button>

          `).join("")}

        </div>

      </div>

    </div>

  `).join("");

}


function changeHorseName(id,name){

  const h=state.horses.find(
    x=>String(x.id)===String(id)
  );

  if(h){
    h.name=name;
  }

}


function setHorseMark(id,mark){

  const h=state.horses.find(
    x=>String(x.id)===String(id)
  );

  if(!h)return;

  h.mark=mark;

  renderHorses();

}


function escapeHTML(text){

  return String(text||"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* ==========================================
   SAVE PREDICTION
========================================== */

function savePrediction(){

  if(!state.track){
    toast("競馬場を選択してください");
    return;
  }

  if(!state.surface){
    toast("芝・ダート・障害を選択してください");
    return;
  }

  if(!state.distance){
    toast("距離を選択してください");
    return;
  }

  if(!state.race){
    toast("レースを選択してください");
    return;
  }

  if(!state.count){
    toast("頭数を選択してください");
    return;
  }

  if(!state.horses.some(h=>h.name.trim())){

    toast("馬名を1頭以上入力してください");

    return;

  }


  const race={

    id:Date.now(),

    date:
      document.getElementById("raceDate").value ||
      new Date().toISOString().slice(0,10),

    track:state.track,

    surface:state.surface,

    distance:state.distance,

    race:state.race,

    count:state.count,

    raceName:
      document.getElementById("raceName").value.trim() ||
      "レース",

    horses:
      JSON.parse(JSON.stringify(state.horses)),

    bet:
      Number(
        document.getElementById("betMoney").value
      )||0,

    betType:
      document.getElementById("betType").value,

    buy:
      document.getElementById("buyText").value.trim(),

    result:null

  };


  db.races.push(race);

  saveDB();

  state.resultId=race.id;

  openResultArea(race);

  toast("予想を登録しました");

}


/* ==========================================
   RESULT AREA
========================================== */

function openResultArea(race){

  const area=document.getElementById("resultArea");

  area.style.display="block";

  document.getElementById("resultRaceTitle").textContent=
    `${race.track} ${race.race} ${race.raceName}`;

  if(race.result){

    document.getElementById("firstPlace").value=
      race.result.first||"";

    document.getElementById("secondPlace").value=
      race.result.second||"";

    document.getElementById("thirdPlace").value=
      race.result.third||"";

    document.getElementById("returnMoney").value=
      race.result.returnMoney||0;

    document.getElementById("resultHit").value=
      String(race.result.hit);

  }else{

    document.getElementById("firstPlace").value="";
    document.getElementById("secondPlace").value="";
    document.getElementById("thirdPlace").value="";
    document.getElementById("returnMoney").value="0";
    document.getElementById("resultHit").value="false";

  }

  area.scrollIntoView({
    behavior:"smooth",
    block:"start"
  });

}


/* ==========================================
   SAVE RESULT
========================================== */

function saveResult(){

  if(!state.resultId){

    toast("対象レースがありません");

    return;

  }


  const race=db.races.find(
    x=>x.id===state.resultId
  );

  if(!race){

    toast("対象レースが見つかりません");

    return;

  }


  race.result={

    first:
      document.getElementById("firstPlace").value.trim(),

    second:
      document.getElementById("secondPlace").value.trim(),

    third:
      document.getElementById("thirdPlace").value.trim(),

    returnMoney:
      Number(
        document.getElementById("returnMoney").value
      )||0,

    hit:
      document.getElementById("resultHit").value==="true"

  };


  saveDB();

  updateDashboard();

  renderHistory();

  drawGraph();

  toast("結果を保存しました！収支に反映しました");


  setTimeout(()=>{

    showPage("home");

  },700);

}


/* ==========================================
   DASHBOARD
========================================== */

function calculate(){

  let totalBet=0;
  let totalReturn=0;
  let resultCount=0;
  let hitCount=0;

  db.races.forEach(r=>{

    totalBet+=Number(r.bet)||0;

    if(r.result){

      resultCount++;

      totalReturn+=
        Number(r.result.returnMoney)||0;

      if(r.result.hit){
        hitCount++;
      }

    }

  });


  return{

    totalBet,

    totalReturn,

    profit:
      totalReturn-totalBet,

    resultCount,

    hitCount,

    missCount:
      resultCount-hitCount,

    raceCount:
      db.races.length,

    roi:
      totalBet?
      totalReturn/totalBet*100:
      0,

    hitRate:
      resultCount?
      hitCount/resultCount*100:
      0

  };

}


function yen(value){

  return "¥"+
    Math.abs(Number(value)||0)
      .toLocaleString("ja-JP");

}


function updateDashboard(){

  const s=calculate();

  const balance=document.getElementById("balance");

  balance.textContent=
    (s.profit>=0?"+":"-")+yen(s.profit);

  balance.className=
    "balance "+(s.profit>=0?"green":"red");


  document.getElementById("totalBet").textContent=
    yen(s.totalBet);

  document.getElementById("totalReturn").textContent=
    yen(s.totalReturn);


  const tp=document.getElementById("totalProfit");

  tp.textContent=
    (s.profit>=0?"+":"-")+yen(s.profit);

  tp.className=
    s.profit>=0?"green":"red";


  document.getElementById("roi").textContent=
    s.totalBet?
    s.roi.toFixed(1)+"%":
    "—";


  document.getElementById("raceCount").textContent=
    s.raceCount+"R";


  document.getElementById("resultCount").textContent=
    s.resultCount+"R";

  document.getElementById("hitCount").textContent=
    s.hitCount+"R";

  document.getElementById("missCount").textContent=
    s.missCount+"R";


  document.getElementById("hitRate").textContent=
    s.resultCount?
    s.hitRate.toFixed(1)+"%":
    "—";


  drawGraph();

}


/* ==========================================
   HISTORY
========================================== */

function renderHistory(){

  const box=document.getElementById("historyList");

  if(!db.races.length){

    box.innerHTML=
      `<div class="empty">
        まだ予想がありません。
      </div>`;

    return;

  }


  box.innerHTML=
    db.races
      .slice()
      .reverse()
      .map(r=>{

        let profit=0;
        let status="⏳ 結果待ち";

        if(r.result){

          profit=
            Number(r.result.returnMoney||0)-
            Number(r.bet||0);

          status=
            r.result.hit?
            "🎯 的中":
            "❌ 不的中";

        }


        return`

        <div
          class="historyItem"
          onclick="openDetail(${r.id})"
        >

          <div class="historyTop">

            <div>

              <div class="historyName">
                ${escapeHTML(r.track)}
                ${escapeHTML(r.race)}
                ${escapeHTML(r.raceName)}
              </div>

              <div class="historyMeta">
                ${r.date}
                · ${r.surface}
                · ${r.distance}m
                · ${r.count}頭
                · 投資 ${yen(r.bet)}
              </div>

            </div>

            <div>

              <div class="historyProfit
                ${profit>=0?"green":"red"}">

                ${r.result?
                  (profit>=0?"+":"-")+yen(profit):
                  "—"}

              </div>

              <div class="historyMeta">
                ${status}
              </div>

            </div>

          </div>

        </div>

        `;

      })
      .join("");

}

/* ==========================================
   EDIT PREDICTION
========================================== */

function editPrediction(id){

  const race=db.races.find(
    x=>x.id===id
  );

  if(!race)return;


  state={

    track:race.track,

    surface:race.surface,

    distance:race.distance,

    race:race.race,

    count:race.count,

    horses:
      JSON.parse(JSON.stringify(race.horses)),

    editingId:id,

    resultId:null

  };


  document.getElementById("raceDate").value=
    race.date;

  document.getElementById("raceName").value=
    race.raceName;

  document.getElementById("betMoney").value=
    race.bet;

  document.getElementById("betType").value=
    race.betType;

  document.getElementById("buyText").value=
    race.buy;


  showPage("predict");


  activateByValue("#trackList",race.track);
  activateByValue("#surfaceList",race.surface);

  renderDistances();

  setTimeout(()=>{

    activateByValue("#distanceList",String(race.distance));

    activateByValue("#raceList",race.race);

    activateByValue("#countList",String(race.count));

    renderHorses();

  },30);


  openResultArea(race);

  toast("予想編集モードです");

}


/* ==========================================
   ACTIVE BY VALUE
========================================== */

function activateByValue(selector,value){

  document.querySelectorAll(
    selector+" .choice"
  ).forEach(btn=>{

    if(
      btn.textContent.trim()===String(value) ||
      btn.textContent.trim()===String(value)+"m" ||
      btn.textContent.trim()===String(value)+"頭"
    ){

      btn.classList.add("active");

    }else{

      btn.classList.remove("active");

    }

  });

}


/* ==========================================
   EDIT RESULT
========================================== */

function editResult(id){

  const race=db.races.find(
    x=>x.id===id
  );

  if(!race)return;

  state.resultId=id;

  showPage("predict");

  openResultArea(race);

}


/* ==========================================
   DELETE
========================================== */

function deleteRace(id){

  if(!confirm(
    "このレースの予想・結果・収支記録を削除しますか？"
  )){

    return;

  }

  db.races=
    db.races.filter(r=>r.id!==id);

  saveDB();

  updateDashboard();

  renderHistory();

  showPage("history");

  toast("削除しました");

}


/* ==========================================
   GRAPH
========================================== */

function drawGraph(){

  const canvas=document.getElementById("graph");

  if(!canvas)return;

  const width=canvas.clientWidth;

  const height=190;

  const dpr=window.devicePixelRatio||1;

  canvas.width=width*dpr;

  canvas.height=height*dpr;

  const ctx=canvas.getContext("2d");

  ctx.setTransform(
    dpr,0,0,dpr,0,0
  );

  ctx.clearRect(0,0,width,height);


  let total=0;

  const values=[0];

  db.races.forEach(r=>{

    if(r.result){

      total+=
        Number(r.result.returnMoney||0)-
        Number(r.bet||0);

      values.push(total);

    }

  });


  const max=Math.max(...values,0);

  const min=Math.min(...values,0);

  const range=
    Math.max(max-min,1);


  const left=30;
  const right=10;
  const top=15;
  const bottom=20;

  const graphWidth=
    width-left-right;

  const graphHeight=
    height-top-bottom;


  function y(value){

    return top+
      ((max-value)/range)*graphHeight;

  }


  const zeroY=y(0);


  /* GRID */

  ctx.strokeStyle="#dfe4ea";

  ctx.lineWidth=1;

  ctx.beginPath();

  ctx.moveTo(left,zeroY);

  ctx.lineTo(width-right,zeroY);

  ctx.stroke();


  ctx.fillStyle="#7c8696";

  ctx.font="9px sans-serif";

  ctx.fillText("0",5,zeroY-4);


  if(values.length===1){

    ctx.fillText(
      "結果を入力すると収支推移が表示されます",
      35,
      height/2
    );

    updateGraphStats(values);

    return;

  }


  const step=
    values.length>1?
    graphWidth/(values.length-1):
    0;


  /* SEGMENTS */

  for(let i=0;i<values.length-1;i++){

    const x1=left+i*step;
    const x2=left+(i+1)*step;

    const y1=y(values[i]);
    const y2=y(values[i+1]);

    const positive=
      (values[i]+values[i+1])/2>=0;

    ctx.beginPath();

    ctx.moveTo(x1,y1);
    ctx.lineTo(x2,y2);

    ctx.lineWidth=2.5;

    ctx.strokeStyle=
      positive?
      "#129568":
      "#d93847";

    ctx.stroke();

  }


  /* POINTS */

  values.forEach((value,i)=>{

    const x=left+i*step;

    const yy=y(value);

    ctx.beginPath();

    ctx.arc(x,yy,3.2,0,Math.PI*2);

    ctx.fillStyle=
      value>=0?
      "#129568":
      "#d93847";

    ctx.fill();

  });


  /* X AXIS */

  ctx.fillStyle="#7c8696";

  ctx.font="8px sans-serif";

  values.forEach((value,i)=>{

    if(i===0)return;

    const x=left+i*step;

    ctx.fillText(
      i+"R",
      x-6,
      height-5
    );

  });


  updateGraphStats(values);

}


/* ==========================================
   GRAPH STATS
========================================== */

function updateGraphStats(values){

  const maxPlus=Math.max(...values,0);

  const maxMinus=Math.min(...values,0);

  const current=
    values[values.length-1];


  document.getElementById("maxPlus").textContent=
    "+"+yen(maxPlus);

  document.getElementById("maxMinus").textContent=
    (maxMinus<0?"-":"")+yen(maxMinus);

  const currentEl=
    document.getElementById("graphCurrent");

  currentEl.textContent=
    (current>=0?"+":"-")+yen(current);

  currentEl.className=
    current>=0?"green":"red";

}


/* ==========================================
   INITIALIZE
========================================== */

document.getElementById("raceDate").value=
  new Date().toISOString().slice(0,10);

updateDashboard();

renderHistory();

window.addEventListener(
  "resize",
  drawGraph
);
