<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#101828">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>競馬牧場DX</title>

<style>
:root{
--bg:#f2f5f9;
--card:#fff;
--ink:#172033;
--muted:#718096;
--line:#e4e9f0;
--accent:#6957e8;
--green:#14966a;
--red:#d94b57;
--dark:#101828;
--gold:#e0a72e;
}

*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

body{
margin:0;
background:linear-gradient(#101828 0 220px,var(--bg) 220px);
color:var(--ink);
font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
padding-bottom:30px;
}

button,input,select,textarea{
font:inherit;
}

.app{
max-width:720px;
margin:auto;
padding:18px 14px 40px;
}

header{
color:white;
padding:5px 5px 18px;
}

.eyebrow{
font-size:10px;
letter-spacing:.12em;
opacity:.65;
font-weight:800;
}

.brand{
font-size:27px;
font-weight:900;
margin:5px 0;
}

.sub{
font-size:12px;
opacity:.72;
}

.hero{
background:linear-gradient(135deg,#27334a,#111a2b);
color:white;
border-radius:25px;
padding:18px;
box-shadow:0 14px 35px #0b132255;
}

.heroTitle{
font-size:11px;
opacity:.65;
}

.balance{
font-size:32px;
font-weight:900;
margin-top:4px;
}

.plus{
color:#14966a!important;
}

.minus{
color:#d94b57!important;
}

.whitePlus{
color:#73dfb5;
}

.rank{
font-size:18px;
font-weight:900;
margin-top:10px;
}

.progress{
height:8px;
background:#364157;
border-radius:20px;
margin-top:12px;
overflow:hidden;
}

.progress i{
display:block;
height:100%;
width:0;
background:linear-gradient(90deg,#8c78ff,#e4c05c);
border-radius:20px;
}

.next{
display:flex;
justify-content:space-between;
font-size:10px;
color:#bcc5d4;
margin-top:6px;
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
margin-top:12px;
}

.card{
background:white;
border-radius:17px;
padding:13px;
box-shadow:0 7px 24px #26364d10;
}

.card small{
color:var(--muted);
font-size:10px;
}

.card b{
display:block;
font-size:18px;
margin-top:3px;
}

section{
margin-top:18px;
}

.title{
font-size:16px;
font-weight:900;
margin:0 3px 9px;
}

.panel{
background:white;
border-radius:20px;
padding:15px;
box-shadow:0 7px 24px #26364d10;
}

.form{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.full{
grid-column:1/-1;
}

label{
display:block;
color:var(--muted);
font-size:10px;
font-weight:800;
margin-bottom:5px;
}

input,select,textarea{
width:100%;
border:1px solid var(--line);
background:#f8fafc;
border-radius:12px;
padding:11px;
outline:none;
font-size:15px;
}

textarea{
min-height:90px;
resize:vertical;
}

input:focus,select:focus,textarea:focus{
border-color:#968aff;
background:white;
}

.primary{
width:100%;
border:0;
border-radius:13px;
background:var(--accent);
color:white;
font-weight:900;
padding:13px;
}

.secondary{
width:100%;
border:1px solid var(--line);
border-radius:13px;
background:white;
color:var(--ink);
font-weight:900;
padding:12px;
margin-top:8px;
}

.danger{
width:100%;
border:0;
background:#fff5f5;
color:var(--red);
font-weight:800;
border-radius:12px;
padding:11px;
margin-top:8px;
}

.hidden{
display:none!important;
}

.tabs{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
margin-bottom:10px;
}

.tab{
border:0;
background:#edf0f5;
padding:11px;
border-radius:12px;
font-weight:900;
color:var(--muted);
}

.tab.active{
background:var(--accent);
color:white;
}

.row{
display:flex;
justify-content:space-between;
gap:10px;
padding:13px 0;
border-bottom:1px solid var(--line);
}

.row:first-child{
padding-top:0;
}

.row:last-child{
border-bottom:0;
padding-bottom:0;
}

.name{
font-size:13px;
font-weight:900;
}

.meta{
font-size:10px;
color:var(--muted);
margin-top:3px;
}

.money{
text-align:right;
white-space:nowrap;
}

.small{
font-size:10px;
color:var(--muted);
}

.profit{
font-size:13px;
font-weight:900;
margin-top:3px;
}

.empty{
text-align:center;
color:var(--muted);
font-size:12px;
padding:20px 0;
}

.badges{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:9px;
}

.badge{
padding:12px;
border:1px solid var(--line);
border-radius:16px;
background:white;
}

.badge.locked{
opacity:.35;
}

.bi{
font-size:23px;
}

.bt{
font-size:12px;
font-weight:900;
margin-top:4px;
}

.bd{
font-size:10px;
color:var(--muted);
margin-top:2px;
}

.sectionBox{
background:#f8fafc;
border-radius:15px;
padding:12px;
margin-bottom:10px;
}

.sectionHead{
font-size:11px;
font-weight:900;
color:var(--muted);
margin-bottom:8px;
}

.horseGrid{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
}

.horseInput{
background:white;
border:1px solid var(--line);
border-radius:12px;
padding:9px;
}

.horseInput select{
margin-top:5px;
padding:8px;
font-size:13px;
}

.horseInput input{
padding:8px;
font-size:13px;
}

.mark{
display:inline-flex;
align-items:center;
justify-content:center;
width:28px;
height:28px;
border-radius:50%;
font-weight:900;
background:#edf0f5;
margin-right:5px;
}

.mark.win{
background:#ffdf62;
}

.mark.second{
background:#dce3ec;
}

.mark.third{
background:#e9c29a;
}

.resultBox{
background:#f8fafc;
border-radius:15px;
padding:12px;
}

.resultLine{
display:flex;
align-items:center;
gap:7px;
margin:7px 0;
}

.resultLine span{
font-size:12px;
font-weight:900;
width:35px;
}

.resultLine input{
flex:1;
}

.status{
display:inline-block;
padding:6px 10px;
border-radius:999px;
font-size:11px;
font-weight:900;
background:#edf0f5;
}

.status.hit{
background:#dff7ed;
color:var(--green);
}

.status.miss{
background:#ffe5e7;
color:var(--red);
}

.detailTitle{
font-size:20px;
font-weight:900;
margin-bottom:4px;
}

.detailMeta{
font-size:11px;
color:var(--muted);
}

.back{
border:0;
background:#edf0f5;
border-radius:10px;
padding:8px 12px;
font-size:12px;
font-weight:900;
margin-bottom:12px;
}

.actions{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
}

.actionBtn{
border:0;
border-radius:12px;
padding:11px;
font-weight:900;
background:#edf0f5;
}

.actionBtn.primaryAction{
background:var(--accent);
color:white;
}

.actionBtn.dangerAction{
background:#fff0f1;
color:var(--red);
}

.note{
font-size:11px;
line-height:1.7;
color:var(--muted);
}

@media(min-width:600px){
.form{
grid-template-columns:repeat(4,1fr);
}

.full{
grid-column:1/-1;
}

.badges{
grid-template-columns:repeat(3,1fr);
}

.horseGrid{
grid-template-columns:repeat(3,1fr);
}
}
</style>
</head>

<body>

<div class="app">

<header>
<div class="eyebrow">HORSE RACING · DATA MANAGEMENT</div>
<div class="brand">🏇 競馬牧場DX</div>
<div class="sub">予想・結果・収支をひとつに。</div>
</header>

<!-- HOME -->

<div id="homePage">

<div class="hero">
<div class="heroTitle">CURRENT PERFORMANCE</div>
<div class="balance" id="balance">¥0</div>
<div class="rank" id="rank">新馬</div>
<div class="progress"><i id="bar"></i></div>
<div class="next">
<span>育成進捗</span>
<span id="next">次のランクまで ¥10,000</span>
</div>
</div>

<div class="grid">

<div class="card">
<small>総投資</small>
<b id="totalBet">¥0</b>
</div>

<div class="card">
<small>総払戻</small>
<b id="totalReturn">¥0</b>
</div>

<div class="card">
<small>総収支</small>
<b id="totalProfit">¥0</b>
</div>

<div class="card">
<small>回収率</small>
<b id="roi">—</b>
</div>

<div class="card">
<small>予想レース</small>
<b id="raceCount">0R</b>
</div>

<div class="card">
<small>的中率</small>
<b id="hitRate">—</b>
</div>

</div>

<section>
<h2 class="title">📊 予想成績</h2>

<div class="panel">

<div class="grid">

<div>
<small>的中</small>
<b id="hitCount">0R</b>
</div>

<div>
<small>不的中</small>
<b id="missCount">0R</b>
</div>

<div>
<small>最高収支</small>
<b id="bestRace">¥0</b>
</div>

<div>
<small>最高回収率</small>
<b id="bestRoi">—</b>
</div>

</div>

</div>
</section>

<section>
<h2 class="title">🏆 印別成績</h2>
<div class="panel" id="markStats"></div>
</section>

<section>
<h2 class="title">📝 予想を登録</h2>

<div class="panel">

<form id="predictionForm">

<div class="form">

<div>
<label>開催日</label>
<input id="date" type="date" required>
</div>

<div>
<label>競馬場</label>
<select id="track">
<option>札幌</option>
<option>函館</option>
<option>福島</option>
<option>新潟</option>
<option>東京</option>
<option>中山</option>
<option>中京</option>
<option>京都</option>
<option>阪神</option>
<option>小倉</option>
<option>その他</option>
</select>
</div>

<div>
<label>レース</label>
<select id="raceNo">
<option>1R</option><option>2R</option><option>3R</option>
<option>4R</option><option>5R</option><option>6R</option>
<option>7R</option><option>8R</option><option>9R</option>
<option>10R</option><option>11R</option><option>12R</option>
</select>
</div>

<div>
<label>レース名</label>
<input id="raceName" placeholder="新潟記念" required>
</div>

<div>
<label>投資額</label>
<input id="predictionBet" type="number" min="0" inputmode="numeric" placeholder="3000">
</div>

</div>

<div class="sectionBox">
<div class="sectionHead">🏇 印を付ける</div>

<div class="horseGrid">

<div class="horseInput">
<input id="horse1" placeholder="馬番・馬名">
<select id="mark1">
<option value="">印なし</option>
<option>◎</option>
<option>○</option>
<option>▲</option>
<option>☆</option>
<option>△</option>
</select>
</div>

<div class="horseInput">
<input id="horse2" placeholder="馬番・馬名">
<select id="mark2">
<option value="">印なし</option>
<option>◎</option>
<option>○</option>
<option>▲</option>
<option>☆</option>
<option>△</option>
</select>
</div>

<div class="horseInput">
<input id="horse3" placeholder="馬番・馬名">
<select id="mark3">
<option value="">印なし</option>
<option>◎</option>
<option>○</option>
<option>▲</option>
<option>☆</option>
<option>△</option>
</select>
</div>

<div class="horseInput">
<input id="horse4" placeholder="馬番・馬名">
<select id="mark4">
<option value="">印なし</option>
<option>◎</option>
<option>○</option>
<option>▲</option>
<option>☆</option>
<option>△</option>
</select>
</div>

<div class="horseInput">
<input id="horse5" placeholder="馬番・馬名">
<select id="mark5">
<option value="">印なし</option>
<option>◎</option>
<option>○</option>
<option>▲</option>
<option>☆</option>
<option>△</option>
</select>
</div>

<div class="horseInput">
<input id="horse6" placeholder="馬番・馬名">
<select id="mark6">
<option value="">印なし</option>
<option>◎</option>
<option>○</option>
<option>▲</option>
<option>☆</option>
<option>△</option>
</select>
</div>

</div>
</div>

<div>
<label>買い目</label>
<textarea id="bets" placeholder="例：3連複フォーメーション&#10;◎○－◎○▲☆－◎○▲☆△"></textarea>
</div>

<div style="margin-top:10px">
<label>予想メモ</label>
<textarea id="memo" placeholder="展開・トラックバイアス・調教など"></textarea>
</div>

<button class="primary" style="margin-top:10px">
＋ 予想を保存
</button>

</form>

</div>
</section>

<section>
<h2 class="title">📚 予想履歴</h2>

<div class="panel">

<div class="tabs">

<button class="tab active" id="allTab">すべて</button>
<button class="tab" id="pendingTab">結果待ち</button>

</div>

<div id="history"></div>

</div>
</section>

<section>
<div class="panel note">
データはこのiPhoneのブラウザ内に保存されます。GitHub Pages自体には予想データを保存していません。
</div>

<button class="danger" id="resetAll">
すべての予想・結果データを削除
</button>
</section>

</div>

<!-- DETAIL -->

<div id="detailPage" class="hidden">

<button class="back" id="backBtn">← 予想履歴へ戻る</button>

<div class="panel">

<div class="detailTitle" id="detailTitle"></div>
<div class="detailMeta" id="detailMeta"></div>

<div id="detailContent"></div>

</div>

</div>

</div>

<script>

const KEY="keiba_bokujou_prediction_complete";

let records=JSON.parse(localStorage.getItem(KEY)||"[]");

let currentId=null;

const $=id=>document.getElementById(id);

function yen(n){
return "¥"+Math.round(n||0).toLocaleString("ja-JP");
}

function save(){
localStorage.setItem(KEY,JSON.stringify(records));
}

function uid(){
return Date.now().toString(36)+Math.random().toString(36).slice(2);
}

function totalProfit(){
return records.reduce((s,r)=>s+(Number(r.returnAmount)||0)-(Number(r.bet)||0),0);
}

function esc(s){
return String(s??"").replace(/[&<>"']/g,m=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[m]));
}

const levels=[
{n:"新馬",m:0,d:"ここから育成スタート！"},
{n:"1勝馬",m:10000,d:"まずは1勝。着実に成長中。"},
{n:"オープン馬",m:30000,d:"一線級が見えてきた！"},
{n:"重賞馬",m:60000,d:"重賞級の実力を獲得。"},
{n:"GⅠ馬",m:100000,d:"GⅠの舞台へ。"},
{n:"伝説馬",m:200000,d:"牧場の看板馬。伝説級！"}
];

function renderStats(){

let bet=records.reduce((s,r)=>s+(Number(r.bet)||0),0);
let ret=records.reduce((s,r)=>s+(Number(r.returnAmount)||0),0);
let profit=ret-bet;

$("totalBet").textContent=yen(bet);
$("totalReturn").textContent=yen(ret);

$("totalProfit").textContent=(profit>=0?"+":"")+yen(profit);
$("totalProfit").className=profit>=0?"plus":"minus";

$("balance").textContent=(profit>=0?"+":"")+yen(profit);
$("balance").className="balance "+(profit>=0?"whitePlus":"");

$("raceCount").textContent=records.length+"R";

let finished=records.filter(r=>r.result);

let hits=finished.filter(r=>r.hit);

$("hitCount").textContent=hits.length+"R";
$("missCount").textContent=(finished.length-hits.length)+"R";

$("hitRate").textContent=finished.length
?(hits.length/finished.length*100).toFixed(1)+"%"
:"—";

$("roi").textContent=bet
?(ret/bet*100).toFixed(1)+"%"
:"—";

let best=Math.max(0,...records.map(r=>(Number(r.returnAmount)||0)-(Number(r.bet)||0)));

$("bestRace").textContent=yen(best);

let bestRoi=0;

records.forEach(r=>{
if(Number(r.bet)>0 && Number(r.returnAmount)>=0){
bestRoi=Math.max(bestRoi,Number(r.returnAmount)/Number(r.bet)*100);
}
});

$("bestRoi").textContent=records.length
?bestRoi.toFixed(1)+"%"
:"—";

let idx=0;

for(let i=levels.length-1;i>=0;i--){
if(profit>=levels[i].m){
idx=i;
break;
}
}

$("rank").textContent=levels[idx].n;

let pct=100;
let nextText="最高ランク到達！";

if(idx<levels.length-1){

let next=levels[idx+1].m;

pct=Math.max(
0,
Math.min(
100,
(profit-levels[idx].m)/(next-levels[idx].m)*100
)
);

nextText="次のランクまで "+yen(Math.max(0,next-profit));

}

$("bar").style.width=pct+"%";
$("next").textContent=nextText;

renderMarkStats();

}

function renderMarkStats(){

let marks=["◎","○","▲","☆","△"];

let html="";

marks.forEach(mark=>{

let arr=[];

records.forEach(r=>{
(r.horses||[]).forEach(h=>{
if(h.mark===mark)arr.push({
horse:h,
record:r
});
});
});

let hit=arr.filter(x=>{
if(!x.record.result)return false;

let result=[
String(x.record.result.first),
String(x.record.result.second),
String(x.record.result.third)
];

return result.includes(String(x.horse.name).split(" ")[0]);
}).length;

html+=`
<div class="row">
<div>
<div class="name">${mark} ${arr.length}頭</div>
<div class="meta">${hit}頭が3着以内</div>
</div>
<div class="money">
<div class="profit">${arr.length?((hit/arr.length)*100).toFixed(1)+"%":"—"}</div>
</div>
</div>
`;

});

$("markStats").innerHTML=html;

}

function renderHistory(filter="all"){

let arr=records.slice().reverse();

if(filter==="pending"){
arr=arr.filter(r=>!r.result);
}

if(!arr.length){
$("history").innerHTML='<div class="empty">まだ予想がありません。</div>';
return;
}

$("history").innerHTML=arr.map(r=>{

let p=(Number(r.returnAmount)||0)-(Number(r.bet)||0);

let status="結果待ち";
let cls="";

if(r.result){
status=r.hit?"的中 🎯":"不的中";
cls=r.hit?"hit":"miss";
}

return`
<div class="row" onclick="openDetail('${r.id}')" style="cursor:pointer">

<div>
<div class="name">
${esc(r.track)} ${esc(r.raceNo)} ${esc(r.raceName)}
</div>

<div class="meta">
${esc(r.date)} · ${r.horses?.length||0}頭登録
</div>

<div style="margin-top:6px">
<span class="status ${cls}">${status}</span>
</div>

</div>

<div class="money">

<div class="small">
投資 ${yen(r.bet)}
</div>

<div class="profit ${p>=0?"plus":"minus"}">
${p>=0?"+":""}${yen(p)}
</div>

<div class="small">詳細を見る →</div>

</div>

</div>
`;

}).join("");

}

function resetForm(){

$("predictionForm").reset();

$("date").value=new Date().toISOString().slice(0,10);

}

$("predictionForm").addEventListener("submit",e=>{

e.preventDefault();

let horses=[];

for(let i=1;i<=6;i++){

let name=$("horse"+i).value.trim();
let mark=$("mark"+i).value;

if(name){

horses.push({
name:name,
mark:mark
});

}

}

let record={

id:uid(),

date:$("date").value,

track:$("track").value,

raceNo:$("raceNo").value,

raceName:$("raceName").value.trim(),

bet:Number($("predictionBet").value)||0,

returnAmount:0,

horses:horses,

bets:$("bets").value.trim(),

memo:$("memo").value.trim(),

result:null,

created:new Date().toISOString()

};

records.push(record);

save();

renderStats();
renderHistory();

resetForm();

alert("予想を保存しました！🏇");

});

window.openDetail=function(id){

currentId=id;

let r=records.find(x=>x.id===id);

if(!r)return;

$("homePage").classList.add("hidden");
$("detailPage").classList.remove("hidden");

$("detailTitle").textContent=
`${r.track} ${r.raceNo} ${r.raceName}`;

$("detailMeta").textContent=
`${r.date} · 投資 ${yen(r.bet)}`;

let marksHtml=(r.horses||[]).map(h=>`

<div class="row">

<div>
<span class="mark ${
h.mark==="◎"?"win":
h.mark==="○"?"second":
h.mark==="▲"?"third":""
}">
${esc(h.mark||"—")}
</span>

<b>${esc(h.name)}</b>
</div>

</div>

`).join("");

let resultHtml="";

if(r.result){

let p=(Number(r.returnAmount)||0)-(Number(r.bet)||0);

resultHtml=`

<div class="sectionBox">

<div class="sectionHead">🏁 レース結果</div>

<div class="resultLine">
<span>1着</span>
<b>${esc(r.result.first)}</b>
</div>

<div class="resultLine">
<span>2着</span>
<b>${esc(r.result.second)}</b>
</div>

<div class="resultLine">
<span>3着</span>
<b>${esc(r.result.third)}</b>
</div>

<div style="margin-top:10px">
<span class="status ${r.hit?"hit":"miss"}">
${r.hit?"的中 🎯":"不的中"}
</span>
</div>

<div style="margin-top:10px">
<div>投資：<b>${yen(r.bet)}</b></div>
<div>払戻：<b>${yen(r.returnAmount)}</b></div>
<div class="profit ${p>=0?"plus":"minus"}">
収支：${p>=0?"+":""}${yen(p)}
</div>
</div>

</div>

`;

}else{

resultHtml=`

<div class="sectionBox">

<div class="sectionHead">🏁 レース結果</div>

<div class="empty">まだ結果が入力されていません。</div>

</div>

`;

}

$("detailContent").innerHTML=`

<div class="sectionBox">

<div class="sectionHead">🎯 予想印</div>

${marksHtml||'<div class="empty">印が登録されていません。</div>'}

</div>

<div class="sectionBox">

<div class="sectionHead">🎫 買い目</div>

<div style="white-space:pre-wrap;font-size:13px">
${esc(r.bets)||"買い目未登録"}
</div>

</div>

<div class="sectionBox">

<div class="sectionHead">📝 予想メモ</div>

<div style="white-space:pre-wrap;font-size:12px;line-height:1.7">
${esc(r.memo)||"メモなし"}
</div>

</div>

${resultHtml}

<div class="actions">

<button class="actionBtn primaryAction" onclick="editPrediction()">
✏️ 予想を編集
</button>

<button class="actionBtn" onclick="editResult()">
🏁 結果を編集
</button>

</div>

<button class="danger" onclick="deletePrediction()">
この予想を削除
</button>

`;

};

window.editPrediction=function(){

let r=records.find(x=>x.id===currentId);

if(!r)return;

$("detailContent").innerHTML=`

<div class="sectionBox">

<div class="sectionHead">✏️ 予想を編集</div>

<label>開催日</label>
<input id="editDate" type="date" value="${esc(r.date)}">

<label style="margin-top:8px">競馬場</label>
<select id="editTrack">

${["札幌","函館","福島","新潟","東京","中山","中京","京都","阪神","小倉","その他"]
.map(x=>`<option ${x===r.track?"selected":""}>${x}</option>`).join("")}

</select>

<label style="margin-top:8px">レース番号</label>
<select id="editRaceNo">

${Array.from({length:12},(_,i)=>i+1)
.map(i=>`<option ${r.raceNo===i+"R"?"selected":""}>${i}R</option>`).join("")}

</select>

<label style="margin-top:8px">レース名</label>
<input id="editRaceName" value="${esc(r.raceName)}">

<label style="margin-top:8px">投資額</label>
<input id="editBet" type="number" value="${r.bet||0}">

</div>

<div class="sectionBox">

<div class="sectionHead">🏇 印・馬名</div>

<div class="horseGrid">

${[0,1,2,3,4,5].map(i=>{

let h=r.horses?.[i]||{name:"",mark:""};

return`

<div class="horseInput">

<input id="eh${i}" value="${esc(h.name)}" placeholder="馬番・馬名">

<select id="em${i}">

<option value="" ${!h.mark?"selected":""}>印なし</option>
<option ${h.mark==="◎"?"selected":""}>◎</option>
<option ${h.mark==="○"?"selected":""}>○</option>
<option ${h.mark==="▲"?"selected":""}>▲</option>
<option ${h.mark==="☆"?"selected":""}>☆</option>
<option ${h.mark==="△"?"selected":""}>△</option>

</select>

</div>

`;

}).join("")}

</div>

</div>

<div class="sectionBox">

<div class="sectionHead">🎫 買い目</div>

<textarea id="editBets">${esc(r.bets)}</textarea>

</div>

<div class="sectionBox">

<div class="sectionHead">📝 メモ</div>

<textarea id="editMemo">${esc(r.memo)}</textarea>

</div>

<button class="primary" onclick="savePredictionEdit()">
💾 予想を保存
</button>

<button class="secondary" onclick="openDetail('${r.id}')">
キャンセル
</button>

`;

};

window.savePredictionEdit=function(){

let r=records.find(x=>x.id===currentId);

if(!r)return;

r.date=$("editDate").value;
r.track=$("editTrack").value;
r.raceNo=$("editRaceNo").value;
r.raceName=$("editRaceName").value.trim();
r.bet=Number($("editBet").value)||0;
r.bets=$("editBets").value;
r.memo=$("editMemo").value;

r.horses=[];

for(let i=0;i<6;i++){

let name=$("eh"+i).value.trim();
let mark=$("em"+i).value;

if(name){
r.horses.push({name,mark});
}

}

save();

renderStats();
renderHistory();

openDetail(r.id);

alert("予想を更新しました！");

};

window.editResult=function(){

let r=records.find(x=>x.id===currentId);

if(!r)return;

let result=r.result||{
first:"",
second:"",
third:""
};

$("detailContent").innerHTML=`

<div class="sectionBox">

<div class="sectionHead">🏁 結果を入力・編集</div>

<label>1着</label>
<input id="resFirst" value="${esc(result.first)}" placeholder="馬番・馬名">

<label style="margin-top:8px">2着</label>
<input id="resSecond" value="${esc(result.second)}" placeholder="馬番・馬名">

<label style="margin-top:8px">3着</label>
<input id="resThird" value="${esc(result.third)}" placeholder="馬番・馬名">

<label style="margin-top:8px">払戻額</label>
<input id="resReturn" type="number" min="0" value="${r.returnAmount||0}">

</div>

<button class="primary" onclick="saveResult()">
💾 結果を保存
</button>

<button class="secondary" onclick="openDetail('${r.id}')">
キャンセル
</button>

`;

};

function normalize(s){

return String(s||"")
.trim()
.replace(/番/g,"")
.replace(/[　 ]/g,"");

}

window.saveResult=function(){

let r=records.find(x=>x.id===currentId);

if(!r)return;

let first=$("resFirst").value.trim();
let second=$("resSecond").value.trim();
let third=$("resThird").value.trim();

r.returnAmount=Number($("resReturn").value)||0;

r.result={
first:first,
second:second,
third:third
};

let top3=[
normalize(first),
normalize(second),
normalize(third)
];

let marked=(r.horses||[])
.filter(h=>h.mark)
.map(h=>normalize(h.name).split(/[・,]/)[0]);

let hit=false;

if(r.bets){

let is3ren=r.bets.includes("3連複");

if(is3ren){

let found=top3.filter(x=>marked.includes(x)).length;

hit=found>=3;

}else{

hit=marked.some(x=>top3.includes(x));

}

}else{

hit=marked.some(x=>top3.includes(x));

}

r.hit=hit;

save();

renderStats();
renderHistory();

openDetail(r.id);

alert(hit?"🎯 的中判定！":"結果を保存しました。");

};

window.deletePrediction=function(){

if(!confirm("この予想を削除しますか？")){
return;
}

records=records.filter(r=>r.id!==currentId);

save();

currentId=null;

$("detailPage").classList.add("hidden");
$("homePage").classList.remove("hidden");

renderStats();
renderHistory();

};

$("backBtn").addEventListener("click",()=>{

$("detailPage").classList.add("hidden");
$("homePage").classList.remove("hidden");

renderStats();
renderHistory();

});

$("allTab").addEventListener("click",()=>{

$("allTab").classList.add("active");
$("pendingTab").classList.remove("active");

renderHistory("all");

});

$("pendingTab").addEventListener("click",()=>{

$("pendingTab").classList.add("active");
$("allTab").classList.remove("active");

renderHistory("pending");

});

$("resetAll").addEventListener("click",()=>{

if(confirm("すべての予想・結果を削除しますか？")){

records=[];

save();

renderStats();
renderHistory();

}

});

resetForm();
renderStats();
renderHistory();

</script>

</body>
</html>
