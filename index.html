<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
      maximum-scale=1.0,user-scalable=no">

<title>競馬牧場</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    sans-serif;
  background:
    linear-gradient(
      180deg,
      #9ddcff 0%,
      #c9efff 35%,
      #86c96b 36%,
      #5da84c 100%
    );
  color:#263238;
  min-height:100vh;
}

button{
  font:inherit;
  cursor:pointer;
}

.app{
  width:100%;
  max-width:600px;
  margin:auto;
  min-height:100vh;
  overflow:hidden;
}

/* =========================
   HEADER
========================= */

.header{
  padding:14px 14px 10px;
  color:white;
  text-shadow:0 2px 3px rgba(0,0,0,.25);
}

.title{
  font-size:27px;
  font-weight:900;
}

.subtitle{
  font-size:12px;
  opacity:.95;
  margin-top:2px;
}

/* =========================
   PLAYER STATUS
========================= */

.player-panel{
  margin:0 12px 12px;
  padding:12px;
  border-radius:18px;
  background:rgba(255,255,255,.94);
  box-shadow:0 5px 15px rgba(0,0,0,.16);
}

.player-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.level{
  font-weight:900;
  color:#1976d2;
}

.exp-text{
  font-size:11px;
  color:#777;
}

.exp-bar{
  height:9px;
  margin-top:8px;
  background:#e5e5e5;
  border-radius:20px;
  overflow:hidden;
}

.exp-fill{
  height:100%;
  width:40%;
  background:linear-gradient(
    90deg,
    #42a5f5,
    #7e57c2
  );
  border-radius:20px;
  transition:.5s;
}

/* =========================
   FARM
========================= */

.farm{
  position:relative;
  margin:0 12px;
  height:230px;
  border-radius:25px;
  overflow:hidden;
  background:
    linear-gradient(
      180deg,
      #91d8ff 0%,
      #d7f5ff 46%,
      #85c96b 47%,
      #63ad4e 100%
    );
  box-shadow:
    inset 0 0 0 3px rgba(255,255,255,.55),
    0 7px 18px rgba(0,0,0,.18);
}

/* clouds */

.cloud{
  position:absolute;
  width:70px;
  height:25px;
  background:white;
  border-radius:30px;
  opacity:.8;
}

.cloud:before,
.cloud:after{
  content:"";
  position:absolute;
  background:white;
  border-radius:50%;
}

.cloud:before{
  width:30px;
  height:30px;
  left:12px;
  top:-15px;
}

.cloud:after{
  width:38px;
  height:38px;
  right:8px;
  top:-20px;
}

.cloud.one{
  top:30px;
  left:20px;
}

.cloud.two{
  top:65px;
  right:25px;
  transform:scale(.7);
}

/* fence */

.fence{
  position:absolute;
  bottom:38px;
  left:0;
  right:0;
  height:50px;
}

.fence:before{
  content:"";
  position:absolute;
  left:0;
  right:0;
  top:12px;
  height:8px;
  background:#a56b3d;
  box-shadow:0 22px 0 #a56b3d;
}

.post{
  position:absolute;
  width:9px;
  height:60px;
  bottom:0;
  background:#8d5c34;
  border-radius:5px;
}

.post:nth-child(1){left:5%}
.post:nth-child(2){left:25%}
.post:nth-child(3){left:45%}
.post:nth-child(4){left:65%}
.post:nth-child(5){left:85%}

/* =========================
   HORSE
========================= */

.horse-area{
  position:absolute;
  left:50%;
  bottom:28px;
  transform:translateX(-50%);
  width:190px;
  height:170px;
  display:flex;
  justify-content:center;
  align-items:flex-end;
}

.horse{
  position:relative;
  width:150px;
  height:135px;
  animation:bob 2s ease-in-out infinite;
}

@keyframes bob{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-4px)}
}

/* body */

.horse-body{
  position:absolute;
  width:100px;
  height:65px;
  left:30px;
  bottom:25px;
  border-radius:50% 55% 45% 50%;
  background:var(--horse);
  box-shadow:
    inset -8px -7px 0 rgba(0,0,0,.08);
}

/* neck */

.horse-neck{
  position:absolute;
  width:48px;
  height:90px;
  left:25px;
  bottom:57px;
  border-radius:30px 30px 15px 25px;
  background:var(--horse);
  transform:rotate(-12deg);
}

/* head */

.horse-head{
  position:absolute;
  width:70px;
  height:65px;
  left:7px;
  top:8px;
  border-radius:55% 50% 45% 55%;
  background:var(--horse);
  box-shadow:
    inset -6px -6px 0 rgba(0,0,0,.08);
}

/* ears */

.ear{
  position:absolute;
  width:25px;
  height:38px;
  top:-24px;
  background:var(--horse);
  border-radius:80% 20% 50% 30%;
}

.ear.left{
  left:9px;
  transform:rotate(-20deg);
}

.ear.right{
  right:7px;
  transform:rotate(20deg);
}

/* mane */

.mane{
  position:absolute;
  left:5px;
  top:0;
  width:30px;
  height:70px;
  background:var(--mane);
  border-radius:50%;
  z-index:-1;
}

/* eyes */

.eye{
  position:absolute;
  width:10px;
  height:13px;
  top:24px;
  border-radius:50%;
  background:#263238;
}

.eye.left{
  left:17px;
}

.eye.right{
  right:17px;
}

.eye:after{
  content:"";
  position:absolute;
  width:3px;
  height:4px;
  background:white;
  border-radius:50%;
  left:2px;
  top:2px;
}

/* muzzle */

.muzzle{
  position:absolute;
  width:43px;
  height:27px;
  left:14px;
  bottom:3px;
  background:#e9b6a3;
  border-radius:50%;
}

.nostril{
  position:absolute;
  width:6px;
  height:4px;
  background:#805548;
  border-radius:50%;
  top:10px;
}

.nostril.one{
  left:10px;
}

.nostril.two{
  right:10px;
}

/* legs */

.leg{
  position:absolute;
  width:15px;
  height:45px;
  bottom:0;
  background:var(--horse);
  border-radius:8px;
}

.leg.one{left:45px}
.leg.two{left:70px}
.leg.three{left:100px}
.leg.four{left:120px}

.hoof{
  position:absolute;
  bottom:-4px;
  width:17px;
  height:9px;
  background:#44332d;
  border-radius:50%;
}

/* tail */

.tail{
  position:absolute;
  right:-2px;
  bottom:54px;
  width:50px;
  height:70px;
  border-right:13px solid var(--mane);
  border-radius:50%;
  transform:rotate(-15deg);
}

/* saddle */

.saddle{
  display:none;
  position:absolute;
  left:52px;
  top:45px;
  width:58px;
  height:24px;
  background:#70452d;
  border-radius:50%;
}

/* aura */

.aura{
  display:none;
  position:absolute;
  inset:-18px;
  border-radius:50%;
  border:4px solid rgba(255,215,64,.6);
  animation:aura 1.5s infinite;
}

@keyframes aura{
  0%,100%{
    transform:scale(.95);
    opacity:.5;
  }
  50%{
    transform:scale(1.08);
    opacity:1;
  }
}

/* star */

.star{
  display:none;
  position:absolute;
  right:-4px;
  top:-10px;
  font-size:28px;
  animation:star 1s infinite;
}

@keyframes star{
  50%{transform:scale(1.2) rotate(10deg)}
}

/* =========================
   HORSE NAME
========================= */

.horse-name{
  position:absolute;
  bottom:8px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(255,255,255,.9);
  padding:5px 15px;
  border-radius:20px;
  font-size:13px;
  font-weight:900;
  white-space:nowrap;
}

/* =========================
   LEVEL VISUALS
========================= */

.level-1{
  --horse:#c98d62;
  --mane:#754936;
}

.level-5{
  --horse:#b97852;
  --mane:#653d30;
}

.level-10{
  --horse:#a66a48;
  --mane:#3d2a24;
}

.level-20{
  --horse:#8d5a42;
  --mane:#241b19;
}

.level-30{
  --horse:#694b42;
  --mane:#171313;
}

.level-40{
  --horse:#f0eee8;
  --mane:#5a4b42;
}

.level-50{
  --horse:#f5c94a;
  --mane:#8a5b13;
}

.level-20 .saddle,
.level-30 .saddle,
.level-40 .saddle,
.level-50 .saddle{
  display:block;
}

.level-40 .aura,
.level-50 .aura{
  display:block;
}

.level-50 .star{
  display:block;
}

/* =========================
   CONTROLS
========================= */

.panel{
  margin:12px;
  padding:14px;
  border-radius:20px;
  background:rgba(255,255,255,.96);
  box-shadow:0 5px 15px rgba(0,0,0,.15);
}

.section-title{
  font-weight:900;
  margin-bottom:10px;
}

/* headcount */

.headcount{
  display:grid;
  grid-template-columns:
    repeat(4,1fr);
  gap:7px;
}

.headcount button{
  border:0;
  border-radius:12px;
  padding:10px 3px;
  background:#eef4f7;
  color:#455a64;
  font-weight:800;
}

.headcount button.active{
  color:white;
  background:
    linear-gradient(
      135deg,
      #42a5f5,
      #7e57c2
    );
  box-shadow:
    0 3px 8px rgba(66,165,245,.35);
}

/* actions */

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.action{
  border:0;
  padding:13px;
  border-radius:14px;
  color:white;
  font-weight:900;
  background:#43a047;
}

.action.train{
  background:#ef6c00;
}

.action:active{
  transform:scale(.97);
}

/* =========================
   HORSE CARD
========================= */

.horse-card{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px;
  margin-bottom:8px;
  border-radius:14px;
  background:#f7fafb;
  border:2px solid transparent;
}

.horse-card.selected{
  border-color:#42a5f5;
  background:#eef8ff;
}

.mini-horse{
  width:48px;
  height:42px;
  position:relative;
  flex:none;
}

.mini-body{
  position:absolute;
  width:36px;
  height:22px;
  left:8px;
  bottom:7px;
  border-radius:50%;
  background:var(--horse);
}

.mini-head{
  position:absolute;
  width:23px;
  height:24px;
  left:0;
  top:5px;
  border-radius:50%;
  background:var(--horse);
}

.card-info{
  flex:1;
}

.card-name{
  font-weight:900;
  font-size:14px;
}

.card-level{
  font-size:11px;
  color:#777;
  margin-top:2px;
}

.card-exp{
  height:5px;
  background:#ddd;
  border-radius:10px;
  margin-top:5px;
  overflow:hidden;
}

.card-exp span{
  display:block;
  height:100%;
  background:#42a5f5;
}

/* =========================
   MESSAGE
========================= */

.message{
  text-align:center;
  padding:7px;
  font-size:12px;
  font-weight:700;
  color:#546e7a;
}

/* =========================
   LEVEL UP
========================= */

.levelup{
  display:none;
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(0,0,0,.5);
  justify-content:center;
  align-items:center;
  padding:25px;
}

.levelup.show{
  display:flex;
}

.levelup-box{
  width:100%;
  max-width:360px;
  padding:28px 20px;
  border-radius:28px;
  background:white;
  text-align:center;
  animation:pop .35s ease;
}

@keyframes pop{
  from{
    transform:scale(.7);
    opacity:0;
  }
  to{
    transform:scale(1);
    opacity:1;
  }
}

.levelup-title{
  font-size:28px;
  font-weight:900;
  color:#7e57c2;
}

.levelup-level{
  font-size:42px;
  font-weight:1000;
  margin:8px 0;
}

.close{
  width:100%;
  margin-top:15px;
  padding:13px;
  border:0;
  border-radius:14px;
  background:#42a5f5;
  color:white;
  font-weight:900;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:360px){

  .title{
    font-size:24px;
  }

  .farm{
    height:210px;
  }

  .headcount{
    grid-template-columns:
      repeat(3,1fr);
  }
}
</style>
</head>

<body>

<div class="app">

  <header class="header">
    <div class="title">🏇 競馬牧場</div>
    <div class="subtitle">
      馬を育てて、最強の競走馬を目指そう！
    </div>
  </header>

  <!-- PLAYER -->
  <section class="player-panel">

    <div class="player-top">
      <div class="level">
        牧場レベル Lv.<span id="playerLevel">1</span>
      </div>

      <div class="exp-text">
        EXP <span id="playerExp">0</span> / 100
      </div>
    </div>

    <div class="exp-bar">
      <div
        class="exp-fill"
        id="playerExpBar">
      </div>
    </div>

  </section>

  <!-- FARM -->
  <section class="farm">

    <div class="cloud one"></div>
    <div class="cloud two"></div>

    <div class="fence">
      <div class="post"></div>
      <div class="post"></div>
      <div class="post"></div>
      <div class="post"></div>
      <div class="post"></div>
    </div>

    <div class="horse-area">

      <div
        class="horse level-1"
        id="mainHorse">

        <div class="aura"></div>

        <div class="tail"></div>

        <div class="horse-body"></div>

        <div class="horse-neck"></div>

        <div class="horse-head">

          <div class="ear left"></div>
          <div class="ear right"></div>

          <div class="mane"></div>

          <div class="eye left"></div>
          <div class="eye right"></div>

          <div class="muzzle">
            <div class="nostril one"></div>
            <div class="nostril two"></div>
          </div>

        </div>

        <div class="leg one">
          <div class="hoof"></div>
        </div>

        <div class="leg two">
          <div class="hoof"></div>
        </div>

        <div class="leg three">
          <div class="hoof"></div>
        </div>

        <div class="leg four">
          <div class="hoof"></div>
        </div>

        <div class="saddle"></div>

        <div class="star">⭐</div>

      </div>

    </div>

    <div class="horse-name" id="mainHorseName">
      はじめての馬
    </div>

  </section>

  <div class="message" id="message">
    馬を選んで育ててみよう！
  </div>

  <!-- HEADCOUNT -->
  <section class="panel">

    <div class="section-title">
      🏇 出走頭数
    </div>

    <div
      class="headcount"
      id="headcount">
    </div>

  </section>

  <!-- ACTION -->
  <section class="panel">

    <div class="section-title">
      🌱 育成メニュー
    </div>

    <div class="actions">

      <button
        class="action"
        onclick="trainHorse()">
        💪 調教する
      </button>

      <button
        class="action train"
        onclick="raceHorse()">
        🏇 レースに出す
      </button>

    </div>

  </section>

  <!-- HORSES -->
  <section class="panel">

    <div class="section-title">
      🐴 牧場の馬
    </div>

    <div id="horseList"></div>

  </section>

</div>

<!-- LEVEL UP -->

<div
  class="levelup"
  id="levelup">

  <div class="levelup-box">

    <div class="levelup-title">
      🎉 LEVEL UP!
    </div>

    <div class="levelup-level">
      Lv.<span id="newLevel">2</span>
    </div>

    <div id="levelMessage">
      馬が成長した！
    </div>

    <button
      class="close"
      onclick="closeLevelUp()">
      OK！
    </button>

  </div>

</div>


<script>

/* =========================
   DATA
========================= */

const horseNames = [
  "サクラブレイブ",
  "ブルーファング",
  "グリーンヒル",
  "スターライト",
  "ゴールドラン",
  "ミラクルホース",
  "スピードスター",
  "キングダッシュ",
  "ウイングロード",
  "ファームキング",
  "レッドアロー",
  "シャインベル",
  "ビクトリー",
  "ハッピーラン",
  "ダービースター",
  "グランスピード",
  "オーラホース",
  "レジェンド"
];

let selectedHorses =
  Number(localStorage.getItem(
    "horseCount"
  )) || 5;

let horses =
  JSON.parse(
    localStorage.getItem("horses")
  ) || [];

let selectedHorse = 0;

let playerLevel =
  Number(localStorage.getItem(
    "playerLevel"
  )) || 1;

let playerExp =
  Number(localStorage.getItem(
    "playerExp"
  )) || 0;


/* =========================
   HORSE INITIALIZE
========================= */

function createHorses(){

  if(horses.length >= selectedHorses)
    return;

  for(
    let i = horses.length;
    i < selectedHorses;
    i++
  ){

    horses.push({
      name:
        horseNames[i] ||
        "新しい競走馬",

      level:1,

      exp:0
    });
  }

  save();
}


/* =========================
   SAVE
========================= */

function save(){

  localStorage.setItem(
    "horses",
    JSON.stringify(horses)
  );

  localStorage.setItem(
    "horseCount",
    selectedHorses
  );

  localStorage.setItem(
    "playerLevel",
    playerLevel
  );

  localStorage.setItem(
    "playerExp",
    playerExp
  );
}


/* =========================
   HEADCOUNT
========================= */

function createHeadcount(){

  const area =
    document.getElementById(
      "headcount"
    );

  area.innerHTML="";

  for(
    let i=5;
    i<=18;
    i++
  ){

    const btn =
      document.createElement(
        "button"
      );

    btn.textContent =
      i + "頭";

    if(
      i === selectedHorses
    ){
      btn.classList.add(
        "active"
      );
    }

    btn.onclick =
      () => {

        selectedHorses=i;

        createHorses();
        save();

        createHeadcount();
        renderHorses();

        showMessage(
          `出走頭数を${i}頭に設定しました！`
        );
      };

    area.appendChild(btn);
  }
}


/* =========================
   LEVEL CLASS
========================= */

function getLevelClass(level){

  if(level>=50)
    return "level-50";

  if(level>=40)
    return "level-40";

  if(level>=30)
    return "level-30";

  if(level>=20)
    return "level-20";

  if(level>=10)
    return "level-10";

  if(level>=5)
    return "level-5";

  return "level-1";
}


/* =========================
   MAIN HORSE
========================= */

function updateMainHorse(){

  const horse =
    horses[selectedHorse];

  if(!horse) return;

  const main =
    document.getElementById(
      "mainHorse"
    );

  main.className =
    "horse " +
    getLevelClass(
      horse.level
    );

  document.getElementById(
    "mainHorseName"
  ).textContent =
    horse.name +
    "  Lv." +
    horse.level;
}


/* =========================
   HORSE LIST
========================= */

function renderHorses(){

  const list =
    document.getElementById(
      "horseList"
    );

  list.innerHTML="";

  horses
    .slice(0,selectedHorses)
    .forEach(
      (horse,index)=>{

        const card =
          document.createElement(
            "div"
          );

        card.className =
          "horse-card" +
          (
            index === selectedHorse
              ? " selected"
              : ""
          );

        const expPercent =
          Math.min(
            100,
            horse.exp
          );

        card.innerHTML = `

          <div
            class="mini-horse
              ${getLevelClass(
                horse.level
              )}">

            <div
              class="mini-body">
            </div>

            <div
              class="mini-head">
            </div>

          </div>

          <div class="card-info">

            <div class="card-name">
              ${horse.name}
            </div>

            <div class="card-level">
              Lv.${horse.level}
            </div>

            <div class="card-exp">
              <span
                style="
                  width:${expPercent}%;
                ">
              </span>
            </div>

          </div>
        `;

        card.onclick =
          ()=>{

            selectedHorse =
              index;

            updateMainHorse();
            renderHorses();

            showMessage(
              `${horse.name}を選択しました！`
            );
          };

        list.appendChild(card);
      }
    );
}


/* =========================
   TRAIN
========================= */

function trainHorse(){

  const horse =
    horses[selectedHorse];

  if(!horse) return;

  const gain =
    Math.floor(
      Math.random()*16
    ) + 10;

  horse.exp += gain;

  playerExp += 5;

  let leveled=false;

  while(
    horse.exp >= 100 &&
    horse.level < 50
  ){

    horse.exp -= 100;
    horse.level++;

    leveled=true;
  }

  while(
    playerExp >= 100
  ){

    playerExp -= 100;

    if(playerLevel<50)
      playerLevel++;
  }

  save();

  updateMainHorse();
  renderHorses();
  updatePlayer();

  if(leveled){

    showLevelUp(
      horse
    );

  }else{

    showMessage(
      `${horse.name}が${gain}EXP獲得！`
    );
  }
}


/* =========================
   RACE
========================= */

function raceHorse(){

  const horse =
    horses[selectedHorse];

  if(!horse) return;

  const bonus =
    Math.floor(
      Math.random()*21
    ) + 10;

  horse.exp += bonus;

  playerExp += 10;

  let result =
    Math.random();

  let message;

  if(result > .8){

    message =
      `🏆 ${horse.name}が見事1着！`;

    horse.exp += 20;

  }else if(result > .5){

    message =
      `🥈 ${horse.name}が好走！`;

  }else{

    message =
      `🏇 ${horse.name}は経験を積んだ！`;
  }

  let leveled=false;

  while(
    horse.exp >= 100 &&
    horse.level < 50
  ){

    horse.exp -= 100;
    horse.level++;
    leveled=true;
  }

  while(
    playerExp >= 100
  ){

    playerExp -= 100;

    if(playerLevel<50)
      playerLevel++;
  }

  save();

  updateMainHorse();
  renderHorses();
  updatePlayer();

  if(leveled){

    showLevelUp(
      horse
    );

  }else{

    showMessage(
      message
    );
  }
}


/* =========================
   PLAYER
========================= */

function updatePlayer(){

  document.getElementById(
    "playerLevel"
  ).textContent =
    playerLevel;

  document.getElementById(
    "playerExp"
  ).textContent =
    playerExp;

  document.getElementById(
    "playerExpBar"
  ).style.width =
    playerExp + "%";
}


/* =========================
   MESSAGE
========================= */

function showMessage(text){

  document.getElementById(
    "message"
  ).textContent =
    text;
}


/* =========================
   LEVEL UP
========================= */

function showLevelUp(
  horse
){

  document.getElementById(
    "newLevel"
  ).textContent =
    horse.level;

  let message =
    "馬が成長した！";

  if(horse.level===5){

    message =
      "🌱 少しずつ立派な馬に！";

  }else if(
    horse.level===10
  ){

    message =
      "🐎 若駒らしい姿になった！";

  }else if(
    horse.level===20
  ){

    message =
      "🏇 本格的な競走馬へ！";

  }else if(
    horse.level===30
  ){

    message =
      "🔥 強豪馬のオーラが出てきた！";

  }else if(
    horse.level===40
  ){

    message =
      "✨ スター競走馬へ進化！";

  }else if(
    horse.level===50
  ){

    message =
      "👑 伝説級の競走馬が誕生！";
  }

  document.getElementById(
    "levelMessage"
  ).textContent =
    message;

  document.getElementById(
    "levelup"
  ).classList.add(
    "show"
  );
}


function closeLevelUp(){

  document.getElementById(
    "levelup"
  ).classList.remove(
    "show"
  );
}


/* =========================
   START
========================= */

createHorses();

createHeadcount();

renderHorses();

updateMainHorse();

updatePlayer();

</script>
