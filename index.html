<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>競馬牧場DX</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:#f3f4f6;
  color:#111827;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
}

button,input,select,textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.header{
  background:#111827;
  color:white;
  padding:28px 18px 22px;
}

.header small{
  display:block;
  color:#aeb7c6;
  font-size:11px;
  font-weight:bold;
  letter-spacing:.08em;
}

.header h1{
  margin:5px 0;
  font-size:28px;
  font-weight:900;
}

.header p{
  margin:0;
  color:#c7ced9;
  font-size:12px;
}

.container{
  max-width:760px;
  margin:auto;
  padding:14px;
}

.card{
  background:white;
  border-radius:18px;
  padding:16px;
  margin-bottom:14px;
  box-shadow:0 5px 20px rgba(0,0,0,.07);
}

.card-title{
  font-size:17px;
  font-weight:900;
  margin-bottom:12px;
}

.balance{
  background:linear-gradient(135deg,#1f2937,#111827);
  color:white;
  border-radius:22px;
  padding:20px;
  margin-bottom:14px;
}

.balance-label{
  color:#aeb7c6;
  font-size:11px;
}

.balance-number{
  font-size:32px;
  font-weight:900;
  margin-top:4px;
}

.plus{
  color:#059669!important;
}

.minus{
  color:#dc2626!important;
}

.balance .plus{
  color:#6ee7b7!important;
}

.balance .minus{
  color:#fca5a5!important;
}

.stats{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.stat{
  background:#f8fafc;
  border-radius:14px;
  padding:13px;
}

.stat-label{
  font-size:10px;
  color:#64748b;
}

.stat-value{
  margin-top:4px;
  font-size:18px;
  font-weight:900;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

label{
  display:block;
  font-size:11px;
  font-weight:800;
  color:#64748b;
  margin-bottom:5px;
}

input,select,textarea{
  width:100%;
  border:1px solid #dbe1e8;
  border-radius:12px;
  padding:12px;
  background:#f8fafc;
  outline:none;
}

input:focus,select:focus,textarea:focus{
  border-color:#6366f1;
  background:white;
}

textarea{
  min-height:80px;
  resize:vertical;
}

.field{
  margin-bottom:11px;
}

.btn{
  border:0;
  border-radius:12px;
  padding:13px 15px;
  font-weight:900;
  width:100%;
}

.btn-primary{
  background:#4f46e5;
  color:white;
}

.btn-dark{
  background:#111827;
  color:white;
}

.btn-green{
  background:#059669;
  color:white;
}

.btn-red{
  background:#dc2626;
  color:white;
}

.btn-light{
  background:#eef2ff;
  color:#4338ca;
}

.mark-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.mark{
  border:2px solid #e5e7eb;
  background:white;
  border-radius:13px;
  padding:12px 5px;
  text-align:center;
  font-weight:900;
  font-size:20px;
}

.mark.selected{
  border-color:#4f46e5;
  background:#eef2ff;
  transform:scale(1.02);
}

.mark-name{
  display:block;
  font-size:9px;
  color:#64748b;
  margin-top:3px;
}

.history-item{
  border:1px solid #e5e7eb;
  border-radius:15px;
  padding:14px;
  margin-bottom:9px;
  background:white;
}

.history-item:last-child{
  margin-bottom:0;
}

.history-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.race-name{
  font-size:15px;
  font-weight:900;
}

.date{
  color:#64748b;
  font-size:10px;
  margin-top:3px;
}

.history-result{
  text-align:right;
  font-weight:900;
}

.badges{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.badge{
  padding:13px;
  border-radius:15px;
  background:#f8fafc;
  border:1px solid #e5e7eb;
}

.badge-icon{
  font-size:24px;
}

.badge-title{
  font-weight:900;
  font-size:12px;
  margin-top:3px;
}

.badge-desc{
  color:#64748b;
  font-size:10px;
  margin-top:2px;
}

.chart-wrap{
  width:100%;
  overflow:hidden;
}

canvas{
  width:100%;
  height:220px;
  display:block;
}

.chart-info{
  display:flex;
  justify-content:space-between;
  font-size:11px;
  font-weight:800;
  margin-top:7px;
}

.empty{
  text-align:center;
  color:#94a3b8;
  padding:20px 5px;
  font-size:12px;
}

.modal-bg{
  position:fixed;
  inset:0;
  background:rgba(15,23,42,.65);
  z-index:100;
  display:none;
  align-items:flex-end;
  justify-content:center;
}

.modal-bg.show{
  display:flex;
}

.modal{
  width:100%;
  max-width:760px;
  max-height:92vh;
  overflow:auto;
  background:#f8fafc;
  border-radius:24px 24px 0 0;
  padding:20px 15px 30px;
}

.modal-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.modal-title{
  font-size:19px;
  font-weight:900;
}

.close{
  border:0;
  background:#e5e7eb;
  width:36px;
  height:36px;
  border-radius:50%;
  font-size:18px;
}

.detail-box{
  background:white;
  border-radius:16px;
  padding:15px;
  margin-bottom:10px;
}

.detail-row{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:8px 0;
  border-bottom:1px solid #eef2f7;
  font-size:12px;
}

.detail-row:last-child{
  border-bottom:0;
}

.detail-label{
  color:#64748b;
}

.horse-list{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.horse{
  background:#f8fafc;
  border:1px solid #e5e7eb;
  border-radius:12px;
  padding:10px;
}

.horse-number{
  font-size:10px;
  color:#64748b;
}

.horse-name{
  font-weight:900;
  font-size:13px;
  margin-top:2px;
}

.horse-mark{
  margin-top:5px;
  font-size:18px;
  font-weight:900;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin-top:10px;
}

.notice{
  background:#fffbeb;
  border:1px solid #fde68a;
  color:#92400e;
  border-radius:13px;
  padding:12px;
  font-size:11px;
  line-height:1.6;
}

.footer{
  text-align:center;
  color:#94a3b8;
  font-size:10px;
  padding:10px 0 30px;
}

@media(min-width:600px){
  .grid{
    grid-template-columns:repeat(4,1fr);
  }

  .badges{
    grid-template-columns:repeat(3,1fr);
  }

  .mark-grid{
    grid-template-columns:repeat(6,1fr);
  }
}
</style>
</head>

<body>

<header class="header">
  <small>HORSE RACING MANAGEMENT</small>
  <h1>🏇 競馬牧場DX</h1>
  <p>予想・結果・収支をひとつにつなげる。</p>
</header>

<main class="container">

  <div class="balance">
    <div class="balance-label">現在の総収支</div>
    <div id="balance" class="balance-number">¥0</div>
  </div>

  <div class="card">
    <div class="card-title">📊 収支サマリー</div>

    <div class="grid">

      <div class="stat">
        <div class="stat-label">総投資</div>
        <div id="totalBet" class="stat-value">¥0</div>
      </div>

      <div class="stat">
        <div class="stat-label">総回収</div>
        <div id="totalReturn" class="stat-value">¥0</div>
      </div>

      <div class="stat">
        <div class="stat-label">回収率</div>
        <div id="roi" class="stat-value">—</div>
      </div>

      <div class="stat">
        <div class="stat-label">記録レース</div>
        <div id="raceCount" class="stat-value">0R</div>
      </div>

    </div>
  </div>


  <!-- 予想登録 -->

  <div class="card">

    <div class="card-title">🎯 予想を記録</div>

    <div class="field">
      <label>開催日</label>
      <input id="predictionDate" type="date">
    </div>

    <div class="field">
      <label>競馬場</label>
      <input id="predictionPlace" placeholder="例：新潟">
    </div>

    <div class="field">
      <label>レース</label>
      <input id="predictionRace" placeholder="例：11R 新潟記念">
    </div>

    <div class="field">
      <label>予想メモ</label>
      <textarea id="predictionMemo" placeholder="展開・馬場・調教など"></textarea>
    </div>

    <label>印を選択</label>

    <div class="mark-grid">

      <button type="button" class="mark" data-mark="◎">
        ◎
        <span class="mark-name">本命</span>
      </button>

      <button type="button" class="mark" data-mark="○">
        ○
        <span class="mark-name">対抗</span>
      </button>

      <button type="button" class="mark" data-mark="▲">
        ▲
        <span class="mark-name">単穴</span>
      </button>

      <button type="button" class="mark" data-mark="☆">
        ☆
        <span class="mark-name">穴</span>
      </button>

      <button type="button" class="mark" data-mark="△">
        △
        <span class="mark-name">連下</span>
      </button>

      <button type="button" class="mark" data-mark="消">
        消
        <span class="mark-name">消し</span>
      </button>

    </div>

    <div class="field" style="margin-top:12px">
      <label>印を付けた馬</label>
      <input id="horseName" placeholder="例：パンジャタワー">
    </div>

    <div class="field">
      <label>買い目</label>
      <textarea id="bets" placeholder="例：3連複 ③－⑧－⑭"></textarea>
    </div>

    <button id="savePrediction" class="btn btn-primary">
      ＋ 予想を保存
    </button>

  </div>


  <!-- 予想履歴 -->

  <div class="card">

    <div class="card-title">📖 予想履歴</div>

    <div id="predictionHistory">
      <div class="empty">
        まだ予想がありません。
      </div>
    </div>

  </div>


  <!-- 収支グラフ -->

  <div class="card">

    <div class="card-title">📊 収支推移</div>

    <div class="chart-wrap">
      <canvas id="chart"></canvas>
    </div>

    <div class="chart-info">
      <span id="chartMin">マイナス ¥0</span>
      <span id="chartMax">プラス ¥0</span>
    </div>

    <div class="chart-info">
      <span>0R</span>
      <span id="chartRaceLabel">0レース</span>
    </div>

  </div>


  <!-- 成績 -->

  <div class="card">

    <div class="card-title">🏆 予想成績</div>

    <div class="grid">

      <div class="stat">
        <div class="stat-label">予想数</div>
        <div id="predictionCount" class="stat-value">0</div>
      </div>

      <div class="stat">
        <div class="stat-label">結果入力済</div>
        <div id="resultCount" class="stat-value">0</div>
      </div>

      <div class="stat">
        <div class="stat-label">的中</div>
        <div id="hitCount" class="stat-value">0</div>
      </div>

      <div class="stat">
        <div class="stat-label">的中率</div>
        <div id="hitRate" class="stat-value">—</div>
      </div>

    </div>

  </div>


  <!-- 称号 -->

  <div class="card">

    <div class="card-title">🏅 実績・称号</div>

    <div id="badges" class="badges"></div>

  </div>


  <!-- バックアップ -->

  <div class="card">

    <div class="card-title">💾 データ管理</div>

    <div class="notice">
      データはこのiPhoneのブラウザ内に保存します。
      万一に備えて、定期的にバックアップを保存してください。
    </div>

    <div class="actions">

      <button id="exportData" class="btn btn-dark">
        📤 バックアップ
      </button>

      <button id="importData" class="btn btn-light">
        📥 復元
      </button>

    </div>

    <input id="fileInput" type="file" accept=".json" style="display:none">

  </div>


  <div class="footer">
    競馬牧場DX
  </div>

</main>


<!-- 詳細モーダル -->

<div id="modalBg" class="modal-bg">

  <div class="modal">

    <div class="modal-header">

      <div class="modal-title">
        📋 予想詳細
      </div>

      <button id="closeModal" class="close">
        ×
      </button>

    </div>

    <div id="modalContent"></div>

  </div>

</div>


<script>

/* =========================
   データ
========================= */

const STORAGE_KEY = "keiba_bokujou_dx_v3";

let data = {
  predictions: [],
  records: []
};

let selectedMark = "◎";
let editingPredictionId = null;


/* =========================
   初期読み込み
========================= */

function loadData(){

  try{

    const saved = localStorage.getItem(STORAGE_KEY);

    if(saved){

      const parsed = JSON.parse(saved);

      if(parsed && typeof parsed === "object"){

        data.predictions = Array.isArray(parsed.predictions)
          ? parsed.predictions
          : [];

        data.records = Array.isArray(parsed.records)
          ? parsed.records
          : [];

      }

    }

  }catch(error){

    console.error(error);

  }

}


/* =========================
   保存
========================= */

function saveData(){

  try{

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(data)
    );

  }catch(error){

    alert("保存に失敗しました。空き容量を確認してください。");

  }

}


/* =========================
   金額
========================= */

function yen(value){

  const n = Number(value) || 0;

  return "¥" + Math.round(n).toLocaleString("ja-JP");

}


/* =========================
   今日の日付
========================= */

function today(){

  const d = new Date();

  const y = d.getFullYear();

  const m = String(d.getMonth()+1).padStart(2,"0");

  const day = String(d.getDate()).padStart(2,"0");

  return `${y}-${m}-${day}`;

}


/* =========================
   XSS対策
========================= */

function esc(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   印
========================= */

document.querySelectorAll(".mark").forEach(button=>{

  button.addEventListener("click",()=>{

    document.querySelectorAll(".mark")
      .forEach(x=>x.classList.remove("selected"));

    button.classList.add("selected");

    selectedMark = button.dataset.mark;

  });

});

document.querySelector('[data-mark="◎"]')
  .classList.add("selected");


/* =========================
   予想保存
========================= */

document.getElementById("savePrediction")
.addEventListener("click",()=>{

  const date =
    document.getElementById("predictionDate").value
    || today();

  const place =
    document.getElementById("predictionPlace").value.trim();

  const race =
    document.getElementById("predictionRace").value.trim();

  const horse =
    document.getElementById("horseName").value.trim();

  const bets =
    document.getElementById("bets").value.trim();

  const memo =
    document.getElementById("predictionMemo").value.trim();


  if(!race){

    alert("レース名を入力してください。");

    return;

  }


  const prediction = {

    id: editingPredictionId || Date.now(),

    date,

    place,

    race,

    horse,

    mark:selectedMark,

    bets,

    memo,

    result:null,

    hit:false,

    resultEntered:false,

    createdAt:new Date().toISOString()

  };


  if(editingPredictionId){

    const index =
      data.predictions.findIndex(
        x=>x.id===editingPredictionId
      );

    if(index !== -1){

      const old = data.predictions[index];

      prediction.result = old.result;

      prediction.hit = old.hit;

      prediction.resultEntered = old.resultEntered;

      data.predictions[index] = prediction;

    }

    editingPredictionId = null;

  }else{

    data.predictions.push(prediction);

  }


  saveData();

  clearPredictionForm();

  renderAll();

  alert("予想を保存しました！");

});


/* =========================
   フォームクリア
========================= */

function clearPredictionForm(){

  document.getElementById("predictionDate").value = today();

  document.getElementById("predictionPlace").value = "";

  document.getElementById("predictionRace").value = "";

  document.getElementById("horseName").value = "";

  document.getElementById("bets").value = "";

  document.getElementById("predictionMemo").value = "";

  selectedMark = "◎";

  document.querySelectorAll(".mark")
    .forEach(x=>x.classList.remove("selected"));

  document.querySelector('[data-mark="◎"]')
    .classList.add("selected");

}


/* =========================
   予想履歴
========================= */

function renderPredictions(){

  const box =
    document.getElementById("predictionHistory");


  if(!data.predictions.length){

    box.innerHTML =
      '<div class="empty">まだ予想がありません。</div>';

    return;

  }


  const list =
    [...data.predictions]
    .sort((a,b)=>b.id-a.id);


  box.innerHTML = list.map(p=>{

    let resultText = "結果未入力";

    let resultClass = "";

    if(p.resultEntered){

      resultText = p.hit
        ? "🎯 的中"
        : "❌ 不的中";

      resultClass =
        p.hit ? "plus" : "minus";

    }


    return `

      <div
        class="history-item"
        data-id="${p.id}"
      >

        <div class="history-top">

          <div>

            <div class="race-name">
              ${esc(p.place)}
              ${esc(p.race)}
            </div>

            <div class="date">
              ${esc(p.date)}
            </div>

          </div>

          <div
            class="history-result ${resultClass}"
          >
            ${resultText}
          </div>

        </div>


        <div style="margin-top:10px;font-size:13px;font-weight:900">

          ${esc(p.mark)}
          ${esc(p.horse || "馬名未入力")}

        </div>


        <div
          style="margin-top:5px;font-size:11px;color:#64748b"
        >
          ${esc(p.bets || "買い目未入力")}
        </div>

      </div>

    `;

  }).join("");


  box.querySelectorAll(".history-item")
    .forEach(item=>{

      item.addEventListener("click",()=>{

        const id =
          Number(item.dataset.id);

        openDetail(id);

      });

    });

}


/* =========================
   詳細
========================= */

function openDetail(id){

  const p =
    data.predictions.find(x=>x.id===id);

  if(!p) return;


  const content =
    document.getElementById("modalContent");


  let resultArea = "";


  if(p.resultEntered){

    resultArea = `

      <div class="detail-box">

        <div class="detail-row">

          <span class="detail-label">
            結果
          </span>

          <b>${esc(p.result)}</b>

        </div>

        <div class="detail-row">

          <span class="detail-label">
            判定
          </span>

          <b class="${p.hit ? "plus":"minus"}">
            ${p.hit ? "🎯 的中":"❌ 不的中"}
          </b>

        </div>

      </div>

    `;

  }else{

    resultArea = `

      <div class="detail-box">

        <div class="card-title">
          🏁 結果を入力
        </div>

        <div class="field">

          <label>結果</label>

          <input
            id="resultInput"
            placeholder="例：1着 / 3着 / 5着"
          >

        </div>


        <div class="field">

          <label>的中判定</label>

          <select id="hitInput">

            <option value="false">
              ❌ 不的中
            </option>

            <option value="true">
              🎯 的中
            </option>

          </select>

        </div>


        <div class="field">

          <label>投資額</label>

          <input
            id="resultBet"
            type="number"
            min="0"
            inputmode="numeric"
            placeholder="3000"
          >

        </div>


        <div class="field">

          <label>回収額</label>

          <input
            id="resultReturn"
            type="number"
            min="0"
            inputmode="numeric"
            placeholder="7200"
          >

        </div>


        <button
          id="saveResult"
          class="btn btn-green"
        >
          結果を保存して収支に反映
        </button>

      </div>

    `;

  }


  content.innerHTML = `

    <div class="detail-box">

      <div class="detail-row">

        <span class="detail-label">
          レース
        </span>

        <b>
          ${esc(p.place)}
          ${esc(p.race)}
        </b>

      </div>


      <div class="detail-row">

        <span class="detail-label">
          日付
        </span>

        <b>${esc(p.date)}</b>

      </div>


      <div class="detail-row">

        <span class="detail-label">
          印
        </span>

        <b style="font-size:22px">
          ${esc(p.mark)}
        </b>

      </div>


      <div class="detail-row">

        <span class="detail-label">
          馬
        </span>

        <b>${esc(p.horse)}</b>

      </div>


      <div class="detail-row">

        <span class="detail-label">
          買い目
        </span>

        <b>${esc(p.bets || "未入力")}</b>

      </div>


      <div class="detail-row">

        <span class="detail-label">
          メモ
        </span>

        <b>${esc(p.memo || "なし")}</b>

      </div>

    </div>


    ${resultArea}


    <div class="actions">

      <button
        id="editPrediction"
        class="btn btn-light"
      >
        ✏️ 予想を編集
      </button>

      <button
        id="deletePrediction"
        class="btn btn-red"
      >
        🗑 削除
      </button>

    </div>

  `;


  document
    .getElementById("modalBg")
    .classList.add("show");


  document
    .getElementById("editPrediction")
    .addEventListener("click",()=>{

      editPrediction(id);

    });


  document
    .getElementById("deletePrediction")
    .addEventListener("click",()=>{

      deletePrediction(id);

    });


  const saveResult =
    document.getElementById("saveResult");


  if(saveResult){

    saveResult.addEventListener("click",()=>{

      saveResultData(id);

    });

  }

}


/* =========================
   予想編集
========================= */

function editPrediction(id){

  const p =
    data.predictions.find(x=>x.id===id);

  if(!p) return;


  editingPredictionId = id;


  document.getElementById("predictionDate").value =
    p.date || today();

  document.getElementById("predictionPlace").value =
    p.place || "";

  document.getElementById("predictionRace").value =
    p.race || "";

  document.getElementById("horseName").value =
    p.horse || "";

  document.getElementById("bets").value =
    p.bets || "";

  document.getElementById("predictionMemo").value =
    p.memo || "";


  selectedMark = p.mark || "◎";


  document.querySelectorAll(".mark")
    .forEach(x=>{

      x.classList.toggle(
        "selected",
        x.dataset.mark===selectedMark
      );

    });


  closeModal();


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });


  document.getElementById("savePrediction")
    .textContent =
      "✏️ 予想を更新";

}


/* =========================
   結果保存
========================= */

function saveResultData(id){

  const p =
    data.predictions.find(x=>x.id===id);

  if(!p) return;


  const result =
    document.getElementById("resultInput")
      .value.trim();

  const hit =
    document.getElementById("hitInput")
      .value === "true";

  const bet =
    Number(
      document.getElementById("resultBet").value
    ) || 0;

  const ret =
    Number(
      document.getElementById("resultReturn").value
    ) || 0;


  if(!result){

    alert("結果を入力してください。");

    return;

  }


  p.result = result;

  p.hit = hit;

  p.resultEntered = true;


  /*
    同じ予想の結果を二重に
    収支へ登録しない
  */

  const existing =
    data.records.find(
      x=>x.predictionId===id
    );


  if(existing){

    existing.bet = bet;

    existing.ret = ret;

    existing.date = p.date;

    existing.race = p.race;

  }else{

    data.records.push({

      id:Date.now(),

      predictionId:id,

      date:p.date,

      race:p.race,

      bet,

      ret

    });

  }


  saveData();

  renderAll();

  openDetail(id);


  alert("結果を保存しました。収支にも反映されています。");

}


/* =========================
   予想削除
========================= */

function deletePrediction(id){

  if(!confirm("この予想を削除しますか？")){

    return;

  }


  data.predictions =
    data.predictions.filter(
      x=>x.id!==id
    );


  data.records =
    data.records.filter(
      x=>x.predictionId!==id
    );


  saveData();

  closeModal();

  renderAll();

}


/* =========================
   モーダル
========================= */

function closeModal(){

  document
    .getElementById("modalBg")
    .classList.remove("show");

}


document
  .getElementById("closeModal")
  .addEventListener("click",closeModal);


document
  .getElementById("modalBg")
  .addEventListener("click",e=>{

    if(e.target.id==="modalBg"){

      closeModal();

    }

  });


/* =========================
   収支集計
========================= */

function renderStats(){

  const bet =
    data.records.reduce(
      (s,x)=>s+(Number(x.bet)||0),
      0
    );

  const ret =
    data.records.reduce(
      (s,x)=>s+(Number(x.ret)||0),
      0
    );

  const profit =
    ret-bet;


  const balance =
    document.getElementById("balance");


  balance.textContent =
    (profit>=0 ? "+" : "") + yen(profit);


  balance.className =
    "balance-number " +
    (profit>=0 ? "plus":"minus");


  document.getElementById("totalBet")
    .textContent=yen(bet);

  document.getElementById("totalReturn")
    .textContent=yen(ret);

  document.getElementById("roi")
    .textContent =
      bet
      ? (ret/bet*100).toFixed(1)+"%"
      : "—";

  document.getElementById("raceCount")
    .textContent =
      data.records.length+"R";


  const predictions =
    data.predictions.length;

  const resultCount =
    data.predictions.filter(
      x=>x.resultEntered
    ).length;

  const hits =
    data.predictions.filter(
      x=>x.resultEntered && x.hit
    ).length;


  document.getElementById("predictionCount")
    .textContent=predictions;

  document.getElementById("resultCount")
    .textContent=resultCount;

  document.getElementById("hitCount")
    .textContent=hits;

  document.getElementById("hitRate")
    .textContent =
      resultCount
      ? (hits/resultCount*100).toFixed(1)+"%"
      : "—";

}


/* =========================
   称号
========================= */

  const predictions =
    data.predictions.length;

  const results =
    data.predictions.filter(
      x=>x.resultEntered
    ).length;

    ],

    [
      "📚",

      "予想を10件記録",
      predictions>=10
    ],

    [
      "🎯",
      "的中馬券",
      "的中を1件記録",
      hits>=1
    ],

      "💰",
      "黒字化",
      "総収支＋1万円",

    ],

    [

/* =========================
   グラフ
========================= */

function drawChart(){

  const canvas =
    document.getElementById("chart");

  const rect =
    canvas.getBoundingClientRect();

  const ratio =
    window.devicePixelRatio || 1;


  canvas.width =
    rect.width * ratio;

  canvas.height =
    rect.height * ratio;


  const ctx =
    canvas.getContext("2d");

  ctx.scale(ratio,ratio);


  const width = rect.width;

  const height = rect.height;


  ctx.clearRect(
    0,
    0,
    width,
    height
  );


  if(!data.records.length){

    ctx.fillStyle="#94a3b8";

    ctx.font="12px sans-serif";

    ctx.textAlign="center";

    ctx.fillText(
      "収支を登録するとグラフが表示されます",
      width/2,
      height/2
    );

    document.getElementById("chartMin")
      .textContent="マイナス ¥0";

    document.getElementById("chartMax")
      .textContent="プラス ¥0";

    document.getElementById("chartRaceLabel")
      .textContent="0レース";

    return;

  }


  let total=0;

  const values =
    data.records.map(r=>{

      total +=
        (Number(r.ret)||0) -
        (Number(r.bet)||0);

      return total;

    });


  const min =
    Math.min(0,...values);

  const max =
    Math.max(0,...values);

  const range =
    max-min || 1;


  document.getElementById("chartMin")
    .textContent =
      "マイナス " + yen(Math.abs(min));

  document.getElementById("chartMax")
    .textContent =
      "プラス " + yen(max);

  document.getElementById("chartRaceLabel")
    .textContent =
      data.records.length+"レース";


  /*
    0ライン
  */

  const zeroY =
    height -
    ((0-min)/range)*(height-25)-10;


  ctx.strokeStyle="#dbe1e8";

  ctx.lineWidth=1;

  ctx.beginPath();

  ctx.moveTo(0,zeroY);

  ctx.lineTo(width,zeroY);

  ctx.stroke();


  /*
    グラフ
  */

  for(let i=1;i<values.length;i++){

    const x1 =
      (i-1)/
      Math.max(1,values.length-1)*
      width;

    const x2 =
      i/
      Math.max(1,values.length-1)*
      width;


    const y1 =
      height-
      ((values[i-1]-min)/range)*
      (height-25)-10;

    const y2 =
      height-
      ((values[i]-min)/range)*
      (height-25)-10;


    ctx.beginPath();

    ctx.moveTo(x1,y1);

    ctx.lineTo(x2,y2);

    /*
      プラスは緑
      マイナスは赤
    */

    ctx.strokeStyle =
      values[i]>=0
      ? "#059669"
      : "#dc2626";

    ctx.lineWidth=4;

    ctx.lineCap="round";

    ctx.stroke();

  }


  /*
    最終地点
  */

  const lastX=width;

  const lastY=
    height-
    ((values[values.length-1]-min)/range)*
    (height-25)-10;


  ctx.beginPath();

  ctx.arc(
    lastX,
    lastY,
    5,
    0,
    Math.PI*2
  );

  ctx.fillStyle =
    values[values.length-1]>=0
    ? "#059669"
    : "#dc2626";

  ctx.fill();

}


/* =========================
   バックアップ
========================= */

document.getElementById("exportData")
.addEventListener("click",()=>{

  const json =
    JSON.stringify(data,null,2);

  const blob =
    new Blob(
      [json],
      {type:"application/json"}
    );

  const url =
    URL.createObjectURL(blob);

  const a =
    document.createElement("a");

  a.href=url;

  a.download=
    "競馬牧場DXバックアップ.json";

  a.click();

  URL.revokeObjectURL(url);

});


/* =========================
   復元
========================= */

document.getElementById("importData")
.addEventListener("click",()=>{

  document.getElementById("fileInput").click();

});


document.getElementById("fileInput")
.addEventListener("change",e=>{

  const file=e.target.files[0];

  if(!file) return;


  const reader =
    new FileReader();


  reader.onload=()=>{

    try{

      const imported =
        JSON.parse(reader.result);


      if(
        !imported ||
        !Array.isArray(imported.predictions) ||
        !Array.isArray(imported.records)
      ){

        alert("正しいバックアップファイルではありません。");

        return;

      }


      if(
        !confirm(
          "現在のデータをバックアップデータに置き換えますか？"
        )
      ){

        return;

      }


      data=imported;

      saveData();

      renderAll();

      alert("データを復元しました！");


    }catch(error){

      alert("バックアップファイルを読み込めませんでした。");

    }

  };


  reader.readAsText(file);

});


/* =========================
   全体更新
========================= */

function renderAll(){

  renderStats();

  renderPredictions();

  renderBadges();

  drawChart();

}

   初期化
========================= */

loadData();

document.getElementById("predictionDate")
  .value=today();

renderAll();

);

</script>
