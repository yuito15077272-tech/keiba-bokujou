<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>競馬牧場</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;
  background:#f4f6f8;
  color:#172033;
}

body{
  padding-bottom:40px;
}

button,
input,
select{
  font:inherit;
}

button{
  -webkit-tap-highlight-color:transparent;
}

.header{
  background:#0f172a;
  color:#fff;
  padding:18px 16px 16px;
  position:sticky;
  top:0;
  z-index:20;
}

.header-title{
  font-size:22px;
  font-weight:800;
}

.header-sub{
  margin-top:4px;
  font-size:12px;
  opacity:.75;
}

.container{
  max-width:900px;
  margin:0 auto;
  padding:14px;
}

.card{
  background:#fff;
  border-radius:16px;
  padding:16px;
  margin-bottom:14px;
  box-shadow:0 4px 16px rgba(15,23,42,.07);
}

.card-title{
  font-size:17px;
  font-weight:800;
  margin-bottom:12px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.field{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.field.full{
  grid-column:1 / -1;
}

label{
  font-size:12px;
  font-weight:700;
  color:#667085;
}

input,
select{
  width:100%;
  min-height:46px;
  border:1px solid #d9dee7;
  border-radius:10px;
  background:#fff;
  padding:10px 12px;
  color:#172033;
  outline:none;
}

input:focus,
select:focus{
  border-color:#2563eb;
}

.btn{
  width:100%;
  min-height:48px;
  border:0;
  border-radius:12px;
  font-weight:800;
  cursor:pointer;
}

.btn-primary{
  background:#2563eb;
  color:#fff;
}

.btn-secondary{
  background:#e9eef5;
  color:#172033;
}

.btn-danger{
  background:#fee2e2;
  color:#b91c1c;
}

.nav{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-bottom:14px;
}

.nav button{
  min-height:44px;
  border:0;
  border-radius:10px;
  background:#fff;
  color:#475467;
  font-weight:800;
}

.nav button.active{
  background:#2563eb;
  color:#fff;
}

.page{
  display:none;
}

.page.active{
  display:block;
}

.hidden{
  display:none !important;
}

.empty{
  text-align:center;
  color:#98a2b3;
  padding:30px 10px;
}

@media(max-width:600px){
  .grid{
    grid-template-columns:1fr;
  }

  .field.full{
    grid-column:auto;
  }
}
</style>
</head>

<body>

<header class="header">
  <div class="header-title">🏇 競馬牧場</div>
  <div class="header-sub">競馬予想・成績・収支分析</div>
</header>

<main class="container">

  <nav class="nav">
    <button class="active" data-page="inputPage">入力</button>
    <button data-page="resultPage">結果</button>
    <button data-page="statsPage">分析</button>
  </nav>

  <section id="inputPage" class="page active">

    <div class="card">
      <div class="card-title">🏇 レース情報</div>

      <div class="grid">

        <div class="field">
          <label>競馬場</label>
          <select id="track">
            <option value="">選択してください</option>
            <option>札幌</option>
            <option>函館</option>
            <option>福島</option>
            <option>新潟</option>
            <option>東京</option>
            <option>中山</option>
            <option>中京</option>
            <option>京都</option>
            <option>阪神</option>
            <option>小倉</option>
          </select>
        </div>

        <div class="field">
          <label>レース番号</label>
          <select id="raceNo">
            <option value="">選択</option>
            <option>1R</option>
            <option>2R</option>
            <option>3R</option>
            <option>4R</option>
            <option>5R</option>
            <option>6R</option>
            <option>7R</option>
            <option>8R</option>
            <option>9R</option>
            <option>10R</option>
            <option>11R</option>
            <option>12R</option>
          </select>
        </div>

        <div class="field">
          <label>馬場</label>
          <select id="surface">
            <option value="">選択してください</option>
            <option>芝</option>
            <option>ダート</option>
            <option>障害</option>
          </select>
        </div>

        <div class="field">
          <label>距離</label>
          <select id="distance">
            <option value="">選択してください</option>
          </select>
        </div>

        <div class="field">
          <label>クラス</label>
          <select id="raceClass">
            <option value="">選択してください</option>
            <option>新馬</option>
            <option>未勝利</option>
            <option>1勝クラス</option>
            <option>2勝クラス</option>
            <option>3勝クラス</option>
            <option>オープン</option>
            <option>重賞</option>
          </select>
        </div>

        <div class="field">
          <label>馬場状態</label>
          <select id="ground">
            <option value="">選択してください</option>
            <option>良</option>
            <option>稍重</option>
            <option>重</option>
            <option>不良</option>
          </select>
        </div>

        <div class="field">
          <label>頭数</label>
          <select id="fieldSize">
            <option value="">選択してください</option>
            <script>
              for(let i=1;i<=18;i++){
                document.write(`<option value="${i}">${i}頭</option>`);
              }
            </script>
          </select>
        </div>

      </div>
    </div>

    <div class="card">
      <div class="card-title">🐎 出走馬</div>

      <div id="horseList"></div>

      <button class="btn btn-secondary" id="addHorseBtn">
        ＋ 馬を追加
      </button>
    </div>

    <div class="card">
      <div class="card-title">💰 収支</div>

      <div class="grid">

        <div class="field">
          <label>投資額</label>
          <input id="investment" type="number" inputmode="numeric" placeholder="0">
        </div>

        <div class="field">
          <label>回収額</label>
          <input id="returnAmount" type="number" inputmode="numeric" placeholder="0">
        </div>

        <div class="field full">
          <label>レース名・メモ</label>
          <input id="raceName" type="text" placeholder="例：新潟記念">
        </div>

      </div>
    </div>

    <button class="btn btn-primary" id="savePredictionBtn">
      💾 予想を保存
    </button>

  </section>


  <section id="resultPage" class="page">

    <div class="card">
      <div class="card-title">🏁 結果入力</div>

      <div id="resultContent">
        <div class="empty">
          保存した予想を選択すると結果を入力できます。
        </div>
      </div>
    </div>

  </section>


  <section id="statsPage" class="page">

    <div class="card">
      <div class="card-title">📊 成績分析</div>

      <div id="statsContent">
        <div class="empty">
          まだデータがありません。
        </div>
      </div>

    </div>

  </section>

</main>

<script>

const DISTANCES = [
  1000,1100,1200,1300,1400,1500,1600,
  1700,1800,1900,2000,2100,2200,2300,
  2400,2500,2600,3000,3200,3400,3600
];

const MARKS = ["","◎","○","▲","☆","△","消","－"];

const STORAGE_KEY = "keiba_bokujou_final";

const appState = {
  predictions: [],
  currentPredictionId: null
};

function $(id){
  return document.getElementById(id);
}

function saveData(){
  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(appState)
  );
}

function loadData(){

  try{

    const saved = localStorage.getItem(STORAGE_KEY);

    if(saved){

      const data = JSON.parse(saved);

      if(data && typeof data === "object"){
        appState.predictions =
          Array.isArray(data.predictions)
          ? data.predictions
          : [];

        appState.currentPredictionId =
          data.currentPredictionId || null;
      }

    }

  }catch(e){

    console.error("データ読み込みエラー",e);

  }

}

function showPage(pageId){

  document.querySelectorAll(".page").forEach(page=>{
    page.classList.remove("active");
  });

  const target = $(pageId);

  if(target){
    target.classList.add("active");
  }

  document.querySelectorAll(".nav button").forEach(button=>{
    button.classList.toggle(
      "active",
      button.dataset.page === pageId
    );
  });

}

document.querySelectorAll(".nav button").forEach(button=>{

  button.addEventListener("click",()=>{

    showPage(button.dataset.page);

  });

});


function setupDistance(){

  const select = $("distance");

  if(!select) return;

  DISTANCES.forEach(distance=>{

    const option = document.createElement("option");

    option.value = distance;

    option.textContent = distance + "m";

    select.appendChild(option);

  });

}


let horseCount = 0;

function createHorseRow(){

  horseCount++;

  const row = document.createElement("div");

  row.className = "horse-row";

  row.style.marginBottom = "10px";
  row.style.padding = "10px";
  row.style.border = "1px solid #e4e7ec";
  row.style.borderRadius = "12px";

  row.innerHTML = `

    <div class="grid">

      <div class="field">
        <label>枠</label>
        <select class="horse-frame">
          <option value="">枠</option>
          <option>1</option>
          <option>2</option>
          <option>3</option>
          <option>4</option>
          <option>5</option>
          <option>6</option>
          <option>7</option>
          <option>8</option>
        </select>
      </div>

      <div class="field">
        <label>馬番</label>
        <input class="horse-number" type="number" inputmode="numeric" placeholder="馬番">
      </div>

      <div class="field full">
        <label>馬名</label>
        <input class="horse-name" type="text" placeholder="馬名">
      </div>

      <div class="field">
        <label>印</label>
        <select class="horse-mark">
          ${MARKS.map(mark=>`
            <option value="${mark}">${mark || "なし"}</option>
          `).join("")}
        </select>
      </div>

      <div class="field">
        <label>人気</label>
        <input class="horse-popularity" type="number" inputmode="numeric" placeholder="人気">
      </div>

    </div>

  `;

  $("horseList").appendChild(row);

}


$("addHorseBtn").addEventListener(
  "click",
  createHorseRow
);


$("fieldSize").addEventListener(
  "change",
  function(){

    const size = Number(this.value);

    if(!size) return;

    $("horseList").innerHTML = "";

    horseCount = 0;

    for(let i=0;i<size;i++){
      createHorseRow();
    }

  }
);


$("savePredictionBtn").addEventListener(
  "click",
  function(){

    alert("予想保存機能は次のブロックで完成させます。");

  }
);


loadData();

setupDistance();

</script>

</body>
</html>
