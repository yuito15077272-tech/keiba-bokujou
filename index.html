<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">

<title>競馬牧場</title>

<style>
:root{
  --bg:#f4f6f8;
  --card:#ffffff;
  --ink:#172033;
  --muted:#667085;
  --line:#e4e7ec;
  --navy:#0f172a;
  --blue:#2563eb;
  --green:#16a34a;
  --red:#dc2626;
  --gold:#d4a72c;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    Meiryo,
    sans-serif;
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  max-width:760px;
  margin:auto;
  padding-bottom:92px;
}

/* =========================
   HEADER
========================= */

header{
  position:sticky;
  top:0;
  z-index:30;
  background:linear-gradient(
    135deg,
    #0b1220,
    #1e293b
  );
  color:#fff;
  padding:17px 15px 16px;
  box-shadow:0 3px 14px #0003;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.brand-mark{
  width:42px;
  height:42px;
  border-radius:13px;
  background:#ffffff12;
  display:grid;
  place-items:center;
  font-size:25px;
}

.title{
  font-size:23px;
  font-weight:950;
  letter-spacing:.03em;
  color:#fff;
}

.subtitle{
  font-size:11px;
  color:#cbd5e1;
  margin-top:2px;
}

/* =========================
   PAGE
========================= */

.page{
  display:none;
  padding:14px;
}

.page.active{
  display:block;
}

/* =========================
   CARD
========================= */

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:17px;
  padding:15px;
  margin-bottom:12px;
  box-shadow:0 2px 10px #1018280a;
}

h2{
  font-size:18px;
  margin:0 0 12px;
  font-weight:950;
  color:#172033;
}

h3{
  font-size:15px;
  margin:0 0 9px;
}

label{
  display:block;
  font-size:12px;
  font-weight:900;
  color:var(--muted);
  margin-bottom:6px;
}

input,
select{
  width:100%;
  height:46px;
  border:1px solid #d0d5dd;
  border-radius:11px;
  background:#fff;
  color:var(--ink);
  padding:0 12px;
  outline:none;
}

input:focus,
select:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 3px #2563eb18;
}

.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.grid3{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

/* =========================
   BUTTON
========================= */

.btn{
  border:0;
  border-radius:11px;
  min-height:44px;
  padding:10px 13px;
  font-weight:950;
}

.btn:active{
  transform:scale(.985);
}

.primary{
  background:var(--navy);
  color:#fff;
}

.green{
  background:var(--green);
  color:#fff;
}

.red{
  background:var(--red);
  color:#fff;
}

.light{
  background:#eef2f6;
  color:var(--ink);
}

.gold{
  background:#f4d66d;
  color:#3b2b00;
}

.full{
  width:100%;
}

.small{
  font-size:12px;
  color:var(--muted);
}

.center{
  text-align:center;
}

.plus{
  color:var(--green)!important;
}

.minus{
  color:var(--red)!important;
}

/* =========================
   CHARACTER
========================= */

.hero{
  overflow:hidden;
  background:
    linear-gradient(
      150deg,
      #f0fdf4,
      #fff
    );
}

.character-wrap{
  height:250px;
  border-radius:15px;
  background:
    linear-gradient(
      #dff3ff,
      #e8f7dc 62%,
      #c9e6b6 62%
    );
  position:relative;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  overflow:hidden;
  margin-bottom:11px;
}

.character-wrap:before{
  content:"";
  position:absolute;
  left:-30px;
  right:-30px;
  top:45px;
  height:90px;

  background:
    radial-gradient(
      ellipse,
      #fff9 0 32%,
      transparent 34%
    ),
    radial-gradient(
      ellipse,
      #fff7 0 28%,
      transparent 30%
    );

  opacity:.8;
}

.character-wrap:after{
  content:"";
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  height:55px;

  background:
    repeating-linear-gradient(
      155deg,
      #8fc17d 0 7px,
      #a9d494 7px 14px
    );

  opacity:.75;
}

.character-svg{
  position:relative;
  z-index:2;
  width:86%;
  height:220px;
  filter:drop-shadow(0 7px 4px #0002);
}

.levelline{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
}

.level{
  font-size:22px;
  font-weight:950;
}

.pill{
  border-radius:999px;
  padding:5px 9px;
  font-size:11px;
  font-weight:950;
  background:#eef2f6;
}

.expbar{
  height:11px;
  border-radius:99px;
  background:#e5e7eb;
  overflow:hidden;
  margin:8px 0;
}

.expfill{
  height:100%;
  width:0;
  background:
    linear-gradient(
      90deg,
      #22c55e,
      #a3e635
    );
  transition:width .4s;
}

/* =========================
   STATS
========================= */

.statgrid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
}

.stat{
  background:#f8fafc;
  border:1px solid var(--line);
  border-radius:12px;
  padding:10px;
}

.stat .v{
  font-size:20px;
  font-weight:950;
  margin-top:3px;
}

/* =========================
   HORSE
========================= */

.horse{
  border:1px solid var(--line);
  border-radius:14px;
  padding:10px;
  margin:8px 0;
  background:#fff;
}

.horse-row{
  display:grid;
  grid-template-columns:42px 1fr auto;
  gap:9px;
  align-items:center;
}

.number{
  font-size:18px;
  font-weight:950;
  text-align:center;
}

.horse-name{
  font-weight:950;
}

.mark-btn{
  border:1px solid #cfd4dc;
  background:#f8fafc;
  border-radius:10px;
  padding:8px 10px;
  min-width:88px;
  font-weight:950;
}

.mark-btn.set{
  background:#111827;
  color:#fff;
  border-color:#111827;
}

/* =========================
   MARK
========================= */

.mark-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
}

.mark{
  border:0;
  border-radius:11px;
  padding:12px 10px;
  font-weight:950;
  font-size:16px;
}

.m-◎{
  background:#fee2e2;
  color:#b91c1c;
}

.m-○{
  background:#dbeafe;
  color:#1d4ed8;
}

.m-▲{
  background:#fef3c7;
  color:#92400e;
}

.m-☆{
  background:#fce7f3;
  color:#be185d;
}

.m-△{
  background:#dcfce7;
  color:#166534;
}

.m-消{
  background:#e5e7eb;
  color:#374151;
}

.m-－{
  background:#f3f4f6;
  color:#6b7280;
}

/* =========================
   RACE
========================= */

.raceitem{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  border:1px solid var(--line);
  border-radius:13px;
  padding:12px;
  margin:8px 0;
  background:#fff;
}

.meta{
  font-size:12px;
  color:var(--muted);
  margin-top:3px;
}

.badge{
  border-radius:999px;
  padding:5px 9px;
  font-size:11px;
  font-weight:950;
  background:#eef2f6;
}

.badge.ok{
  background:#dcfce7;
  color:#166534;
}

.badge.ng{
  background:#fee2e2;
  color:#991b1b;
}

.resultrow{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.sheet-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

/* =========================
   CHART
========================= */

canvas{
  width:100%;
  height:190px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#fff;
}

/* =========================
   NAV
========================= */

.nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:40;

  background:#fff;
  border-top:1px solid var(--line);

  display:grid;
  grid-template-columns:repeat(4,1fr);

  padding-bottom:env(safe-area-inset-bottom);
}

.nav button{
  border:0;
  background:#fff;
  color:#667085;
  padding:9px 3px 8px;
  font-size:11px;
  font-weight:900;
}

.nav button strong{
  display:block;
  font-size:20px;
  line-height:21px;
}

.nav button.active{
  color:#111827;
}

/* =========================
   MODAL
========================= */

.modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:60;

  background:#0008;
  align-items:flex-end;
}

.modal.show{
  display:flex;
}

.sheet{
  width:100%;
  max-width:760px;
  margin:auto;

  background:#fff;

  border-radius:20px 20px 0 0;

  padding:16px;

  max-height:90vh;
  overflow:auto;
}

/* =========================
   TOAST
========================= */

.toast{
  position:fixed;
  left:50%;
  bottom:78px;
  z-index:90;

  transform:
    translate(-50%,20px);

  opacity:0;

  background:#111827;
  color:#fff;

  padding:11px 16px;

  border-radius:12px;

  font-weight:900;

  pointer-events:none;

  transition:.25s;

  white-space:nowrap;
}

.toast.show{
  opacity:1;
  transform:
    translate(-50%,0);
}

/* =========================
   EVOLUTION
========================= */

.evo{
  animation:evo .6s ease;
}

.evo-text{
  text-align:center;
  font-size:22px;
  font-weight:950;
  color:#b45309;
  margin:4px 0 10px;
}

@keyframes evo{
  0%{
    transform:scale(.65);
    opacity:.2;
  }

  65%{
    transform:scale(1.08);
  }

  100%{
    transform:scale(1);
    opacity:1;
  }
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:26px 8px;
}

.divider{
  height:1px;
  background:var(--line);
  margin:12px 0;
}

@media(min-width:700px){

  .nav{
    position:static;
    max-width:760px;
    margin:auto;
    border:1px solid var(--line);
    border-radius:15px;
  }

  .app{
    padding-bottom:20px;
  }

  .toast{
    bottom:20px;
  }
}
</style>
</head>

<body>

<div class="app">

<header>

  <div class="brand">

    <div class="brand-mark">
      🏇
    </div>

    <div>

      <div class="title">
        競馬牧場
      </div>

      <div class="subtitle">
        予想するほど、あなたの馬が強くなる。
      </div>

    </div>

  </div>

</header>


<!-- =========================
     HOME
========================= -->

<section id="home" class="page active">

  <div class="card hero">

    <div
      id="characterBox"
      class="character-wrap">
    </div>

    <div class="levelline">

      <div
        id="level"
        class="level">
        Lv.1
      </div>

      <div
        id="rank"
        class="pill">
        赤ちゃん馬
      </div>

    </div>

    <div
      class="small"
      id="expText">
      EXP 0 / 100
    </div>

    <div class="expbar">

      <div
        id="expFill"
        class="expfill">
      </div>

    </div>

    <div
      class="small">

      次の進化まであと

      <b id="nextText">
        100 EXP
      </b>

    </div>

  </div>


  <div class="card">

    <h2>
      📊 現在の成績
    </h2>

    <div class="statgrid">

      <div class="stat">
        <div class="small">
          総レース
        </div>

        <div
          id="sRaces"
          class="v">
          0
        </div>
      </div>

      <div class="stat">
        <div class="small">
          的中
        </div>

        <div
          id="sHits"
          class="v">
          0
        </div>
      </div>

      <div class="stat">
        <div class="small">
          回収率
        </div>

        <div
          id="sROI"
          class="v">
          0.0%
        </div>
      </div>

      <div class="stat">

        <div class="small">
          累計収支
        </div>

        <div
          id="sProfit"
          class="v">
          0円
        </div>

      </div>

    </div>

  </div>


  <button
    class="btn primary full"
    onclick="showPage('predict')">

    🏇 予想をはじめる

  </button>


  <div
    class="card"
    style="margin-top:12px">

    <h2>
      🌱 育成状況
    </h2>

    <div
      id="growthInfo"
      class="small">
    </div>

  </div>

</section>


<!-- =========================
     PREDICT
========================= -->

<section id="predict" class="page">

  <div class="card">

    <h2>
      📝 予想を登録
    </h2>

    <div class="grid2">

      <div>

        <label>
          競馬場
        </label>

        <select id="track">
        </select>

      </div>

      <div>

        <label>
          レース
        </label>

        <select id="raceNo">
        </select>

      </div>

    </div>


    <div
      class="grid2"
      style="margin-top:10px">

      <div>

        <label>
          芝・ダート・障害
        </label>

        <select id="surface">
        </select>

      </div>

      <div>

        <label>
          距離
        </label>

        <select id="distance">
        </select>

      </div>

    </div>


    <div style="margin-top:10px">

      <label>
        頭数
      </label>

      <select id="fieldSize">
      </select>

    </div>

  </div>


  <div class="card">

    <h2>
      🐴 出走馬
    </h2>

    <div class="small">

      馬番は数字のみ。

      馬名を入力して

      「印を選択」

      をタップしてください。

    </div>

    <div id="horses">
    </div>

  </div>


  <div class="card">

    <label>
      投資額
    </label>

    <input
      id="stake"
      type="number"
      min="0"
      step="100"
      placeholder="例：1000">

  </div>


  <button
    class="btn green full"
    onclick="savePrediction()">

    予想を登録する

  </button>


  <button
    id="editCancel"
    class="btn light full"
    style="display:none;margin-top:8px"
    onclick="cancelEdit()">

    編集をキャンセル

  </button>

</section>


<!-- =========================
     RESULT
========================= -->

<section id="result" class="page">

  <div class="card">

    <h2>
      🏁 結果入力
    </h2>

    <div id="resultList">
    </div>

  </div>

</section>


<!-- =========================
     HISTORY
========================= -->

<section id="history" class="page">

  <div class="card">

    <h2>
      📋 予想履歴
    </h2>

    <div id="historyList">
    </div>

  </div>

</section>


<!-- =========================
     STATS
========================= -->

<section id="stats" class="page">

  <div class="card">

    <h2>
      📊 成績集計
    </h2>

    <div class="statgrid">

      <div class="stat">

        <div class="small">
          総レース
        </div>

        <div
          id="tRaces"
          class="v">
          0
        </div>

      </div>


      <div class="stat">

        <div class="small">
          的中率
        </div>

        <div
          id="tHitRate"
          class="v">
          0.0%
        </div>

      </div>


      <div class="stat">

        <div class="small">
          投資
        </div>

        <div
          id="tStake"
          class="v">
          0円
        </div>

      </div>


      <div class="stat">

        <div class="small">
          回収
        </div>

        <div
          id="tReturn"
          class="v">
          0円
        </div>

      </div>


      <div class="stat">

        <div class="small">
          回収率
        </div>

        <div
          id="tROI"
          class="v">
          0.0%
        </div>

      </div>


      <div class="stat">

        <div class="small">
          収支
        </div>

        <div
          id="tProfit"
          class="v">
          0円
        </div>

      </div>

    </div>

  </div>


  <div class="card">

    <h2>
      📈 累計収支推移
    </h2>

    <canvas id="chart">
    </canvas>

    <div
      id="chartNote"
      class="small center"
      style="margin-top:7px">

      結果入力したレースから自動計算

    </div>

  </div>

</section>


<!-- =========================
     NAV
========================= -->

<nav class="nav">

  <button
    id="nav-home"
    onclick="showPage('home')">

    <strong>
      🏠
    </strong>

    ホーム

  </button>


  <button
    id="nav-predict"
    onclick="showPage('predict')">

    <strong>
      📝
    </strong>

    予想

  </button>


  <button
    id="nav-history"
    onclick="showPage('history')">

    <strong>
      📋
    </strong>

    履歴

  </button>


  <button
    id="nav-stats"
    onclick="showPage('stats')">

    <strong>
      📊
    </strong>

    成績

  </button>

</nav>

</div>


<!-- =========================
     MARK MODAL
========================= -->

<div
  id="markModal"
  class="modal"
  onclick="if(event.target===this)closeMark()">

  <div class="sheet">

    <h2>
      🎯 印を選択
    </h2>

    <div
      id="markChoices"
      class="mark-grid">
    </div>

    <button
      class="btn light full"
      style="margin-top:9px"
      onclick="closeMark()">

      閉じる

    </button>

  </div>

</div>


<!-- =========================
     DETAIL
========================= -->

<div
  id="detailModal"
  class="modal"
  onclick="if(event.target===this)closeDetail()">

  <div class="sheet">

    <div id="detailContent">
    </div>

  </div>

</div>


<!-- =========================
     EVOLUTION
========================= -->

<div
  id="evoModal"
  class="modal">

  <div class="sheet center">

    <div class="evo-text">
      ✨ 進化！ ✨
    </div>

    <div
      id="evoChar"
      class="character-wrap">
    </div>

    <h2 id="evoTitle">
    </h2>

    <div
      id="evoSub"
      class="small">
    </div>

    <button
      class="btn primary full"
      style="margin-top:12px"
      onclick="closeEvo()">

      これからも育てる！

    </button>

  </div>

</div>


<div
  id="toast"
  class="toast">
</div>

/* =====================================
   DATABASE
===================================== */

function freshDatabase(){

  return {

    version:4,

    races:[],

    lastEvolution:1

  };

}


function normalizeRace(r){

  const result =
    r.result || {};

  const horses =
    Array.isArray(r.horses)
      ? r.horses
      : [];


  return {

    id:
      r.id ||
      String(Date.now()+Math.random()),

    date:
      r.date ||
      new Date().toISOString(),

    track:
      r.track ||
      "東京",

    raceNo:
      Number(r.raceNo) ||
      1,

    surface:
      r.surface ||
      "芝",

    distance:
      r.distance ||
      "1600m",

    fieldSize:
      Number(r.fieldSize) ||
      horses.length ||
      8,

    stake:
      Number(r.stake) ||
      0,

    horses:
      horses.map(
        (h,i)=>({

          no:
            Number(h.no) ||
            i+1,

          name:
            String(h.name || ""),

          mark:
            MARKS.includes(h.mark)
              ? h.mark
              : "－"

        })
      ),

    result:{

      first:
        String(result.first || ""),

      second:
        String(result.second || ""),

      third:
        String(result.third || ""),

      returned:
        Number(result.returned) ||
        0,

      done:
        !!result.done

    }

  };

}


function loadDatabase(){

  try{

    const raw =
      localStorage.getItem(STORE)
      ||
      localStorage.getItem(
        "keiba_bokujou_v3"
      );

    if(!raw){

      return freshDatabase();

    }

    const x =
      JSON.parse(raw);

    x.races =
      (x.races || [])
      .map(normalizeRace);

    x.version =
      4;

    x.lastEvolution =
      Number(x.lastEvolution) ||
      1;

    return x;

  }catch(e){

    return freshDatabase();

  }

}


function persist(){

  localStorage.setItem(
    STORE,
    JSON.stringify(db)
  );

}


/* =====================================
   HELPERS
===================================== */

function esc(s){

  return String(s ?? "")
    .replace(
      /[&<>"']/g,
      c=>({

        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"

      }[c])
    );

}


function yen(n){

  return (
    Number(n || 0)
    .toLocaleString("ja-JP")
    + "円"
  );

}


function profit(r){

  if(!r.result.done){

    return 0;

  }

  return (
    Number(r.result.returned || 0)
    -
    Number(r.stake || 0)
  );

}


function hit(r){

  return (
    r.result.done &&
    Number(r.result.returned || 0) > 0
  );

}


function toast(message){

  const el =
    document.getElementById(
      "toast"
    );

  el.textContent =
    message;

  el.classList.add("show");

  setTimeout(
    ()=>{
      el.classList.remove(
        "show"
      );
    },
    1800
  );

}


/* =====================================
   LEVEL / EVOLUTION
===================================== */

function levelInfo(exp){

  const level =
    Math.min(
      50,
      Math.floor(exp / 100)+1
    );


  const stages = [

    [
      1,
      4,
      "赤ちゃん馬",
      "foal"
    ],

    [
      5,
      9,
      "子馬",
      "young"
    ],

    [
      10,
      19,
      "若駒",
      "juvenile"
    ],

    [
      20,
      29,
      "競走馬",
      "racehorse"
    ],

    [
      30,
      39,
      "強豪競走馬",
      "champion"
    ],

    [
      40,
      49,
      "最強競走馬",
      "legend"
    ],

    [
      50,
      50,
      "伝説の競走馬",
      "myth"
    ]

  ];


  const stage =
    stages.find(
      x =>
        level >= x[0] &&
        level <= x[1]
    );


  return {

    level,

    name:
      stage[2],

    stage:
      stage[3],

    current:
      level === 50
        ? 100
        : exp % 100,

    need:
      100

  };

}

/* =====================================
   SELECT
===================================== */

function fillSelect(
  id,
  arr,
  value,
  race=false
){

  const select =
    document.getElementById(id);

  select.innerHTML="";


  arr.forEach(
    item=>{

      select.add(
        new Option(
          race
            ? item+"R"
            : item,
          item
        )
      );

    }
  );


  select.value =
    value;

}


/* =====================================
   DISTANCE
===================================== */

function updateDistance(){

  const surface =
    document
      .getElementById("surface")
      .value;


  let defaultDistance =
    "1600m";


  if(surface==="ダート"){
    defaultDistance =
      "1200m";
  }


  if(surface==="障害"){
    defaultDistance =
      "3000m";
  }


  fillSelect(
    "distance",
    DIST[surface],
    defaultDistance
  );

}

===================================== */

function renderHorses(

/* =====================================
   MARK
===================================== */

function openMark(no){

  markHorse =
    no;


  const box =
    document.getElementById(
      "markChoices"
    );


  box.innerHTML =
    "";


  MARKS.forEach(
    mark=>{

      const button =
        document.createElement(
          "button"
        );


      button.className =
        "mark m-"+mark;


      button.textContent =
        mark==="－"
          ? "－ 無印"
          : mark;


      button.onclick =
        ()=>{
          setMark(mark);
        };


      box.appendChild(
        button
      );

    }
  );


  document
    .getElementById(
      "markModal"
    )
    .classList
    .add("show");

}


function setMark(mark){

  if(markHorse===null){
    return;
  }


  window.marksForm[
    markHorse
  ] =
    mark;


  const button =
    document.querySelector(
      `[onclick="openMark(${markHorse})"]`
    );


  if(button){

    button.textContent =
      mark==="－"
        ? "印を選択"
        : mark;


    button.classList.toggle(
      "set",
      mark!=="－"
    );

  }


  closeMark();


  toast(
    mark==="－"
      ? "無印"
      : "印「"+mark+"」"
  );

}


function closeMark(){

  document
    .getElementById(
      "markModal"
    )
    .classList
    .remove("show");


  markHorse =
    null;

}


/* =====================================
   COLLECT FORM
===================================== */

function collectPrediction(){

  const count =
    Number(
      document
        .getElementById(
          "fieldSize"
        )
        .value
    ) || 8;


  const horses=[];


  for(
    let i=1;
    i<=count;
    i++
  ){

    const input =
      document.querySelector(
        `[data-name="${i}"]`
      );


    horses.push({

      no:i,

      name:
        (
          input?.value ||
          ""
        ).trim(),

      mark:
        window.marksForm[i]
        || "－"

    });

  }


  return {

    track:
      document
        .getElementById(
          "track"
        )
        .value,

    raceNo:
      Number(
        document
          .getElementById(
            "raceNo"
          )
          .value
      ),

    surface:
      document
        .getElementById(
          "surface"
        )
        .value,

    distance:
      document
        .getElementById(
          "distance"
        )
        .value,

    fieldSize:
      count,

    stake:
      Number(
        document
          .getElementById(
            "stake"
          )
          .value
      ) || 0,

    horses

  };

}


/* =====================================
   SAVE PREDICTION
===================================== */

function savePrediction(){

  const form =
    collectPrediction();


  if(
    !form.horses.some(
      h=>h.name
    )
  ){

    toast(
      "馬名を1頭以上入力してください"
    );

    return;

  }


  const oldLevel =
    levelInfo(
      calcExp()
    ).level;


  if(editId){

    const index =
      db.races.findIndex(
        r =>
          String(r.id)
          ===
          String(editId)
      );


    if(index>=0){

      db.races[index] =
        normalizeRace({

          ...db.races[index],

          ...form

        });

    }


    toast(
      "予想を更新しました"
    );


    editId =
      null;


    document
      .getElementById(
        "editCancel"
      )
      .style.display =
      "none";

  }else{

    db.races.unshift(

      normalizeRace({

        ...form,

        id:
          String(
            Date.now()
            +
            Math.random()
          ),

        date:
          new Date()
            .toISOString(),

        result:{

          done:false,

          first:"",

          second:"",

          third:"",

          returned:0

        }

      })

    );


    toast(
      "予想を登録しました"
    );

  }


  persist();

  resetForm();

  refresh();


  const newLevel =
    levelInfo(
      calcExp()
    ).level;


  if(
    newLevel >
    oldLevel
  ){

    showEvolution(
      newLevel
    );

  }


  showPage(
    "history"
  );

}

    );


  if(!race){
    return;
  }


  const oldLevel =
    levelInfo(
      calcExp()
    ).level;


  race.result = {

    first:
      document
        .getElementById(

        .getElementById(
          "res2"

        .value,

        .value,

    returned:
      Number(
        document
          .getElementById(
            "ret"
          )
          .value
      ) || 0,

    done:true

  };


  persist();

  refresh();


  const newLevel =
    levelInfo(
      calcExp()
    ).level;


  toast(
    "結果を保存しました。収支に反映！"
  );


  if(
    newLevel >
    oldLevel
  ){

    showEvolution(
      newLevel
    );

  }

}


/* =====================================
   EXP
===================================== */

function calcExp(){

  let exp=0;


  db.races.forEach(
    race=>{

      /*
        予想登録
      */

      exp += 10;


      if(
        race.result.done
      ){

        /*
          結果入力
        */

        exp += 5;


        /*
          的中
        */

        if(
          hit(race)
        ){

          exp += 20;

        }


        /*
          回収率100%以上
        */

        if(
          Number(
            race.stake
          ) > 0
          &&
          Number(
            race.result.returned
          )
          >=
          Number(
            race.stake
          )
        ){

          exp += 10;

        }

      }

    }
  );


  return exp;

}


/* =====================================
   STATS
===================================== */

function stats(){

  const done =
    db.races.filter(
      r =>
        r.result.done
    );


  const stake =
    db.races.reduce(
      (sum,r)=>
        sum +
        Number(
          r.stake || 0
        ),
      0
    );


  const returned =
    done.reduce(
      (sum,r)=>
        sum +
        Number(
          r.result.returned
          || 0
        ),
      0
    );


  const hits =
    done.filter(
      hit
    ).length;


  return {

    races:
      db.races.length,

    done:
      done.length,

    hits,

    stake,

    returned,

    profit:
      returned -
      stake,

    roi:
      stake
        ? returned / stake * 100
        : 0,

    hitRate:
      done.length
        ? hits / done.length * 100
        : 0

  };

}

/* =====================================
   CHART
===================================== */

function drawChart(){

  const canvas =
    document.getElementById(
      "chart"
    );


  const width =
    Math.max(
      320,
      canvas.clientWidth || 320
    );


  const height =
    190;


  const dpr =
    Math.max(
      1,
      window.devicePixelRatio || 1
    );


  canvas.width =
    width*dpr;


  canvas.height =
    height*dpr;


  const ctx =
    canvas.getContext(
      "2d"
    );


  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );


  ctx.clearRect(
    0,
    0,
    width,
    height
  );


  const values=[];


  let total=0;


  db.races
    .slice()
    .reverse()
    .forEach(
      race=>{

        total +=
          profit(race);

        values.push(
          total
        );

      }
    );


  if(
    !values.length
  ){

    ctx.fillStyle =
      "#667085";

    ctx.font =
      "12px sans-serif";

    ctx.fillText(
      "結果入力したレースが増えるとグラフが表示されます",
      16,
      96
    );

    return;

  }


  const max =
    Math.max(
      1000,
      ...values.map(
        value =>
          Math.abs(value)
      )
    );


  const pad =
    28;


  const middle =
    height/2;


  const top =
    max;


  const bottom =
    -max;


  function y(value){

    return (
      pad
      +
      (
        top-value
      )
      /
      (
        top-bottom
      )
      *
      (
        height-pad*2
      )
    );

  }


  function x(index){

    if(values.length===1){

      return width/2;

    }

    return (
      pad
      +
      index
      *
      (
        width-pad*2
      )
      /
      (
        values.length-1
      )
    );

  }


  /*
    0円ライン
  */

  ctx.strokeStyle =
    "#d0d5dd";

  ctx.lineWidth =
    1;

  ctx.beginPath();

  ctx.moveTo(
    pad,
    middle
  );

  ctx.lineTo(
    width-pad,
    middle
  );

  ctx.stroke();


  /*
    LABEL
  */

  ctx.fillStyle =
    "#667085";

  ctx.font =
    "11px sans-serif";


  ctx.fillText(
    "+"+yen(max),
    4,
    14
  );


  ctx.fillText(
    "0円",
    6,
    middle-4
  );


  ctx.fillText(
    yen(-max),
    4,
    height-4
  );


  /*
    LINE
  */

  ctx.beginPath();


  values.forEach(
    (value,index)=>{

      if(index){

        ctx.lineTo(
          x(index),
          y(value)
        );

      }else{

        ctx.moveTo(
          x(index),
          y(value)
        );

      }

    }
  );


  ctx.strokeStyle =
    "#2563eb";

  ctx.lineWidth =
    2.4;

  ctx.stroke();


  /*
    POINT
  */

  values.forEach(
    (value,index)=>{

      ctx.beginPath();

      ctx.arc(
        x(index),
        y(value),
        3.4,
        0,
        Math.PI*2
      );


      ctx.fillStyle =
        value>=0
          ? "#16a34a"
          : "#dc2626";


      ctx.fill();

    }
  );


  document
    .getElementById(
      "chartNote"
    )
    .textContent =

    `${values.length}レース`

    +

    `｜最終累計 `

    +

    (
      total>=0
        ? "+"
        : ""
    )

    +

    yen(total)

    +

    "｜緑=プラス　赤=マイナス";

}


/* =====================================
   PAGE
===================================== */

function showPage(id){

  document
    .querySelectorAll(
      ".page"
    )
    .forEach(
      el =>
        el.classList
          .remove("active")
    );


  document
    .getElementById(id)
    .classList
    .add("active");


  document
    .querySelectorAll(
      ".nav button"
    )
    .forEach(
      el =>
        el.classList
          .remove("active")
    );


  const nav =
    document.getElementById(
      "nav-"+id
    );


  if(nav){

    nav.classList
      .add("active");

  }


  window.scrollTo({

    top:0,

    behavior:"smooth"

  });


  if(
    id==="stats"
  ){

    setTimeout(
      drawChart,
      50
    );

  }

}
