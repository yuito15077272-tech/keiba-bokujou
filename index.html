<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">

<title>競馬牧場</title>

<style>
:root{
  --bg:#f4f6f8;
  --card:#fff;
  --ink:#172033;
  --muted:#667085;
  --line:#e4e7ec;
  --navy:#0f172a;
  --blue:#2563eb;
  --green:#16a34a;
  --red:#dc2626;
  --gold:#d4a72c;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    Meiryo,
    sans-serif;
}

button,input,select{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  max-width:760px;
  margin:auto;
  padding-bottom:92px;
}

/* =========================
   HEADER
========================= */

header{
  position:sticky;
  top:0;
  z-index:30;
  background:linear-gradient(135deg,#0b1220,#1e293b);
  color:#fff;
  padding:17px 15px 16px;
  box-shadow:0 3px 14px #0003;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.brand-mark{
  width:42px;
  height:42px;
  border-radius:13px;
  background:#ffffff12;
  display:grid;
  place-items:center;
  font-size:25px;
}

.title{
  font-size:23px;
  font-weight:950;
  letter-spacing:.03em;
}

.subtitle{
  font-size:11px;
  color:#cbd5e1;
  margin-top:2px;
}

/* =========================
   PAGE
========================= */

.page{
  display:none;
  padding:14px;
}

.page.active{
  display:block;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:17px;
  padding:15px;
  margin-bottom:12px;
  box-shadow:0 2px 10px #1018280a;
}

h2{
  font-size:18px;
  margin:0 0 12px;
  font-weight:950;
}

h3{
  font-size:15px;
  margin:0 0 9px;
}

label{
  display:block;
  font-size:12px;
  font-weight:900;
  color:var(--muted);
  margin-bottom:6px;
}

input,select{
  width:100%;
  height:46px;
  border:1px solid #d0d5dd;
  border-radius:11px;
  background:#fff;
  color:var(--ink);
  padding:0 12px;
  outline:none;
}

input:focus,
select:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 3px #2563eb18;
}

.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.btn{
  border:0;
  border-radius:11px;
  min-height:44px;
  padding:10px 13px;
  font-weight:950;
}

.btn:active{
  transform:scale(.985);
}

.primary{
  background:var(--navy);
  color:#fff;
}

.green{
  background:var(--green);
  color:#fff;
}

.red{
  background:var(--red);
  color:#fff;
}

.light{
  background:#eef2f6;
  color:var(--ink);
}

.gold{
  background:#f4d66d;
  color:#3b2b00;
}

.full{
  width:100%;
}

.small{
  font-size:12px;
  color:var(--muted);
}

.center{
  text-align:center;
}

.plus{
  color:var(--green)!important;
}

.minus{
  color:var(--red)!important;
}

/* =========================
   CHARACTER
========================= */

.character-wrap{
  height:270px;
  border-radius:15px;
  background:
    linear-gradient(
      #dff3ff 0%,
      #e8f7dc 65%,
      #c9e6b6 65%
    );
  position:relative;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  overflow:hidden;
  margin-bottom:11px;
}

.character-wrap:after{
  content:"";
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  height:55px;
  background:repeating-linear-gradient(
    155deg,
    #8fc17d 0 7px,
    #a9d494 7px 14px
  );
  opacity:.75;
}

.character-svg{
  position:relative;
  z-index:2;
  width:94%;
  height:255px;
  filter:drop-shadow(0 8px 5px #0002);
}

.levelline{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
}

.level{
  font-size:21px;
  font-weight:950;
}

.pill{
  border-radius:999px;
  padding:5px 9px;
  font-size:11px;
  font-weight:950;
  background:#eef2f6;
}

.expbar{
  height:11px;
  border-radius:99px;
  background:#e5e7eb;
  overflow:hidden;
  margin:8px 0;
}

.expfill{
  height:100%;
  width:0;
  background:linear-gradient(90deg,#22c55e,#a3e635);
  transition:width .5s;
}

/* =========================
   STATS
========================= */

.statgrid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
}

.stat{
  background:#f8fafc;
  border:1px solid var(--line);
  border-radius:12px;
  padding:10px;
}

.stat .v{
  font-size:20px;
  font-weight:950;
  margin-top:3px;
}

/* =========================
   HORSE INPUT
========================= */

.horse{
  border:1px solid var(--line);
  border-radius:14px;
  padding:11px;
  margin:9px 0;
  background:#fff;
}

.horse-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:9px;
}

.horse-title{
  font-weight:950;
}

.horse-actions{
  display:flex;
  gap:6px;
}

.mini-btn{
  border:0;
  border-radius:9px;
  padding:7px 9px;
  font-size:11px;
  font-weight:950;
}

.remove-btn{
  background:#fee2e2;
  color:#991b1b;
}

.horse-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.horse-field{
  min-width:0;
}

.horse-name-input{
  margin-top:7px;
}

/* =========================
   FRAME / NUMBER PICKER
========================= */

.pick-label{
  font-size:11px;
  color:var(--muted);
  font-weight:900;
  margin-bottom:6px;
}

.frame-picker{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
}

.frame-btn{
  min-height:38px;
  border:2px solid transparent;
  border-radius:9px;
  font-weight:950;
  color:#111;
  box-shadow:0 1px 3px #0001;
}

.frame-btn.selected{
  border-color:#111827;
  box-shadow:0 0 0 2px #fff,0 0 0 4px #111827;
  transform:scale(1.02);
}

/* 枠色 */

.frame1{
  background:#fff;
  border-color:#d1d5db;
}

.frame2{
  background:#111827;
  color:#fff;
}

.frame3{
  background:#ef4444;
  color:#fff;
}

.frame4{
  background:#3b82f6;
  color:#fff;
}

.frame5{
  background:#facc15;
}

.frame6{
  background:#22c55e;
  color:#fff;
}

.frame7{
  background:#f97316;
  color:#fff;
}

.frame8{
  background:#f9a8d4;
  color:#831843;
}

/* 馬番 */

.number-picker{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:5px;
}

.number-btn{
  border:1px solid #d0d5dd;
  background:#f8fafc;
  border-radius:8px;
  min-height:34px;
  font-weight:900;
}

.number-btn.selected{
  background:#111827;
  color:#fff;
  border-color:#111827;
}

/* =========================
   MARK
========================= */

.mark-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
}

.mark{
  border:0;
  border-radius:11px;
  padding:12px 10px;
  font-weight:950;
  font-size:16px;
}

.m-◎{
  background:#fee2e2;
  color:#b91c1c;
}

.m-○{
  background:#dbeafe;
  color:#1d4ed8;
}

.m-▲{
  background:#fef3c7;
  color:#92400e;
}

.m-☆{
  background:#fce7f3;
  color:#be185d;
}

.m-△{
  background:#dcfce7;
  color:#166534;
}

.m-消{
  background:#e5e7eb;
  color:#374151;
}

.m-－{
  background:#f3f4f6;
  color:#6b7280;
}

/* =========================
   ADD HORSE
========================= */

.add-horse{
  width:100%;
  border:2px dashed #cbd5e1;
  background:#f8fafc;
  color:#334155;
  border-radius:13px;
  min-height:48px;
  font-weight:950;
  margin-top:8px;
}

.add-horse:active{
  transform:scale(.985);
}

/* =========================
   RACE
========================= */

.raceitem{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  border:1px solid var(--line);
  border-radius:13px;
  padding:12px;
  margin:8px 0;
  background:#fff;
}

.meta{
  font-size:12px;
  color:var(--muted);
  margin-top:3px;
}

.badge{
  border-radius:999px;
  padding:5px 9px;
  font-size:11px;
  font-weight:950;
  background:#eef2f6;
}

.badge.ok{
  background:#dcfce7;
  color:#166534;
}

.badge.ng{
  background:#fee2e2;
  color:#991b1b;
}

.sheet-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

canvas{
  width:100%;
  height:190px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#fff;
}

/* =========================
   RESULT
========================= */

.result-status{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.result-status button{
  border:2px solid #d0d5dd;
  background:#f8fafc;
  border-radius:11px;
  min-height:48px;
  font-weight:950;
}

.result-status button.selected-hit{
  background:#dcfce7;
  color:#166534;
  border-color:#16a34a;
}

.result-status button.selected-miss{
  background:#fee2e2;
  color:#991b1b;
  border-color:#dc2626;
}

.result-position{
  background:#f8fafc;
  border:1px solid var(--line);
  border-radius:13px;
  padding:11px;
  margin-top:9px;
}

.result-position-title{
  font-size:14px;
  font-weight:950;
  margin-bottom:8px;
}

/* =========================
   FILTER
========================= */

.filter-tabs{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:7px;
}

.filter-btn{
  border:1px solid #d0d5dd;
  background:#f8fafc;
  border-radius:10px;
  min-height:40px;
  font-weight:900;
}

.filter-btn.active{
  background:#111827;
  color:#fff;
  border-color:#111827;
}

.detail-section{
  margin-top:12px;
}

.detail-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:9px 0;
  border-bottom:1px solid var(--line);
  font-size:13px;
}

.detail-row:last-child{
  border-bottom:0;
}

/* =========================
   NAV
========================= */

.nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:40;
  background:#fff;
  border-top:1px solid var(--line);
  display:grid;
  grid-template-columns:repeat(4,1fr);
  padding-bottom:env(safe-area-inset-bottom);
}

.nav button{
  border:0;
  background:#fff;
  color:#667085;
  padding:9px 3px 8px;
  font-size:11px;
  font-weight:900;
}

.nav button strong{
  display:block;
  font-size:20px;
  line-height:21px;
}

.nav button.active{
  color:#111827;
}

/* =========================
   MODAL
========================= */

.modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:60;
  background:#0008;
  align-items:flex-end;
}

.modal.show{
  display:flex;
}

.sheet{
  width:100%;
  max-width:760px;
  margin:auto;
  background:#fff;
  border-radius:20px 20px 0 0;
  padding:16px;
  max-height:90vh;
  overflow:auto;
}

.toast{
  position:fixed;
  left:50%;
  bottom:78px;
  z-index:90;
  transform:translate(-50%,20px);
  opacity:0;
  background:#111827;
  color:#fff;
  padding:11px 16px;
  border-radius:12px;
  font-weight:900;
  pointer-events:none;
  transition:.25s;
  white-space:nowrap;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

.evo{
  animation:evo .7s ease;
}

.evo-text{
  text-align:center;
  font-size:23px;
  font-weight:950;
  color:#b45309;
  margin:4px 0 10px;
}

@keyframes evo{
  0%{
    transform:scale(.55);
    opacity:0;
  }
  60%{
    transform:scale(1.08);
  }
  100%{
    transform:scale(1);
    opacity:1;
  }
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:26px 8px;
}

.divider{
  height:1px;
  background:var(--line);
  margin:12px 0;
}

.exp-bonus{
  margin-top:8px;
  padding:9px;
  border-radius:10px;
  background:#f0fdf4;
  color:#166534;
  font-weight:900;
}

@media(min-width:700px){

  .nav{
    position:static;
    max-width:760px;
    margin:auto;
    border:1px solid var(--line);
    border-radius:15px;
  }

  .app{
    padding-bottom:20px;
  }

  .toast{
    bottom:20px;
  }
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="brand">
    <div class="brand-mark">🏇</div>
    <div>
      <div class="title">競馬牧場</div>
      <div class="subtitle">予想するほど、あなたの馬が強くなる。</div>
    </div>
  </div>
</header>

<!-- =========================
     HOME
========================= -->

<section id="home" class="page active">

  <div class="card">

    <div id="characterBox" class="character-wrap"></div>

    <div class="levelline">

      <div id="level" class="level">
        Lv.1 赤ちゃん馬
      </div>

      <div id="rank" class="pill">
        赤ちゃん馬
      </div>

    </div>

    <div class="small" id="expText">
      EXP 0 / 100
    </div>

    <div class="expbar">
      <div id="expFill" class="expfill"></div>
    </div>

    <div class="small">
      次の進化まであと
      <b id="nextText">100 EXP</b>
    </div>

  </div>

  <div class="card">

    <h2>📊 現在の成績</h2>

    <div class="statgrid">

      <div class="stat">
        <div class="small">総レース</div>
        <div id="sRaces" class="v">0</div>
      </div>

      <div class="stat">
        <div class="small">的中</div>
        <div id="sHits" class="v">0</div>
      </div>

      <div class="stat">
        <div class="small">回収率</div>
        <div id="sROI" class="v">0.0%</div>
      </div>

      <div class="stat">
        <div class="small">累計収支</div>
        <div id="sProfit" class="v">0円</div>
      </div>

    </div>

  </div>

  <button
    class="btn primary full"
    onclick="showPage('predict')">
    🏇 予想をはじめる
  </button>

  <div class="card" style="margin-top:12px">

    <h2>🌱 育成状況</h2>

    <div id="growthInfo" class="small"></div>

  </div>

</section>

<!-- =========================
     PREDICT
========================= -->

<section id="predict" class="page">

  <div class="card">

    <h2>📝 予想を登録</h2>

    <div class="grid2">

      <div>
        <label>競馬場</label>
        <select id="track"></select>
      </div>

      <div>
        <label>レース</label>
        <select id="raceNo"></select>
      </div>

    </div>

    <div class="grid2" style="margin-top:10px">

      <div>
        <label>芝・ダート・障害</label>
        <select id="surface"></select>
      </div>

      <div>
        <label>距離</label>
        <select id="distance"></select>
      </div>

    </div>

    <div style="margin-top:10px">

      <label>頭数</label>
      <select id="fieldSize"></select>

    </div>

  </div>

  <div class="card">

    <h2>🐴 出走馬</h2>

    <div class="small">
      最初は1頭だけ表示されます。<br>
      必要な馬だけ「＋ 馬を追加」で増やしてください。
    </div>

    <div id="horses"></div>

    <button
      id="addHorseBtn"
      class="add-horse"
      onclick="addHorse()">
      ＋ 馬を追加
    </button>

  </div>

  <div class="card">

    <label>投資額</label>

    <input
      id="stake"
      type="number"
      min="0"
      step="100"
      placeholder="例：1000">

  </div>

  <button
    class="btn green full"
    onclick="savePrediction()">
    予想を登録する
  </button>

  <button
    id="editCancel"
    class="btn light full"
    style="display:none;margin-top:8px"
    onclick="cancelEdit()">
    編集をキャンセル
  </button>

</section>

<!-- =========================
     RESULT
========================= -->

<section id="result" class="page">

  <div class="card">

    <h2>🏁 結果入力</h2>

    <div id="resultList"></div>

  </div>

</section>

<!-- =========================
     HISTORY
========================= -->

<section id="history" class="page">

  <div class="card">

    <h2>📋 予想履歴</h2>

    <div id="historyList"></div>

  </div>

</section>

<!-- =========================
     STATS
========================= -->

<section id="stats" class="page">

  <div class="card">

    <h2>📊 成績集計</h2>

    <div class="statgrid">

      <div class="stat">
        <div class="small">総レース</div>
        <div id="tRaces" class="v">0</div>
      </div>

      <div class="stat">
        <div class="small">的中率</div>
        <div id="tHitRate" class="v">0.0%</div>
      </div>

      <div class="stat">
        <div class="small">投資</div>
        <div id="tStake" class="v">0円</div>
      </div>

      <div class="stat">
        <div class="small">回収</div>
        <div id="tReturn" class="v">0円</div>
      </div>

      <div class="stat">
        <div class="small">回収率</div>
        <div id="tROI" class="v">0.0%</div>
      </div>

      <div class="stat">
        <div class="small">収支</div>
        <div id="tProfit" class="v">0円</div>
      </div>

    </div>

  </div>

  <!-- 詳細成績 -->

  <div class="card">

    <h2>🔎 詳細成績</h2>

    <div class="filter-tabs">

      <button
        id="filterTrack"
        class="filter-btn active"
        onclick="showStatDetail('track')">
        🏟 競馬場別
      </button>

      <button
        id="filterSurface"
        class="filter-btn"
        onclick="showStatDetail('surface')">
        🌱 芝・ダート・障害
      </button>

      <button
        id="filterDistance"
        class="filter-btn"
        onclick="showStatDetail('distance')">
        📏 距離別
      </button>

      <button
        id="filterRaceNo"
        class="filter-btn"
        onclick="showStatDetail('raceNo')">
        🔢 レース別
      </button>

    </div>

    <div id="detailStats" style="margin-top:10px"></div>

  </div>

  <div class="card">

    <h2>📈 累計収支推移</h2>

    <canvas id="chart"></canvas>

    <div
      id="chartNote"
      class="small center"
      style="margin-top:7px">
      結果入力したレースから自動計算
    </div>

  </div>

</section>

<!-- =========================
     NAV
========================= -->

<nav class="nav">

  <button id="nav-home" onclick="showPage('home')">
    <strong>🏠</strong>
    ホーム
  </button>

  <button id="nav-predict" onclick="showPage('predict')">
    <strong>📝</strong>
    予想
  </button>

  <button id="nav-history" onclick="showPage('history')">
    <strong>📋</strong>
    履歴
  </button>

  <button id="nav-stats" onclick="showPage('stats')">
    <strong>📊</strong>
    成績
  </button>

</nav>

</div>

<!-- =========================
     MARK MODAL
========================= -->

<div
  id="markModal"
  class="modal"
  onclick="if(event.target===this)closeMark()">

  <div class="sheet">

    <h2>🎯 印を選択</h2>

    <div id="markChoices" class="mark-grid"></div>

    <button
      class="btn light full"
      style="margin-top:9px"
      onclick="closeMark()">
      閉じる
    </button>

  </div>

</div>

<!-- =========================
     DETAIL MODAL
========================= -->

<div

function freshDatabase(){

  return{
    version:6,
    races:[],
    lastEvolution:1
  };

}

function normalizeHorse(h,i){

  return{
    frame:Number(h?.frame)||0,
    no:Number(h?.no)||i+1,
    name:String(h?.name||""),
    mark:MARKS.includes(h?.mark)
      ?h.mark
      :"－"
  };

}

function normalizeRace(r){

  const result=r.result||{};

  const horses=Array.isArray(r.horses)
    ?r.horses
    :[];

  return{

    id:r.id||
      String(Date.now()+Math.random()),

    date:r.date||
      new Date().toISOString(),

    track:r.track||"東京",

    raceNo:Number(r.raceNo)||1,

    surface:r.surface||"芝",

    distance:r.distance||"1600m",

    fieldSize:Number(r.fieldSize)||
      Math.max(5,horses.length)||8,

    stake:Number(r.stake)||0,

    horses:horses.map(
      (h,i)=>normalizeHorse(h,i)
    ),

    result:{

      first:String(result.first||""),

      second:String(result.second||""),

      third:String(result.third||""),

      returned:Number(result.returned)||0,

      done:!!result.done,

      hitStatus:
        result.hitStatus==="hit"||
        result.hitStatus==="miss"
          ?result.hitStatus
          :""

    }

  };

}

function loadDatabase(){

  try{

    const raw=
      localStorage.getItem(STORE)||
      localStorage.getItem("keiba_bokujou_v5")||
      localStorage.getItem("keiba_bokujou_v4")||
      localStorage.getItem("keiba_bokujou_v3");

    if(!raw)
      return freshDatabase();

    const x=JSON.parse(raw);

    x.races=(x.races||[])
      .map(normalizeRace);

    x.version=6;

    x.lastEvolution=
      Number(x.lastEvolution)||1;

    return x;

  }catch(e){

    console.error(e);

    return freshDatabase();

  }

}

function persist(){

  localStorage.setItem(
    STORE,
    JSON.stringify(db)
  );

}

/* =========================
   HELPERS
========================= */

function esc(s){

  return String(s??"").replace(
    /[&<>"']/g,
    c=>({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[c])
  );

}

function yen(n){

  return Number(n||0)
    .toLocaleString("ja-JP")+"円";

}

function profit(r){

  if(!r.result.done)
    return 0;

  return Number(r.result.returned||0)
    -Number(r.stake||0);

}

function hit(r){

  if(!r.result.done)
    return false;

  if(r.result.hitStatus==="hit")
    return true;

  if(r.result.hitStatus==="miss")
    return false;

  const top3=[
    String(r.result.first||""),
    String(r.result.second||""),
    String(r.result.third||"")
  ];

  return r.horses.some(
    h=>
      h.mark!=="－" &&
      top3.includes(String(h.no))
  );

}

function toast(message){

  const el=document.getElementById("toast");

  el.textContent=message;

  el.classList.add("show");

  setTimeout(
    ()=>el.classList.remove("show"),
    1800
  );

}

/* =========================

function levelInfo(exp){

  const level=Math.min(
    50,
    Math.floor(exp/100)+1
  );

  let name;
  let stage;

  if(level<=4){
    name="赤ちゃん馬";
    stage="foal";
  }
  else if(level<=9){
    name="子馬";
    stage="young";
  }
  else if(level<=14){
    name="若駒";
    stage="juvenile";
  }
  else if(level<=19){
    name="成長馬";
    stage="grown";
  }
  else if(level<=24){
    name="競走馬";
    stage="racehorse";
  }
  else if(level<=29){
    name="強豪競走馬";
    stage="strong";
  }
  else if(level<=34){
    name="重賞級";
    stage="graded";
  }
  else if(level<=39){
    name="チャンピオン";
    stage="champion";
  }
  else if(level<=44){
    name="最強馬";
    stage="elite";
  }
  else if(level<=49){
    name="王者";
    stage="king";
  }
  else{
    name="伝説の競走馬";
    stage="legend";
  }

  return{
    level,
    name,
    stage,
    current:
      level===50
        ?100
        :exp%100,
    need:100
  };

}

/* =========================

========================= */

function fillSelect(
  id,
  arr,
  value,
  type=""
){

  const select=
    document.getElementById(id);

  if(!select)return;

  select.innerHTML="";

  arr.forEach(item=>{

    let text=item;

    if(type==="R")
      text=item+"R";

    if(type==="頭")
      text=item+"頭";

    select.add(
      new Option(text,item)
    );

  });

  select.value=value;

}

/* =========================
   INIT
========================= */

function init(){

  fillSelect(
    "track",
    TRACKS,
    "東京"
  );

  /*
   * レースは必ず1R〜12R
   */
  fillSelect(
    "raceNo",
    Array.from(
      {length:12},
      (_,i)=>i+1
    ),
    1,
    "R"
  );

  fillSelect(
    "surface",
    SURFACES,
    "芝"
  );

  /*
   * 頭数は5頭〜18頭
   */
  fillSelect(
    "fieldSize",
    Array.from(
      {length:14},
      (_,i)=>i+5
    ),
    8,
    "頭"
  );

  document.getElementById(
    "surface"
  ).onchange=updateDistance;

  document.getElementById(
    "fieldSize"
  ).onchange=fieldSizeChanged;

  updateDistance();

  resetHorseForm();

  refresh();

  showPage("home");

}

/* =========================
   DISTANCE
========================= */

function updateDistance(){

  const surface=
    document.getElementById(
      "surface"
    ).value;

  let defaultDistance="1600m";

  if(surface==="ダート")
    defaultDistance="1200m";

  if(surface==="障害")
    defaultDistance="3000m";

  fillSelect(
    "distance",
    DIST[surface],
    defaultDistance
  );

}

/* =========================
   HORSE FORM
========================= */

function resetHorseForm(){

  horsesForm=[
    {
      frame:1,
      no:1,
      name:"",
      mark:"－"
    }
  ];

  renderHorseForm();

}

function fieldSizeChanged(){

  const max=
    Number(
      document.getElementById(
        "fieldSize"
      ).value
    )||8;

  if(horsesForm.length>max){

    horsesForm=
      horsesForm.slice(0,max);

  }

  renderHorseForm();

}

function addHorse(){

  const max=
    Number(
      document.getElementById(
        "fieldSize"
      ).value
    )||8;

  if(horsesForm.length>=max){

    toast(
      `最大${max}頭まで登録できます`
    );

    return;
  }

  const usedNumbers=
    horsesForm.map(
      h=>Number(h.no)
    );

  let nextNo=1;

  while(
    usedNumbers.includes(nextNo) &&
    nextNo<=18
  ){
    nextNo++;
  }

  horsesForm.push({

    frame:1,

    no:nextNo,

    name:"",

    mark:"－"

  });

  renderHorseForm();

  setTimeout(()=>{

    const cards=
      document.querySelectorAll(
        "#horses .horse"
      );

    cards[cards.length-1]
      ?.scrollIntoView({
        behavior:"smooth",
        block:"center"
      });

  },50);

}

function removeHorse(index){

  if(horsesForm.length<=1){

    toast("最低1頭は必要です");

    return;
  }

  horsesForm.splice(index,1);

  renderHorseForm();

}

function renderHorseForm(){

  const container=
    document.getElementById(
      "horses"
    );

  if(!container)return;

  container.innerHTML=
    horsesForm.map(
      (h,index)=>horseCardHTML(
        h,
        index,
        false
      )
    ).join("");

  updateAddButton();

}

function updateAddButton(){

  const btn=
    document.getElementById(
      "addHorseBtn"
    );

  if(!btn)return;

  const max=
    Number(
      document.getElementById(
        "fieldSize"
      ).value
    )||8;

  const current=
    horsesForm.length;

  btn.textContent=
    current>=max
      ?`登録上限 ${max}頭`
      :"＋ 馬を追加";

  btn.disabled=
    current>=max;

  btn.style.opacity=
    current>=max?.55:1;

}

function horseCardHTML(
  h,
  index,
  resultMode
){

  const frame=
    Number(h.frame)||1;

  const no=
    Number(h.no)||1;

  const frameButtons=
    Array.from(
      {length:8},
      (_,i)=>{

        const n=i+1;

        return`

          <button
            type="button"
            class="frame-btn frame${n} ${
              frame===n?"selected":""
            }"
            onclick="${
              resultMode
                ?`setResultFrame('${index}',${n})`
                :`setHorseFrame(${index},${n})`
            }">

            ${n}枠

          </button>

        `;

      }
    ).join("");

  const numberButtons=
    Array.from(
      {length:18},
      (_,i)=>{

        const n=i+1;

        return`

          <button
            type="button"
            class="number-btn ${
              no===n?"selected":""
            }"
            onclick="${
              resultMode
                ?`setResultNumber('${index}',${n})`
                :`setHorseNumber(${index},${n})`
            }">

            ${n}

          </button>

        `;

      }
    ).join("");

  return`

    <div class="horse">

      <div class="horse-head">

        <div class="horse-title">
          🐴 馬 ${index+1}
        </div>

        ${
          resultMode
            ?""
            :`

              <div class="horse-actions">

                <button
                  type="button"
                  class="mini-btn remove-btn"
                  onclick="removeHorse(${index})">

                  − 削除

                </button>

              </div>

            `
        }

      </div>

      <div class="pick-label">
        枠番をタップ
      </div>

      <div class="frame-picker">
        ${frameButtons}
      </div>

      <div style="margin-top:9px">

        <div class="pick-label">
          馬番をタップ
        </div>

        <div class="number-picker">
          ${numberButtons}
        </div>

      </div>

      <div class="horse-name-input">

        <label>
          馬名
        </label>

        <input
          type="text"
          value="${esc(h.name||"")}"
          placeholder="馬名を入力"
          oninput="${
            resultMode
              ?`setResultName('${index}',this.value)`
              :`setHorseName(${index},this.value)`
          }">

      </div>

      ${
        resultMode
          ?""
          :`

            <button
              type="button"
              class="mark-btn"
              style="
                width:100%;
                margin-top:8px;
              "
              onclick="openMark(${index})">

              ${
                h.mark==="－"
                  ?"🎯 印を選択"
                  :"印「"+h.mark+"」"
              }

            </button>

          `
      }

    </div>

  `;

}

/* =========================
   HORSE FORM EVENTS
========================= */

function setHorseFrame(
  index,
  frame
){

  horsesForm[index].frame=frame;

  renderHorseForm();

}

function setHorseNumber(
  index,
  no
){

  const duplicate=
    horsesForm.some(
      (h,i)=>
        i!==index &&
        Number(h.no)===no
    );

  if(duplicate){

    toast(
      `${no}番はすでに選択されています`
    );

    return;
  }

  horsesForm[index].no=no;

  renderHorseForm();

}

function setHorseName(
  index,
  name
){

  if(horsesForm[index])
    horsesForm[index].name=name;

}

function openMark(index){

  markHorse=index;

  const box=
    document.getElementById(
      "markChoices"
    );

  box.innerHTML="";

  MARKS.forEach(mark=>{

    const button=
      document.createElement(
        "button"
      );

    button.className=
      "mark m-"+mark;

    button.textContent=
      mark==="－"
        ?"－ 無印"
        :mark;

    button.onclick=()=>{

      horsesForm[
        markHorse
      ].mark=mark;

      renderHorseForm();

      closeMark();

      toast(
        mark==="－"
          ?"無印"
          :"印「"+mark+"」"
      );

    };

    box.appendChild(button);

  });

  document.getElementById(
    "markModal"
  ).classList.add("show");

}

function closeMark(){

  document.getElementById(
    "markModal"
  ).classList.remove("show");

  markHorse=null;

}

/* =========================
   COLLECT
========================= */

function collectPrediction(){

  const count=
    Number(
      document.getElementById(
        "fieldSize"
      ).value
    )||8;

  return{

    track:
      document.getElementById(
        "track"
      ).value,

    raceNo:
      Number(
        document.getElementById(
          "raceNo"
        ).value
      ),

    surface:
      document.getElementById(
        "surface"
      ).value,

    distance:
      document.getElementById(
        "distance"
      ).value,

    fieldSize:count,

    stake:
      Number(
        document.getElementById(
          "stake"
        ).value
      )||0,

    horses:
      horsesForm.map(
        (h,i)=>({
          frame:Number(h.frame)||1,
          no:Number(h.no)||i+1,
          name:String(h.name||"").trim(),
          mark:MARKS.includes(h.mark)
            ?h.mark
            :"－"
        })
      )

  };

}

/* =========================
   SAVE PREDICTION
========================= */

function savePrediction(){

  const form=
    collectPrediction();

  if(!form.horses.some(
    h=>h.name
  )){

    toast(
      "馬名を1頭以上入力してください"
    );

    return;
  }

  const numbers=
    form.horses.map(
      h=>h.no
    );

  if(new Set(numbers).size!==numbers.length){

    toast(
      "馬番が重複しています"
    );

    return;
  }

  if(editId){

    const index=
      db.races.findIndex(
        r=>
          String(r.id)===
          String(editId)
      );

    if(index>=0){

      db.races[index]=
        normalizeRace({

          ...db.races[index],

          ...form

        });

    }

    toast(
      "予想を更新しました"
    );

    editId=null;

    document.getElementById(
      "editCancel"
    ).style.display="none";

  }else{

    db.races.unshift(
      normalizeRace({

        ...form,

        id:
          String(
            Date.now()+Math.random()
          ),

        date:
          new Date().toISOString(),

        result:{

          done:false,

          first:"",

          second:"",

          third:"",

          returned:0,

          hitStatus:""

        }

      })
    );

    toast(
      "予想を登録しました"
    );

  }

  persist();

  resetForm();

  refresh();

  showPage("history");

}

function setResultStatus(status){

  resultStatus=status;

  const race=
    db.races.find(
      r=>
        String(r.id)===
        String(resultEditId)
    );

  if(race)
    renderResultEditor(race);

}

function setResultFrame(
  key,
  frame
){

  resultPositions[key].frame=
    frame;

  const race=
    db.races.find(
      r=>
        String(r.id)===
        String(resultEditId)
    );

  if(race)
    renderResultEditor(race);

}

function setResultNumber(
  key,
  no
){

  const otherKeys=
    ["first","second","third"]
      .filter(k=>k!==key);

  const duplicate=
    otherKeys.some(
      k=>
        String(
          resultPositions[k].no
        )===String(no)
    );

  if(duplicate){

    toast(
      `${no}番は別の着順で選択されています`
    );

    return;
  }

  resultPositions[key].no=no;

  /*
   * 登録馬なら自動で枠番・馬名を補完
   */

  const race=
    db.races.find(
      r=>
        String(r.id)===
        String(resultEditId)
    );

  if(race){

    const horse=
      race.horses.find(
        h=>
          Number(h.no)===Number(no)
      );

    if(horse){

      resultPositions[key].frame=
        horse.frame;

      if(!resultPositions[key].name)
        resultPositions[key].name=
          horse.name||"";

    }

  }

  if(race)
    renderResultEditor(race);

}

function setResultName(
  key,
  name
){

  resultPositions[key].name=
    name;

}

   SAVE RESULT
========================= */

function saveResult(){

  const race=
    db.races.find(
      r=>
        String(r.id)===
        String(resultEditId)
    );

  if(!race)return;

  if(!resultStatus){

    toast(
      "的中・不的中を選択してください"
    );

    return;
  }

  const oldLevel=
    levelInfo(
      calcExp()
    ).level;

  race.result={

    first:
      String(
        resultPositions.first.no||""
      ),

    second:
      String(
        resultPositions.second.no||""
      ),

    third:
      String(
        resultPositions.third.no||""
      ),

    returned:
      Number(
        document.getElementById(
          "resultReturn"
        ).value
      )||0,

    done:true,

    hitStatus:
      resultStatus

  };

  /*
   * 結果で入力された馬が
   * 予想に登録されていれば
   * 枠番・馬名も更新しておく
   */

  [
    ["first",resultPositions.first],
    ["second",resultPositions.second],
    ["third",resultPositions.third]
  ].forEach(
    ([key,pos])=>{

      const horse=
        race.horses.find(
          h=>
            Number(h.no)===
            Number(pos.no)
        );

      if(horse){

        if(pos.frame)
          horse.frame=
            Number(pos.frame);

        if(pos.name)
          horse.name=
            pos.name;

      }

    }
  );

  persist();

  closeResultEdit();

  refresh();

  const newLevel=
    levelInfo(
      calcExp()
    ).level;

  const bonus=
    getRaceExp(race);

  toast(
    `結果保存！ +${bonus} EXP`
  );

  if(newLevel>oldLevel){

    setTimeout(
      ()=>showEvolution(newLevel),
      300
    );

  }

}

/* =========================
   EXP
========================= */

function getRaceExp(race){

  if(!race.result.done)
    return 0;

  let exp=15;

  if(hit(race))
    exp+=35;

  const stake=
    Number(race.stake||0);

  const returned=
    Number(
      race.result.returned||0
    );

  if(stake>0){

    const roi=
      returned/stake*100;

    if(roi>=100)
      exp+=15;

    if(roi>=150)
      exp+=15;

    if(roi>=200)
      exp+=20;

    const win=Math.max(
      0,
      returned-stake
    );

    if(win>=1000)
      exp+=5;

    if(win>=3000)
      exp+=10;

    if(win>=5000)
      exp+=15;

    if(win>=10000)
      exp+=25;

    if(win>=30000)
      exp+=40;

    if(win>=50000)
      exp+=60;

  }

  return exp;

}

function calcExp(){

  let exp=0;

  db.races.forEach(
    race=>{

      /*
       * 予想登録EXP
       */
      exp+=10;

      /*
       * 結果EXP
       */
      if(race.result.done)
        exp+=getRaceExp(race);

    }
  );

  return exp;

}

/* =========================
   STATS
========================= */

function stats(){

  const done=
    db.races.filter(
      r=>r.result.done
    );

  const stake=
    db.races.reduce(
      (sum,r)=>
        sum+Number(r.stake||0),
      0
    );

  const returned=
    done.reduce(
      (sum,r)=>
        sum+
        Number(
          r.result.returned||0
        ),
      0
    );

  const hits=
    done.filter(hit).length;

  return{

    races:
      db.races.length,

    done:
      done.length,

    hits,

    stake,

    returned,

    profit:
      returned-stake,

    roi:
      stake
        ?returned/stake*100
        :0,

    hitRate:
      done.length
        ?hits/done.length*100
        :0

  };

}

/* =========================
   DETAIL STATS
========================= */

function getGroupStats(
  key
){

  const groups={};

  db.races.forEach(
    race=>{

      let group="";

      if(key==="track")
        group=race.track;

      if(key==="surface")
        group=race.surface;

      if(key==="distance")
        group=race.distance;

      if(key==="raceNo")
        group=race.raceNo+"R";

      if(!group)return;

      if(!groups[group]){

        groups[group]={
          races:0,
          done:0,
          hits:0,
          stake:0,
          returned:0
        };

      }

      groups[group].races++;

      groups[group].stake+=
        Number(race.stake||0);

      if(race.result.done){

        groups[group].done++;

        if(hit(race))
          groups[group].hits++;

        groups[group].returned+=
          Number(
            race.result.returned||0
          );

      }

    }
  );

  return Object.entries(groups)
    .map(
      ([name,s])=>({

        name,

        ...s,

        profit:
          s.returned-s.stake,

        roi:
          s.stake
            ?s.returned/s.stake*100
            :0,

        hitRate:
          s.done
            ?s.hits/s.done*100
            :0

      })
    );

}

        ${race.result.third||"—"}番

        <br><br>

        判定：
        <b>
          ${
            hit(race)
              ?"🎯 的中"
              :"✕ 不的中"
          }
        </b>

        <br>

        払戻
        ${yen(race.result.returned)}

        <br>

        収支

        <b class="${
          profit(race)>=0
            ?"plus"
            :"minus"
        }">

          ${profit(race)>=0?"+":""}
          ${yen(profit(race))}

        </b>

      `
      :"結果未入力";

  document.getElementById(
    "detailContent"
  ).innerHTML=`

    <h2>
      🏇
      ${esc(race.track)}
      ${race.raceNo}R
    </h2>

    <div class="small">

      ${race.date.slice(0,10)}
      ｜
      ${esc(race.surface)}
      ${esc(race.distance)}
      ｜
      ${race.fieldSize}頭

    </div>

    <div
      class="card"
      style="
        margin-top:10px;
        padding:11px
      ">

      <b>結果</b>

      <div style="margin-top:6px">
        ${resultText}
      </div>

    </div>

    <h3>
      予想印
    </h3>

    ${horses}

    <div class="sheet-actions">

      <button
        class="btn primary"
        onclick="
          closeDetail();
          editRace('${race.id}')
        ">

        予想を編集

      </button>

      <button
        class="btn green"
        onclick="
          closeDetail();
          openResultEditor('${race.id}')
        ">

        結果を編集

      </button>

    </div>

    <button
      class="btn red full"
      style="margin-top:8px"
      onclick="
        closeDetail();
        deleteRace('${race.id}')
      ">

      この予想を削除

    </button>

    <button
      class="btn light full"
      style="margin-top:8px"
      onclick="closeDetail()">

      閉じる

    </button>

  `;

  document.getElementById(
    "detailModal"
  ).classList.add("show");

}

function closeDetail(){

  document.getElementById(
    "detailModal"
  ).classList.remove("show");

}

/* =========================

========================= */

function renderStats(){

  const s=stats();

  document.getElementById(
    "tRaces"
  ).textContent=s.races;

  document.getElementById(
    "tHitRate"
  ).textContent=
    s.hitRate.toFixed(1)+"%";

  document.getElementById(
    "tStake"
  ).textContent=
    yen(s.stake);

  document.getElementById(
    "tReturn"
  ).textContent=
    yen(s.returned);

  document.getElementById(
    "tROI"
  ).textContent=
    s.roi.toFixed(1)+"%";

  const el=
    document.getElementById(
      "tProfit"
    );

  el.textContent=
    (s.profit>=0?"+":"")+
    yen(s.profit);

  el.className=
    "v "+
    (
      s.profit>=0
        ?"plus"
        :"minus"
    );

  renderDetailStats();

  drawChart();

}

/* =========================
   CHART
========================= */

function drawChart(){

  const canvas=
    document.getElementById(
      "chart"
    );

  if(!canvas)return;

  const width=
    Math.max(
      320,
      canvas.clientWidth||320
    );

  const height=190;

  const dpr=
    Math.max(
      1,
      window.devicePixelRatio||1
    );

  canvas.width=
    width*dpr;

  canvas.height=
    height*dpr;

  const ctx=
    canvas.getContext("2d");

  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );

  ctx.clearRect(
    0,
    0,
    width,
    height
  );

  const values=[];

  let total=0;

  db.races
    .slice()
    .reverse()
    .forEach(
      race=>{

        total+=profit(race);

        values.push(total);

      }
    );

  if(!values.length){

    ctx.fillStyle="#667085";

    ctx.font="12px sans-serif";

    ctx.fillText(
      "結果入力したレースが増えるとグラフが表示されます",
      16,
      96
    );

    return;

  }

  const max=Math.max(
    1000,
    ...values.map(
      v=>Math.abs(v)
    )
  );

  const pad=28;

  const middle=
    height/2;

  function y(value){

    return pad+
      (max-value)/
      (max*2)*
      (height-pad*2);

  }

  function x(index){

    if(values.length===1)
      return width/2;

    return pad+
      index*
      (width-pad*2)/
      (values.length-1);

  }

  ctx.strokeStyle="#d0d5dd";

  ctx.lineWidth=1;

  ctx.beginPath();

  ctx.moveTo(
    pad,
    middle
  );

  ctx.lineTo(
    width-pad,
    middle
  );

  ctx.stroke();

  ctx.fillStyle="#667085";

  ctx.font="11px sans-serif";

  ctx.fillText(
    "+"+yen(max),
    4,
    14
  );

  ctx.fillText(
    "0円",
    6,
    middle-4
  );

  ctx.fillText(
    yen(-max),
    4,
    height-4
  );

  ctx.beginPath();

  values.forEach(
    (value,index)=>{

      if(index)
        ctx.lineTo(
          x(index),
          y(value)
        );
      else
        ctx.moveTo(
          x(index),
          y(value)
        );

    }
  );

  ctx.strokeStyle="#2563eb";

  ctx.lineWidth=2.4;

  ctx.stroke();

  values.forEach(
    (value,index)=>{

      ctx.beginPath();

      ctx.arc(
        x(index),
        y(value),
        3.4,
        0,
        Math.PI*2
      );

      ctx.fillStyle=
        value>=0
          ?" #16a34a".trim()
          :"#dc2626";

      ctx.fill();

    }
  );

  document.getElementById(
    "chartNote"
  ).textContent=
    `${values.length}レース｜最終累計 ${
      total>=0?"+":""
    }${yen(total)}`;

}

/* =========================
   PAGE
========================= */

function showPage(id){

  document.querySelectorAll(
    ".page"
  ).forEach(
    el=>
      el.classList.remove(
        "active"
      )
  );

  const page=
    document.getElementById(id);

  if(!page)return;

  page.classList.add("active");

  document.querySelectorAll(
    ".nav button"
  ).forEach(
    el=>
      el.classList.remove(
        "active"
      )
  );

  const nav=
    document.getElementById(
      "nav-"+id
    );

  if(nav)
    nav.classList.add("active");

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

  if(id==="stats"){

    setTimeout(
      ()=>{
        renderStats();
        drawChart();
      },
      50
    );

  }

}

/* =========================
   EVOLUTION
========================= */

function showEvolution(level){

  const info=
    levelInfo(
      (level-1)*100
    );

  const box=
    document.getElementById(
      "evoChar"
    );

  box.classList.remove("evo");

  void box.offsetWidth;

  box.classList.add("evo");

  box.innerHTML=
    horseSVG(info.stage);

  document.getElementById(
    "evoTitle"
  ).textContent=
    `Lv.${level}「${info.name}」へ進化！`;

  document.getElementById(
    "evoSub"
  ).textContent=
    "予想と結果の積み重ねで、あなたの馬が成長しました。";

  document.getElementById(
    "evoModal"
  ).classList.add("show");

}

function closeEvo(){

  document.getElementById(
    "evoModal"
  ).classList.remove("show");

}
