<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">

<title>競馬牧場</title>

<style>
:root{
  --bg:#f4f6f8;
  --card:#fff;
  --ink:#172033;
  --muted:#667085;
  --line:#e4e7ec;
  --navy:#0f172a;
  --blue:#2563eb;
  --green:#16a34a;
  --red:#dc2626;
  --gold:#d4a72c;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    Meiryo,
    sans-serif;
}

button,input,select{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  max-width:760px;
  margin:auto;
  padding-bottom:92px;
}

header{
  position:sticky;
  top:0;
  z-index:30;
  background:linear-gradient(135deg,#0b1220,#1e293b);
  color:#fff;
  padding:17px 15px 16px;
  box-shadow:0 3px 14px #0003;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.brand-mark{
  width:42px;
  height:42px;
  border-radius:13px;
  background:#ffffff12;
  display:grid;
  place-items:center;
  font-size:25px;
}

.title{
  font-size:23px;
  font-weight:950;
  letter-spacing:.03em;
}

.subtitle{
  font-size:11px;
  color:#cbd5e1;
  margin-top:2px;
}

.page{
  display:none;
  padding:14px;
}

.page.active{
  display:block;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:17px;
  padding:15px;
  margin-bottom:12px;
  box-shadow:0 2px 10px #1018280a;
}

h2{
  font-size:18px;
  margin:0 0 12px;
  font-weight:950;
}

h3{
  font-size:15px;
  margin:0 0 9px;
}

label{
  display:block;
  font-size:12px;
  font-weight:900;
  color:var(--muted);
  margin-bottom:6px;
}

input,select{
  width:100%;
  height:46px;
  border:1px solid #d0d5dd;
  border-radius:11px;
  background:#fff;
  color:var(--ink);
  padding:0 12px;
  outline:none;
}

input:focus,select:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 3px #2563eb18;
}

.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.btn{
  border:0;
  border-radius:11px;
  min-height:44px;
  padding:10px 13px;
  font-weight:950;
}

.btn:active{
  transform:scale(.985);
}

.primary{
  background:var(--navy);
  color:#fff;
}

.green{
  background:var(--green);
  color:#fff;
}

.red{
  background:var(--red);
  color:#fff;
}

.light{
  background:#eef2f6;
  color:var(--ink);
}

.gold{
  background:#f4d66d;
  color:#3b2b00;
}

.full{
  width:100%;
}

.small{
  font-size:12px;
  color:var(--muted);
}

.center{
  text-align:center;
}

.plus{
  color:var(--green)!important;
}

.minus{
  color:var(--red)!important;
}

/* =========================
   CHARACTER
========================= */

.character-wrap{
  height:270px;
  border-radius:15px;
  background:
    linear-gradient(
      #dff3ff 0%,
      #e8f7dc 65%,
      #c9e6b6 65%
    );
  position:relative;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  overflow:hidden;
  margin-bottom:11px;
}

.character-wrap:after{
  content:"";
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  height:55px;
  background:repeating-linear-gradient(
    155deg,
    #8fc17d 0 7px,
    #a9d494 7px 14px
  );
  opacity:.75;
}

.character-svg{
  position:relative;
  z-index:2;
  width:94%;
  height:255px;
  filter:drop-shadow(0 8px 5px #0002);
}

.levelline{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
}

.level{
  font-size:21px;
  font-weight:950;
}

.pill{
  border-radius:999px;
  padding:5px 9px;
  font-size:11px;
  font-weight:950;
  background:#eef2f6;
}

.expbar{
  height:11px;
  border-radius:99px;
  background:#e5e7eb;
  overflow:hidden;
  margin:8px 0;
}

.expfill{
  height:100%;
  width:0;
  background:linear-gradient(90deg,#22c55e,#a3e635);
  transition:width .5s;
}

/* =========================
   STATS
========================= */

.statgrid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
}

.stat{
  background:#f8fafc;
  border:1px solid var(--line);
  border-radius:12px;
  padding:10px;
}

.stat .v{
  font-size:20px;
  font-weight:950;
  margin-top:3px;
}

/* =========================
   TAP SELECT
========================= */

.tap-title{
  font-size:12px;
  font-weight:950;
  color:var(--muted);
  margin:12px 0 7px;
}

.tap-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
}

.tap-btn{
  border:1px solid #d0d5dd;
  background:#fff;
  color:#344054;
  border-radius:10px;
  min-height:43px;
  font-weight:950;
  padding:7px 4px;
}

.tap-btn.selected{
  background:#111827;
  color:#fff;
  border-color:#111827;
  box-shadow:0 2px 7px #0002;
}

/* =========================
   GATE COLORS
========================= */

.gate1{background:#fff;color:#111;border:1px solid #c9c9c9}
.gate2{background:#111;color:#fff}
.gate3{background:#f04444;color:#fff}
.gate4{background:#3b82f6;color:#fff}
.gate5{background:#facc15;color:#111}
.gate6{background:#22c55e;color:#fff}
.gate7{background:#f97316;color:#fff}
.gate8{background:#ff9bc2;color:#111}

.tap-btn.selected.gate1,
.tap-btn.selected.gate2,
.tap-btn.selected.gate3,
.tap-btn.selected.gate4,
.tap-btn.selected.gate5,
.tap-btn.selected.gate6,
.tap-btn.selected.gate7,
.tap-btn.selected.gate8{
  outline:3px solid #111827;
  outline-offset:1px;
}

/* =========================
   HORSE
========================= */

.horse{
  border:1px solid var(--line);
  border-radius:14px;
  padding:11px;
  margin:8px 0;
  background:#fff;
}

.horse-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:9px;
}

.horse-label{
  font-size:13px;
  font-weight:950;
}

.horse-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.horse-mini{
  font-size:11px;
  color:var(--muted);
  font-weight:800;
  margin-bottom:4px;
}

.horse-number-display{
  height:46px;
  border:1px solid #d0d5dd;
  border-radius:11px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#f8fafc;
  font-weight:950;
}

.remove-horse{
  border:0;
  background:#fee2e2;
  color:#b91c1c;
  border-radius:9px;
  padding:7px 9px;
  font-size:11px;
  font-weight:950;
}

/* =========================
   MARK
========================= */

.mark-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
}

.mark{
  border:0;
  border-radius:11px;
  padding:12px 10px;
  font-weight:950;
  font-size:16px;
}

.m-◎{background:#fee2e2;color:#b91c1c}
.m-○{background:#dbeafe;color:#1d4ed8}
.m-▲{background:#fef3c7;color:#92400e}
.m-☆{background:#fce7f3;color:#be185d}
.m-△{background:#dcfce7;color:#166534}
.m-消{background:#e5e7eb;color:#374151}
.m-－{background:#f3f4f6;color:#6b7280}

/* =========================
   RACE
========================= */

.raceitem{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  border:1px solid var(--line);
  border-radius:13px;
  padding:12px;
  margin:8px 0;
  background:#fff;
}

.meta{
  font-size:12px;
  color:var(--muted);
  margin-top:3px;
}

.badge{
  border-radius:999px;
  padding:5px 9px;
  font-size:11px;
  font-weight:950;
  background:#eef2f6;
}

.badge.ok{
  background:#dcfce7;
  color:#166534;
}

.badge.ng{
  background:#fee2e2;
  color:#991b1b;
}

.sheet-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

canvas{
  width:100%;
  height:190px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#fff;
}

/* =========================
   NAV
========================= */

.nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:40;
  background:#fff;
  border-top:1px solid var(--line);
  display:grid;
  grid-template-columns:repeat(4,1fr);
  padding-bottom:env(safe-area-inset-bottom);
}

.nav button{
  border:0;
  background:#fff;
  color:#667085;
  padding:9px 3px 8px;
  font-size:11px;
  font-weight:900;
}

.nav button strong{
  display:block;
  font-size:20px;
  line-height:21px;
}

.nav button.active{
  color:#111827;
}

/* =========================
   MODAL
========================= */

.modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:60;
  background:#0008;
  align-items:flex-end;
}

.modal.show{
  display:flex;
}

.sheet{
  width:100%;
  max-width:760px;
  margin:auto;
  background:#fff;
  border-radius:20px 20px 0 0;
  padding:16px;
  max-height:90vh;
  overflow:auto;
}

.toast{
  position:fixed;
  left:50%;
  bottom:78px;
  z-index:90;
  transform:translate(-50%,20px);
  opacity:0;
  background:#111827;
  color:#fff;
  padding:11px 16px;
  border-radius:12px;
  font-weight:900;
  pointer-events:none;
  transition:.25s;
  white-space:nowrap;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

.evo{
  animation:evo .7s ease;
}

.evo-text{
  text-align:center;
  font-size:23px;
  font-weight:950;
  color:#b45309;
  margin:4px 0 10px;
}

@keyframes evo{
  0%{
    transform:scale(.55);
    opacity:0;
  }
  60%{
    transform:scale(1.08);
  }
  100%{
    transform:scale(1);
    opacity:1;
  }
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:26px 8px;
}

.divider{
  height:1px;
  background:var(--line);
  margin:12px 0;
}

.exp-bonus{
  margin-top:8px;
  padding:9px;
  border-radius:10px;
  background:#f0fdf4;
  color:#166534;
  font-weight:900;
}

.result-box{
  border:1px solid var(--line);
  border-radius:14px;
  padding:12px;
  margin:9px 0;
  background:#f8fafc;
}

.result-title{
  font-size:15px;
  font-weight:950;
  margin-bottom:8px;
}

.result-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.section-title{
  font-size:14px;
  font-weight:950;
  margin:4px 0 9px;
}

.filter-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
}

.filter-btn{
  border:1px solid #d0d5dd;
  background:#fff;
  border-radius:11px;
  padding:11px 8px;
  font-weight:950;
  text-align:left;
}

.filter-btn.selected{
  background:#111827;
  color:#fff;
  border-color:#111827;
}

.analysis-card{
  border:1px solid var(--line);
  border-radius:13px;
  padding:11px;
  margin-top:8px;
  background:#fff;
}

.analysis-title{
  font-weight:950;
  font-size:14px;
}

.analysis-values{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
  margin-top:8px;
}

.analysis-value{
  background:#f8fafc;
  border-radius:9px;
  padding:8px 5px;
  text-align:center;
}

.analysis-value b{
  display:block;
  font-size:16px;
}

@media(min-width:700px){

  .nav{
    position:static;
    max-width:760px;
    margin:auto;
    border:1px solid var(--line);
    border-radius:15px;
  }

  .app{
    padding-bottom:20px;
  }

  .toast{
    bottom:20px;
  }
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="brand">
    <div class="brand-mark">🏇</div>
    <div>
      <div class="title">競馬牧場</div>
      <div class="subtitle">予想するほど、あなたの馬が強くなる。</div>
    </div>
  </div>
</header>

<!-- HOME -->

<section id="home" class="page active">

  <div class="card">

    <div id="characterBox" class="character-wrap"></div>

    <div class="levelline">
      <div id="level" class="level">Lv.1 赤ちゃん馬</div>
      <div id="rank" class="pill">赤ちゃん馬</div>
    </div>

    <div class="small" id="expText">EXP 0 / 100</div>

    <div class="expbar">
      <div id="expFill" class="expfill"></div>
    </div>

    <div class="small">
      次の進化まであと
      <b id="nextText">100 EXP</b>
    </div>

  </div>

  <div class="card">

    <h2>📊 現在の成績</h2>

    <div class="statgrid">

      <div class="stat">
        <div class="small">総レース</div>
        <div id="sRaces" class="v">0</div>
      </div>

      <div class="stat">
        <div class="small">的中</div>
        <div id="sHits" class="v">0</div>
      </div>

      <div class="stat">
        <div class="small">回収率</div>
        <div id="sROI" class="v">0.0%</div>
      </div>

      <div class="stat">
        <div class="small">累計収支</div>
        <div id="sProfit" class="v">0円</div>
      </div>

    </div>

  </div>

  <button class="btn primary full" onclick="showPage('predict')">
    🏇 予想をはじめる
  </button>

  <div class="card" style="margin-top:12px">

    <h2>🌱 育成状況</h2>

    <div id="growthInfo" class="small"></div>

  </div>

</section>

<!-- PREDICT -->

<section id="predict" class="page">

  <div class="card">

    <h2>📝 予想を登録</h2>

    <div class="grid2">

      <div>
        <label>競馬場</label>
        <select id="track"></select>
      </div>

      <div>
        <label>レース</label>
        <select id="raceNo"></select>
      </div>

    </div>

    <div class="grid2" style="margin-top:10px">

      <div>
        <label>芝・ダート・障害</label>
        <select id="surface"></select>
      </div>

      <div>
        <label>距離</label>
        <select id="distance"></select>
      </div>

    </div>

    <div class="tap-title">🏆 クラス</div>
    <div id="classChoices" class="tap-grid"></div>

  </div>

  <div class="card">

    <h2>🐴 出走馬</h2>

    <div class="small">
      最初は1頭だけ表示されます。必要な頭数まで追加してください。
    </div>

    <div id="horses"></div>

    <button
      class="btn gold full"
      style="margin-top:9px"
      onclick="addHorse()">

      ＋ 出走馬を追加

    </button>

  </div>

  <div class="card">

    <label>投資額</label>

    <input
      id="stake"
      type="number"
      min="0"
      step="100"
      placeholder="例：1000">

  </div>

  <button class="btn green full" onclick="savePrediction()">
    予想を登録する
  </button>

  <button
    id="editCancel"
    class="btn light full"
    style="display:none;margin-top:8px"
    onclick="cancelEdit()">
    編集をキャンセル
  </button>

</section>

<!-- RESULT -->

<section id="result" class="page">

  <div class="card">

    <h2>🏁 結果入力</h2>

    <div id="resultList"></div>

  </div>

</section>

<!-- HISTORY -->

<section id="history" class="page">

  <div class="card">

    <h2>📋 予想履歴</h2>

    <div id="historyList"></div>

  </div>

</section>

<!-- STATS -->

<section id="stats" class="page">

  <div class="card">

    <h2>📊 成績集計</h2>

    <div class="statgrid">

      <div class="stat">
        <div class="small">総レース</div>
        <div id="tRaces" class="v">0</div>
      </div>

      <div class="stat">
        <div class="small">的中率</div>
        <div id="tHitRate" class="v">0.0%</div>
      </div>

      <div class="stat">
        <div class="small">投資</div>
        <div id="tStake" class="v">0円</div>
      </div>

      <div class="stat">
        <div class="small">回収</div>
        <div id="tReturn" class="v">0円</div>
      </div>

      <div class="stat">
        <div class="small">回収率</div>
        <div id="tROI" class="v">0.0%</div>
      </div>

      <div class="stat">
        <div class="small">収支</div>
        <div id="tProfit" class="v">0円</div>
      </div>

    </div>

  </div>

  <div class="card">

    <h2>🔎 詳細成績</h2>

    <div class="tap-title">集計項目</div>

    <div id="analysisTabs" class="tap-grid">

      <button class="tap-btn selected" onclick="setAnalysisType('track')">
        🏟️ 競馬場
      </button>

      <button class="tap-btn" onclick="setAnalysisType('distance')">
        📏 距離
      </button>

      <button class="tap-btn" onclick="setAnalysisType('surface')">
        🌱 馬場
      </button>

      <button class="tap-btn" onclick="setAnalysisType('class')">
        🏆 クラス
      </button>

      <button class="tap-btn" onclick="setAnalysisType('popularity')">
        🔢 人気
      </button>

      <button class="tap-btn" onclick="setAnalysisType('odds')">
        💰 オッズ
      </button>

    </div>

    <div
      id="analysisFilters"
      class="filter-grid"
      style="margin-top:10px">
    </div>

    <div id="analysisResult"></div>

  </div>

  <div class="card">

    <h2>📈 累計収支推移</h2>

    <canvas id="chart"></canvas>

    <div
      id="chartNote"
      class="small center"
      style="margin-top:7px">
      結果入力したレースから自動計算
    </div>

  </div>

</section>

<!-- NAV -->

<nav class="nav">

  <button id="nav-home" onclick="showPage('home')">
    <strong>🏠</strong>
    ホーム
  </button>

  <button id="nav-predict" onclick="showPage('predict')">
    <strong>📝</strong>
    予想
  </button>

  <button id="nav-history" onclick="showPage('history')">
    <strong>📋</strong>
    履歴
  </button>

  <button id="nav-stats" onclick="showPage('stats')">
    <strong>📊</strong>
    成績
  </button>

</nav>

</div>

<!-- MARK MODAL -->

<div
  id="markModal"
  class="modal"
  onclick="if(event.target===this)closeMark()">

  <div class="sheet">

    <h2>🎯 印を選択</h2>

    <div id="markChoices" class="mark-grid"></div>

    <button
      class="btn light full"
      style="margin-top:9px"
      onclick="closeMark()">
      閉じる
    </button>

  </div>

</div>

<!-- DETAIL -->

<div
  id="detailModal"
  class="modal"
  onclick="if(event.target===this)closeDetail()">

  <div class="sheet">
    <div id="detailContent"></div>
  </div>

</div>

<!-- EVOLUTION -->

<div id="evoModal" class="modal">

  <div class="sheet center">

    <div class="evo-text">
      ✨ 進化！ ✨
    </div>

    <div id="evoChar" class="character-wrap"></div>

    <h2 id="evoTitle"></h2>

    <div id="evoSub" class="small"></div>

    <button
      class="btn primary full"
      style="margin-top:12px"
      onclick="closeEvo()">
      これからも育てる！
    </button>

  </div>

</div>

<div id="toast" class="toast"></div>

<script>

"use strict";

/* =========================
   STORAGE
========================= */

const STORE="keiba_bokujou_v6";

/* =========================
   DATA
========================= */

const TRACKS=[
  "札幌","函館","福島","新潟","東京",

function freshDatabase(){

  return{
    version:6,
    races:[],
    lastEvolution:1
  };
}

function normalizeHorse(h,i){

  return{

    no:Number(h?.no)||0,

    gate:Number(h?.gate)||0,

    name:String(h?.name||""),

    mark:MARKS.includes(h?.mark)
      ?h.mark
      :"－",

    predictedPopularity:
      Number(h?.predictedPopularity)||0,

    predictedOdds:
      Number(h?.predictedOdds)||0

  };
}

function normalizeRace(r){

  const result=r.result||{};

  const horses=
    Array.isArray(r.horses)
      ?r.horses
      :[];

  return{

    id:
      r.id||
      String(Date.now()+Math.random()),

    date:
      r.date||
      new Date().toISOString(),

    track:
      r.track||
      "東京",

    raceNo:
      Number(r.raceNo)||1,

    surface:
      r.surface||
      "芝",

    distance:
      r.distance||
      "1600m",

    class:
      CLASSES.includes(r.class)
        ?r.class
        :"その他",

    fieldSize:
      Number(r.fieldSize)||
      horses.length||
      1,

    stake:
      Number(r.stake)||0,

    horses:
      horses.map(normalizeHorse),

    result:{

      first:
        String(result.first||""),

      second:
        String(result.second||""),

      third:
        String(result.third||""),

      firstName:
        String(result.firstName||""),

      secondName:
        String(result.secondName||""),

      thirdName:
        String(result.thirdName||""),

      firstPopularity:
        Number(result.firstPopularity)||0,

      secondPopularity:
        Number(result.secondPopularity)||0,

      thirdPopularity:
        Number(result.thirdPopularity)||0,

      firstOdds:
        Number(result.firstOdds)||0,

      secondOdds:
        Number(result.secondOdds)||0,

      thirdOdds:
        Number(result.thirdOdds)||0,

      returned:
        Number(result.returned)||0,

      hit:
        typeof result.hit==="boolean"
          ?result.hit
          :false,

      done:
        !!result.done

    }

  };
}

function loadDatabase(){

  try{

    const raw=
      localStorage.getItem(STORE)||
      localStorage.getItem("keiba_bokujou_v5")||
      localStorage.getItem("keiba_bokujou_v4");

    if(!raw)
      return freshDatabase();

    const x=JSON.parse(raw);

    x.races=
      (x.races||[])
      .map(normalizeRace);

    x.version=6;

    x.lastEvolution=
      Number(x.lastEvolution)||1;

    return x;

  }catch(e){

    console.error(e);

    return freshDatabase();

  }

}

/* =========================
   HELPERS
========================= */

function esc(s){

  return String(s??"").replace(
    /[&<>"']/g,
    c=>({

      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"

    }[c])

  );

}

function yen(n){

  return Number(n||0)
    .toLocaleString("ja-JP")+"円";

}

function profit(r){

  if(!r.result.done)
    return 0;

  return Number(
    r.result.returned||0
  )-
  Number(r.stake||0);

}

function predictedNumbers(r){

  return r.horses
    .filter(h=>h.mark!=="－")
    .map(h=>String(h.no));

}

function hit(r){

  if(!r.result.done)
    return false;

  if(typeof r.result.hit==="boolean")
    return r.result.hit;

  const top3=[
    String(r.result.first),
    String(r.result.second),
    String(r.result.third)
  ];

  return predictedNumbers(r)
    .some(no=>top3.includes(no));

}

function toast(message){

  const el=
    document.getElementById("toast");

  el.textContent=message;

  el.classList.add("show");

  setTimeout(
    ()=>el.classList.remove("show"),
    1800
  );

}

/* =========================
   LEVEL
========================= */

function levelInfo(exp){

  const level=Math.min(
    50,
    Math.floor(exp/100)+1
  );

  let name;
  let stage;

  if(level<=4){

    name="赤ちゃん馬";
    stage="foal";

  }else if(level<=9){

    name="子馬";
    stage="young";

  }else if(level<=14){

    name="若駒";
    stage="juvenile";

  }else if(level<=19){

    name="成長馬";
    stage="grown";

  }else if(level<=24){

    name="競走馬";
    stage="racehorse";

  }else if(level<=29){

    name="強豪競走馬";
    stage="strong";

  }else if(level<=34){

    name="重賞級";
    stage="graded";

  }else if(level<=39){

    name="チャンピオン";
    stage="champion";

  }else if(level<=44){

    name="最強馬";
    stage="elite";

  }else if(level<=49){

    name="王者";
    stage="king";

  }else{

    name="伝説の競走馬";
    stage="legend";

  }

  return{

    level,
    name,
    stage,

    current:
      level===50
        ?100
        :exp%100,

    need:100

  };

}

/* =========================
   SELECT
========================= */

function fillSelect(
  id,
  arr,
  value,
  race=false
){

  const select=
    document.getElementById(id);

  select.innerHTML="";

  arr.forEach(item=>{

    select.add(
      new Option(
        race
          ?item+"R"
          :item,
        item
      )
    );

  });

  select.value=value;

}

/* =========================
   DISTANCE
========================= */

function updateDistance(){

  const surface=
    document.getElementById(
      "surface"
    ).value;

  let defaultDistance="1600m";

  if(surface==="ダート")
    defaultDistance="1200m";

  if(surface==="障害")
    defaultDistance="3000m";

  fillSelect(
    "distance",
    DIST[surface],
    defaultDistance
  );

}

    return;

  horsesForm.push({

    no:0,
    gate:0,
    name:"",
    mark:"－",
    predictedPopularity:0,

  if(horsesForm.length<=1){

    toast("最低1頭は必要です");

  horsesForm.splice(index,1);

  renderHorses();

  horsesForm.forEach(

let pickerTarget=null;

function openGatePicker(index){

  pickerTarget={
    type:"gate",
    index
  };

  const box=
    document.getElementById(
      "markChoices"
    );

  box.innerHTML="";

  for(let i=1;i<=8;i++){

    const btn=
      document.createElement("button");

    btn.className=
      "tap-btn gate"+i+
      (
        horsesForm[index].gate===i
          ?" selected"
          :""
      );

    btn.textContent=i+"枠";

    btn.onclick=()=>{

      horsesForm[index].gate=i;

      closeMark();

      renderHorses();

    };

    box.appendChild(btn);

  }

  document.querySelector(
    "#markModal h2"
  ).textContent="🎨 枠番を選択";

  document
    .getElementById("markModal")
    .classList.add("show");

}

function openNumberPicker(index){

  pickerTarget={
    type:"number",
    index
  };

  const box=
    document.getElementById(
      "markChoices"
    );

  box.innerHTML="";

  for(let i=1;i<=18;i++){

    const btn=
      document.createElement("button");

    btn.className=
      "tap-btn"+
      (
        horsesForm[index].no===i
          ?" selected"
          :""
      );

    btn.textContent=i+"番";

    btn.onclick=()=>{

      horsesForm[index].no=i;

      closeMark();

      renderHorses();

    };

    box.appendChild(btn);

  }

  document.querySelector(
    "#markModal h2"
  ).textContent="🔢 馬番を選択";

  document
    .getElementById("markModal")

}

/* =========================
   MARK
========================= */

function openMark(index){

  pickerTarget=null;

  markHorse=index;

  const box=
    document.getElementById(
      "markChoices"
    );

  box.innerHTML="";

  document.querySelector(
    "#markModal h2"
  ).textContent="🎯 印を選択";

  MARKS.forEach(mark=>{

    const button=
      document.createElement("button");

    button.className=
      "mark m-"+mark;

    button.textContent=
      mark==="－"
        ?"－ 無印"
        :mark;

    button.onclick=()=>{

      horsesForm[index].mark=mark;

      closeMark();

      renderHorses();

      toast(
        mark==="－"
          ?"無印"
          :"印「"+mark+"」"
      );

    };

    box.appendChild(button);

  });

  document
    .getElementById("markModal")
    .classList.add("show");

}

function closeMark(){

  document
    .getElementById("markModal")
    .classList.remove("show");

  markHorse=null;
  pickerTarget=null;

}

   COLLECT
========================= */

function collectPrediction(){

  horsesForm.forEach(
    (h,i)=>{

      const input=
        document.getElementById(
          "horseName"+i
        );

      if(input)
        h.name=input.value.trim();

    }
  );

  return{

    track:
      document.getElementById(
        "track"
      ).value,

    raceNo:
      Number(
        document.getElementById(
          "raceNo"
        ).value
      ),

    surface:
      document.getElementById(
        "surface"
      ).value,

    distance:
      document.getElementById(
        "distance"
      ).value,

    class:selectedClass,

    fieldSize:
      horsesForm.length,

    stake:
      Number(
        document.getElementById(
          "stake"
        ).value
      )||0,

    horses:
      horsesForm.map(
        (h,i)=>normalizeHorse({
          ...h,
          no:h.no||0,
          gate:h.gate||0
        },i)
      )

  };

}

/* =========================
   SAVE
========================= */

function savePrediction(){

  const form=
    collectPrediction();

  if(!form.horses.some(
    h=>h.name
  )){

    toast(
      "馬名を1頭以上入力してください"
    );

    return;

  }

  if(
    form.horses.some(
      h=>!h.no
    )
  ){

    toast(
      "馬番を選択してください"
    );

    return;

  }

  if(editId){

    const index=
      db.races.findIndex(
        r=>
          String(r.id)===
          String(editId)
      );

    if(index>=0){

      db.races[index]=
        normalizeRace({
          ...db.races[index],
          ...form
        });

    }

    toast("予想を更新しました");

    editId=null;

    document.getElementById(
      "editCancel"
    ).style.display="none";

  }else{

    db.races.unshift(
      normalizeRace({

        ...form,

        id:
          String(
            Date.now()+
            Math.random()
          ),

        date:
          new Date().toISOString(),

        result:{

          done:false,

          first:"",
          second:"",
          third:"",

          firstName:"",
          secondName:"",
          thirdName:"",

          firstPopularity:0,
          secondPopularity:0,
          thirdPopularity:0,

          firstOdds:0,
          secondOdds:0,
          thirdOdds:0,

          returned:0,

function saveResult(id){

  const race=
    db.races.find(
      r=>
        String(r.id)===
        String(id)
    );

  if(!race)return;

  const oldLevel=
    levelInfo(
      calcExp()
    ).level;

  ["first","second","third"]
    .forEach(key=>{

      const name=
        document.getElementById(
          "resultName_"+key
        );

      const odds=
        document.getElementById(
          "resultOdds_"+key
        );

      race.result[key+"Name"]=
        name
          ?name.value.trim()
          :"";

      race.result[key+"Odds"]=
        odds
          ?Number(odds.value)||0
          :0;

    });

  race.result.returned=
    Number(
      document.getElementById(
        "ret"
      ).value
    )||0;

  race.result.hit=
    window.currentResultData?.hit===true;

  race.result.done=true;

  persist();

  refresh();

  const newLevel=
    levelInfo(
      calcExp()
    ).level;

  const bonus=
    getRaceExp(race);

  toast(
    `結果保存！ +${bonus} EXP`
  );

  if(newLevel>oldLevel){

    setTimeout(
      ()=>showEvolution(newLevel),
      300
    );

  }else{

    showPage("result");

  }

}

/* =========================
   EXP
========================= */

function getRaceExp(race){

  if(!race.result.done)
    return 0;

  let exp=15;

  if(hit(race))
    exp+=35;

  const stake=
    Number(race.stake||0);

  const returned=
    Number(
      race.result.returned||0
    );

  if(stake>0){

    const roi=
      returned/stake*100;

    if(roi>=100)
      exp+=15;

    if(roi>=150)
      exp+=15;

    if(roi>=200)
      exp+=20;

    const win=
      Math.max(
        0,
        returned-stake
      );

    if(win>=1000)
      exp+=5;

    if(win>=3000)
      exp+=10;

    if(win>=5000)
      exp+=15;

    if(win>=10000)
      exp+=25;

    if(win>=30000)
      exp+=40;

    if(win>=50000)
      exp+=60;

  }

  return exp;

}

function calcExp(){

  let exp=0;

  db.races.forEach(race=>{

    exp+=10;

    if(race.result.done)
      exp+=getRaceExp(race);

  });

  return exp;

}

/* =========================
   STATS
========================= */

function stats(){

  const done=
    db.races.filter(
      r=>r.result.done
    );

  const stake=
    db.races.reduce(
      (sum,r)=>
        sum+Number(r.stake||0),
      0
    );

  const returned=
    done.reduce(
      (sum,r)=>
        sum+
        Number(
          r.result.returned||0
        ),
      0
    );

  const hits=
    done.filter(hit).length;

  return{

    races:db.races.length,

    done:done.length,

    hits,

    stake,

    returned,

    profit:
      returned-stake,

    roi:
      stake
        ?returned/stake*100
        :0,

    hitRate:
      done.length
        ?hits/done.length*100
        :0

  };

}

    odds:"オッズ"
  };

    ))
      btn.classList.add(

function getAnalysisItems(){

  if(analysisType==="track")
    return TRACKS;

  if(analysisType==="distance"){

    const set=new Set();

    db.races.forEach(
      r=>set.add(r.distance)
    );

    return Array.from(
      set
    ).sort(
      (a,b)=>
        parseInt(a)-
        parseInt(b)
    );

  }

  if(analysisType==="surface")
    return SURFACES;

  if(analysisType==="class")
    return CLASSES;

  if(analysisType==="popularity")
    return POPULARITIES.map(
      n=>n+"番人気"
    );

  if(analysisType==="odds")
    return[
      "1.0〜2.9倍",
      "3.0〜4.9倍",
      "5.0〜9.9倍",
      "10.0〜19.9倍",
      "20.0〜49.9倍",
      "50倍以上"
    ];

  return[];

}

function renderAnalysis(){

  const filters=
    document.getElementById(
      "analysisFilters"
    );

  const result=
    document.getElementById(
      "analysisResult"
    );

  const items=
    getAnalysisItems();

  if(
    !items.length
  ){

    filters.innerHTML="";

    result.innerHTML=`

      <div class="empty">
        データがありません。
      </div>

    `;

    return;

  }

  filters.innerHTML=
    items.map(
      item=>`

      <button
        class="
          filter-btn
          ${
            String(
              analysisFilter
            )===
            String(item)
              ?"selected"
              :""
          }
        "
        onclick="
          selectAnalysisFilter(
            '${esc(String(item))}'
          )
        ">

        ${esc(String(item))}

      </button>

      `
    ).join("");

  if(
    analysisFilter===null
  ){

    result.innerHTML=`

      <div class="empty">

        項目をタップすると
        詳細成績が表示されます。

      </div>

    `;

    return;

  }

  const data=
    calculateAnalysis(
      analysisFilter
    );

  result.innerHTML=`

    <div class="analysis-card">

      <div class="analysis-title">

        ${esc(
          String(
            analysisFilter
          )
        )}

      </div>

      <div class="analysis-values">

        <div class="analysis-value">

          <span class="small">
            レース
          </span>

          <b>
            ${data.races}
          </b>

        </div>

        <div class="analysis-value">

          <span class="small">
            的中率
          </span>

          <b>
            ${data.hitRate.toFixed(1)}%
          </b>

        </div>

        <div class="analysis-value">

          <span class="small">
            回収率
          </span>

          <b>
            ${data.roi.toFixed(1)}%
          </b>

        </div>

      </div>

      <div
        class="analysis-values"
        style="margin-top:6px">

        <div class="analysis-value">

          <span class="small">
            投資
          </span>

          <b>
            ${yen(data.stake)}
          </b>

        </div>

        <div class="analysis-value">

          <span class="small">
            回収
          </span>

          <b>
            ${yen(data.returned)}
          </b>

        </div>

        <div class="analysis-value">

          <span class="small">
            収支
          </span>

          <b class="${
            data.profit>=0
              ?"plus"
              :"minus"
          }">

            ${
              data.profit>=0
                ?"+"
                :""
            }

            ${yen(data.profit)}

          </b>

        </div>

      </div>

    </div>

  `;

}

function selectAnalysisFilter(value){

  analysisFilter=value;

  renderAnalysis();

}

function calculateAnalysis(filter){

  let races=[];

  if(
    analysisType==="track"
  ){

    races=
      db.races.filter(
        r=>r.track===filter
      );

  }else if(
    analysisType==="distance"
  ){

    races=
      db.races.filter(
        r=>r.distance===filter
      );

  }else if(
    analysisType==="surface"
  ){

    races=
      db.races.filter(
        r=>r.surface===filter
      );

  }else if(
    analysisType==="class"
  ){

    races=
      db.races.filter(
        r=>r.class===filter
      );

  }else if(
    analysisType==="popularity"
  ){

    const pop=
      parseInt(filter);

    races=
      db.races.filter(
        r=>
          r.horses.some(
            h=>
              Number(
                h.predictedPopularity
              )===pop
          )
      );

  }else if(
    analysisType==="odds"
  ){

    races=
      db.races.filter(
        r=>
          r.horses.some(
            h=>{
              const o=
                Number(
                  h.predictedOdds
                );

              return oddsBucket(o)===filter;
            }
          )
      );

  }

  const done=
    races.filter(
      r=>r.result.done
    );

  const stake=
    races.reduce(
      (s,r)=>
        s+
        Number(r.stake||0),
      0
    );

  const returned=
    done.reduce(
      (s,r)=>
        s+
        Number(
          r.result.returned||0
        ),
      0
    );

  const hits=
    done.filter(hit).length;

  return{

    races:races.length,

    hitRate:
      done.length
        ?hits/done.length*100
        :0,

    stake,

    returned,

    profit:
      returned-stake,

    roi:
      stake
        ?returned/stake*100
        :0

  };

}

function oddsBucket(o){

  if(!o)
    return null;

  if(o<3)
    return"1.0〜2.9倍";

  if(o<5)
    return"3.0〜4.9倍";

  if(o<10)
    return"5.0〜9.9倍";

  if(o<20)
    return"10.0〜19.9倍";

  if(o<50)
    return"20.0〜49.9倍";

  return"50倍以上";

}

/* =========================
   CHART
========================= */

function drawChart(){

  const canvas=
    document.getElementById(
      "chart"
    );

  if(!canvas)return;

  const width=
    Math.max(
      320,
      canvas.clientWidth||320
    );

  const height=190;

  const dpr=
    Math.max(
      1,
      window.devicePixelRatio||1
    );

  canvas.width=
    width*dpr;

  canvas.height=
    height*dpr;

  const ctx=
    canvas.getContext("2d");

  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );

  ctx.clearRect(
    0,
    0,
    width,
    height
  );

  const values=[];

  let total=0;

  db.races
    .slice()
    .reverse()
    .forEach(
      race=>{

        total+=profit(race);

        values.push(total);

      }
    );

  if(!values.length){

    ctx.fillStyle="#667085";

    ctx.font="12px sans-serif";

    ctx.fillText(
      "結果入力したレースが増えるとグラフが表示されます",
      16,
      96
    );

    return;

  }

  const max=
    Math.max(
      1000,
      ...values.map(
        v=>Math.abs(v)
      )
    );

  const pad=28;

  const middle=
    height/2;

  function y(value){

    return pad+
      (
        max-value
      )/
      (max*2)*
      (
        height-pad*2
      );

  }

  function x(index){

    if(values.length===1)
      return width/2;

    return pad+
      index*
      (
        width-pad*2
      )/
      (
        values.length-1
      );

  }

  ctx.strokeStyle="#d0d5dd";

  ctx.lineWidth=1;

  ctx.beginPath();

  ctx.moveTo(
    pad,
    middle
  );

  ctx.lineTo(
    width-pad,
    middle
  );

  ctx.stroke();

  ctx.fillStyle="#667085";

  ctx.font="11px sans-serif";

  ctx.fillText(
    "+"+yen(max),
    4,
    14
  );

  ctx.fillText(
    "0円",
    6,
    middle-4
  );

  ctx.fillText(
    yen(-max),
    4,
    height-4
  );

  ctx.beginPath();

  values.forEach(
    (value,index)=>{

      if(index)
        ctx.lineTo(
          x(index),
          y(value)
        );
      else
        ctx.moveTo(
          x(index),
          y(value)
        );

    }
  );

  ctx.strokeStyle="#2563eb";

  ctx.lineWidth=2.4;

  ctx.stroke();

  values.forEach(
    (value,index)=>{

      ctx.beginPath();

      ctx.arc(
        x(index),
        y(value),
        3.4,
        0,
        Math.PI*2
      );

      ctx.fillStyle=
        value>=0
          ?" #16a34a".trim()
          :"#dc2626";

      ctx.fill();

    }
  );

  document.getElementById(
    "chartNote"
  ).textContent=
    `${values.length}レース｜最終累計 ${
      total>=0?"+":""
    }${yen(total)}`;

}

function showPage(id){

  document.querySelectorAll(
    ".page"
  ).forEach(
    el=>
      el.classList.remove(
        "active"
      )
  );

  const page=
    document.getElementById(id);

  if(!page)return;

  page.classList.add("active");

  document.querySelectorAll(
    ".nav button"
  ).forEach(
    el=>
      el.classList.remove(
        "active"
      )
  );

  const nav=
    document.getElementById(
      "nav-"+id
    );

  if(nav)
    nav.classList.add(
      "active"
    );

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

  if(id==="stats"){

    setTimeout(
      ()=>{
        drawChart();
        renderAnalysis();
      },
      50
    );

  }

}
