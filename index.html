<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#0f172a">

<title>競馬牧場</title>

<style>

:root{
--bg:#f4f6f8;
--card:#fff;
--ink:#172033;
--muted:#667085;
--line:#e4e7ec;
--navy:#0f172a;
--blue:#2563eb;
--green:#16a34a;
--red:#dc2626;
--gold:#d4a72c;
--orange:#f97316;
}

*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

body{
margin:0;
background:var(--bg);
color:var(--ink);
font-family:
-apple-system,
BlinkMacSystemFont,
"Hiragino Kaku Gothic ProN",
"Yu Gothic",
Meiryo,
sans-serif;
}

button,input,select{
font:inherit;
}

button{
cursor:pointer;
}

.app{
max-width:760px;
margin:auto;
padding-bottom:90px;
}

/* HEADER */

header{
position:sticky;
top:0;
z-index:30;
background:linear-gradient(
135deg,
#0b1220,
#1e293b
);
color:#fff;
padding:15px;
box-shadow:0 3px 14px #0003;
}

.brand{
display:flex;
align-items:center;
gap:10px;
}

.brand-mark{
width:43px;
height:43px;
border-radius:13px;
background:#ffffff12;
display:grid;
place-items:center;
font-size:25px;
}

.title{
font-size:23px;
font-weight:950;
}

.subtitle{
font-size:11px;
color:#cbd5e1;
margin-top:2px;
}

/* PAGE */

.page{
display:none;
padding:14px;
}

.page.active{
display:block;
}

/* CARD */

.card{
background:#fff;
border:1px solid var(--line);
border-radius:17px;
padding:15px;
margin-bottom:12px;
box-shadow:0 2px 10px #1018280a;
}

h2{
font-size:18px;
margin:0 0 12px;
font-weight:950;
}

h3{
font-size:15px;
margin:0 0 9px;
}

label{
display:block;
font-size:12px;
font-weight:900;
color:var(--muted);
margin-bottom:6px;
}

input,
select{
width:100%;
height:46px;
border:1px solid #d0d5dd;
border-radius:11px;
background:#fff;
color:var(--ink);
padding:0 12px;
outline:none;
}

input:focus,
select:focus{
border-color:var(--blue);
box-shadow:0 0 0 3px #2563eb18;
}

.grid2{
display:grid;
grid-template-columns:1fr 1fr;
gap:9px;
}

.btn{
border:0;
border-radius:11px;
min-height:44px;
padding:10px 13px;
font-weight:950;
}

.btn:active{
transform:scale(.985);
}

.primary{
background:var(--navy);
color:#fff;
}

.green{
background:var(--green);
color:#fff;
}

.red{
background:var(--red);
color:#fff;
}

.light{
background:#eef2f6;
color:var(--ink);
}

.gold{
background:#f4d66d;
color:#3b2b00;
}

.full{
width:100%;
}

.small{
font-size:12px;
color:var(--muted);
}

.center{
text-align:center;
}

.plus{
color:var(--green)!important;
}

.minus{
color:var(--red)!important;
}

/* HOME CHARACTER */

.character-wrap{
height:230px;
border-radius:17px;
background:
linear-gradient(
#dff3ff 0%,
#e8f7dc 62%,
#c9e6b6 62%
);
position:relative;
display:flex;
align-items:flex-end;
justify-content:center;
overflow:hidden;
margin-bottom:11px;
}

.character-wrap:after{
content:"";
position:absolute;
bottom:0;
left:0;
right:0;
height:48px;
background:
repeating-linear-gradient(
155deg,
#8fc17d 0 7px,
#a9d494 7px 14px
);
opacity:.75;
}

.character-svg{
position:relative;
z-index:2;
width:96%;
height:220px;
filter:drop-shadow(0 8px 5px #0002);
}

.levelline{
display:flex;
justify-content:space-between;
align-items:center;
gap:8px;
}

.level{
font-size:21px;
font-weight:950;
}

.pill{
border-radius:999px;
padding:5px 9px;
font-size:11px;
font-weight:950;
background:#eef2f6;
}

.expbar{
height:12px;
border-radius:99px;
background:#e5e7eb;
overflow:hidden;
margin:8px 0;
}

.expfill{
height:100%;
width:0;
background:linear-gradient(
90deg,
#22c55e,
#a3e635
);
transition:.6s;
}

/* COLLAPSE */

.collapse-btn{
width:100%;
border:0;
background:#f8fafc;
border:1px solid var(--line);
border-radius:12px;
padding:12px;
font-weight:950;
display:flex;
justify-content:space-between;
align-items:center;
}

.collapse-content{
display:none;
margin-top:10px;
}

.collapse-content.open{
display:block;
}

/* STATS */

.statgrid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:8px;
}

.stat{
background:#f8fafc;
border:1px solid var(--line);
border-radius:12px;
padding:10px;
}

.stat .v{
font-size:20px;
font-weight:950;
margin-top:3px;
}

/* PREDICTION */

.choice-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
}

.choice{
border:1px solid var(--line);
background:#f8fafc;
border-radius:11px;
padding:11px 5px;
font-weight:950;
}

.choice.selected{
background:#111827;
color:#fff;
}

/* HORSE */

.horse{
border:1px solid var(--line);
border-radius:14px;
margin:8px 0;
background:#fff;
overflow:hidden;
}

.horse-summary{
display:grid;
grid-template-columns:40px 1fr auto 28px;
align-items:center;
gap:8px;
padding:11px;
}

.horse-number{
width:38px;
height:36px;
border-radius:9px;
background:#f8fafc;
border:1px solid #d0d5dd;
display:grid;
place-items:center;
font-size:17px;
font-weight:950;
}

.horse-summary-name{
font-weight:900;
overflow:hidden;
white-space:nowrap;
text-overflow:ellipsis;
}

.horse-mark{
font-size:18px;
font-weight:950;
}

.expand-arrow{
font-size:18px;
transition:.2s;
}

.horse.open .expand-arrow{
transform:rotate(180deg);
}

.horse-detail{
display:none;
border-top:1px solid var(--line);
padding:12px;
background:#fafbfc;
}

.horse.open .horse-detail{
display:block;
}

.horse-detail-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
}

.frame-mini{
height:38px;
border-radius:9px;
display:grid;
place-items:center;
font-weight:950;
}

.frame-1{
background:#fff;
color:#111;
border:1px solid #999;
}

.frame-2{
background:#111;
color:#fff;
}

.frame-3{
background:#dc2626;
color:#fff;
}

.frame-4{
background:#2563eb;
color:#fff;
}

.frame-5{
background:#facc15;
color:#111;
}

.frame-6{
background:#16a34a;
color:#fff;
}

.frame-7{
background:#f97316;
color:#fff;
}

.frame-8{
background:#f472b6;
color:#111;
}

.mini-buttons{
display:grid;
grid-template-columns:1fr 1fr;
gap:7px;
margin-top:9px;
}

.mini-btn{
border:0;
background:#eef2f6;
border-radius:9px;
padding:9px;
font-weight:900;
}

.mark-btn{
border:1px solid #cfd4dc;
background:#f8fafc;
border-radius:10px;
padding:8px 10px;
min-width:62px;
font-weight:950;
}

.mark-btn.set{
background:#111827;
color:#fff;
}

/* MARK */

.mark-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:8px;
}

.mark{
border:0;
border-radius:11px;
padding:12px 10px;
font-weight:950;
font-size:16px;
}

.m-◎{
background:#fee2e2;
color:#b91c1c;
}

.m-○{
background:#dbeafe;
color:#1d4ed8;
}

.m-▲{
background:#fef3c7;
color:#92400e;
}

.m-☆{
background:#fce7f3;
color:#be185d;
}

.m-△{
background:#dcfce7;
color:#166534;
}

.m-消{
background:#e5e7eb;
color:#374151;
}

.m-－{
background:#f3f4f6;
color:#6b7280;
}

/* FRAME */

.frame-grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:7px;
}

.frame-btn{
height:44px;
border:2px solid #cbd5e1;
border-radius:10px;
font-weight:950;
font-size:17px;
}

.frame-btn.selected{
box-shadow:0 0 0 3px #111827;
}

/* NUMBER */

.number-grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:8px;
}

.num-btn{
min-height:55px;
border:1px solid var(--line);
background:#f8fafc;
border-radius:11px;
font-weight:950;
}

.num-btn.selected{
background:#111827;
color:#fff;
}

/* HISTORY */

.raceitem{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
border:1px solid var(--line);
border-radius:13px;
padding:12px;
margin:8px 0;
background:#fff;
}

.meta{
font-size:12px;
color:var(--muted);
margin-top:3px;
}

.badge{
border-radius:999px;
padding:5px 9px;
font-size:11px;
font-weight:950;
background:#eef2f6;
}

.badge.ok{
background:#dcfce7;
color:#166534;
}

.badge.ng{
background:#fee2e2;
color:#991b1b;
}

/* ANALYSIS */

.analysis-list{
display:flex;
flex-direction:column;
gap:7px;
}

.analysis-item{
width:100%;
border:1px solid var(--line);
background:#fff;
border-radius:13px;
padding:12px;
display:flex;
justify-content:space-between;
align-items:center;
text-align:left;
}

.analysis-left{
display:flex;
align-items:center;
gap:9px;
min-width:0;
}

.rank-number{
width:28px;
font-weight:950;
color:var(--muted);
}

.analysis-name{
font-weight:950;
}

.analysis-value{
font-weight:950;
}

.arrow{
color:#98a2b3;
font-size:20px;
}

.analysis-detail{
background:#f8fafc;
border:1px solid var(--line);
border-radius:14px;
padding:13px;
margin-top:10px;
}

.analysis-detail-title{
font-size:18px;
font-weight:950;
margin-bottom:12px;
}

.back-btn{
border:0;
background:#eef2f6;
border-radius:10px;
padding:9px 12px;
font-weight:900;
margin-bottom:10px;
}

.analysis-tabs{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:7px;
}

.analysis-tab{
border:1px solid var(--line);
background:#f8fafc;
border-radius:10px;
padding:10px 5px;
font-size:12px;
font-weight:950;
}

.analysis-tab.active{
background:#111827;
color:#fff;
}

/* RESULT */

.place-buttons{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
}

.place-btn{
border:0;
border-radius:11px;
padding:13px;
font-weight:950;
background:#eef2f6;
}

.place-btn.active{
background:#111827;
color:#fff;
}

.result-horse{
border:1px solid var(--line);
border-radius:13px;
padding:10px;
margin:8px 0;
}

.result-select{
border:2px solid #d0d5dd;
border-radius:11px;
background:#fff;
padding:10px;
font-weight:950;
width:100%;
text-align:left;
}

/* NAV */

.nav{
position:fixed;
left:0;
right:0;
bottom:0;
z-index:40;
background:#fff;
border-top:1px solid var(--line);
display:grid;
grid-template-columns:repeat(4,1fr);
padding-bottom:env(safe-area-inset-bottom);
}

.nav button{
border:0;
background:#fff;
color:#667085;
padding:9px 3px 8px;
font-size:11px;
font-weight:900;
}

.nav button strong{
display:block;
font-size:20px;
line-height:21px;
}

.nav button.active{
color:#111827;
}

/* MODAL */

.modal{
display:none;
position:fixed;
inset:0;
z-index:60;
background:#0008;
align-items:flex-end;
}

.modal.show{
display:flex;
}

.sheet{
width:100%;
max-width:760px;
margin:auto;
background:#fff;
border-radius:20px 20px 0 0;
padding:16px;
max-height:90vh;
overflow:auto;
}

/* TOAST */

.toast{
position:fixed;
left:50%;
bottom:78px;
z-index:90;
transform:translate(-50%,20px);
opacity:0;
background:#111827;
color:#fff;
padding:11px 16px;
border-radius:12px;
font-weight:900;
pointer-events:none;
transition:.25s;
white-space:nowrap;
}

.toast.show{
opacity:1;
transform:translate(-50%,0);
}

.empty{
text-align:center;
color:var(--muted);
padding:26px 8px;
}

/* RESPONSIVE */

@media(min-width:700px){

.nav{
position:static;
max-width:760px;
margin:auto;
border:1px solid var(--line);
border-radius:15px;
}

.app{
padding-bottom:20px;
}

.toast{
bottom:20px;
}

}

</style>
</head>

<body>

<div class="app">

<header>

<div class="brand">

<div class="brand-mark">🏇</div>

<div>

<div class="title">
競馬牧場
</div>

<div class="subtitle">
予想するほど、あなたの馬が強くなる。
</div>

</div>

</div>

</header>


<!-- ================= HOME ================= -->

<section id="home" class="page active">

<div class="card">

<div id="characterBox"
class="character-wrap">
</div>

<div class="levelline">

<div id="level"
class="level">
Lv.1 赤ちゃん馬
</div>

<div id="rank"
class="pill">
赤ちゃん馬
</div>

</div>

<div
id="expText"
class="small">
EXP 0 / 100
</div>

<div class="expbar">

<div
id="expFill"
class="expfill">
</div>

</div>

<div class="small">
次の進化まで
<b id="nextText">
100 EXP
</b>
</div>

<button
class="collapse-btn"
style="margin-top:12px"
onclick="toggleGrowth()">

<span>
🐎 成長を見る
</span>

<span id="growthArrow">
▼
</span>

</button>

<div
id="growthContent"
class="collapse-content">

<div class="statgrid">

<div class="stat">
<div class="small">累計レース</div>
<div id="gRaces" class="v">0</div>
</div>

<div class="stat">
<div class="small">的中</div>
<div id="gHits" class="v">0</div>
</div>

<div class="stat">
<div class="small">回収率</div>
<div id="gROI" class="v">0.0%</div>
</div>

<div class="stat">
<div class="small">累計EXP</div>
<div id="gEXP" class="v">0</div>
</div>

</div>

<div
id="growthInfo"
class="small"
style="margin-top:12px">
</div>

</div>

</div>


<div class="card">

<h2>
📊 現在の成績
</h2>

<div class="statgrid">

<div class="stat">
<div class="small">総レース</div>
<div id="sRaces" class="v">0</div>
</div>

<div class="stat">
<div class="small">的中</div>
<div id="sHits" class="v">0</div>
</div>

<div class="stat">
<div class="small">回収率</div>
<div id="sROI" class="v">0.0%</div>
</div>

<div class="stat">
<div class="small">累計収支</div>
<div id="sProfit" class="v">0円</div>
</div>

</div>

</div>


<button
class="btn primary full"
onclick="showPage('predict')">

🏇 予想をはじめる

</button>

</section>


<!-- ================= PREDICT ================= -->

<section id="predict" class="page">

<div class="card">

<h2>
📝 予想を登録
</h2>

<div class="grid2">

<div>

<label>
競馬場
</label>

<select id="track"></select>

</div>

<div>

<label>
レース
</label>

<select id="raceNo"></select>

</div>

</div>


<div
class="grid2"
style="margin-top:10px">

<div>

<label>
芝・ダート・障害
</label>

<select id="surface"></select>

</div>

<div>

<label>
距離
</label>

<select id="distance"></select>

</div>

</div>


<div style="margin-top:10px">

<label>
クラス
</label>

<div
id="classChoices"
class="choice-grid">
</div>

</div>


<div style="margin-top:10px">

<label>
馬場状態
</label>

<div
id="groundChoices"
class="choice-grid">
</div>

</div>


<div style="margin-top:10px">

<label>
頭数
</label>

<select id="fieldSize"></select>

</div>

</div>


<!-- HORSES -->

<div class="card">

<h2>
🐴 出走馬
</h2>

<div class="small">
馬名と印だけなら一覧で確認できます。<br>
細かい情報は「詳細を入力 ▼」から。
</div>

<div id="horses"></div>

<button
class="btn light full"
onclick="addHorse()">

＋ 馬を追加

</button>

</div>


<div class="card">

<label>
投資額
</label>

<input
id="stake"
type="number"
min="0"
step="100"
placeholder="例：1000">

</div>


<button
class="btn green full"
onclick="savePrediction()">

予想を登録する

</button>


<button
id="editCancel"
class="btn light full"
style="display:none;margin-top:8px"
onclick="cancelEdit()">

編集をキャンセル

</button>

</section>


<!-- ================= RESULT ================= -->

<section id="result" class="page">

<div class="card">

<h2>
🏁 結果入力
</h2>

<div id="resultList"></div>

</div>

</section>


<!-- ================= HISTORY ================= -->

<section id="history" class="page">

<div class="card">

<h2>
📋 予想履歴
</h2>

<div id="historyList"></div>

</div>

</section>


<!-- ================= STATS ================= -->

<section id="stats" class="page">

<div class="card">

<h2>
📊 成績分析
</h2>

<div
id="analysisRoot">
</div>

</div>

</section>


<!-- NAV -->

<nav class="nav">

<button
id="nav-home"
onclick="showPage('home')">

<strong>🏠</strong>
ホーム

</button>

<button
id="nav-predict"
onclick="showPage('predict')">

<strong>📝</strong>
予想

</button>

<button
id="nav-history"
onclick="showPage('history')">

<strong>📋</strong>
履歴

</button>

<button
id="nav-stats"
onclick="showPage('stats')">

<strong>📊</strong>
成績

</button>

</nav>

</div>


<!-- ================= MARK MODAL ================= -->

<div
id="markModal"
class="modal"
onclick="if(event.target===this)closeMark()">

<div class="sheet">

<h2>
🎯 印を選択
</h2>

<div
id="markChoices"
class="mark-grid">
</div>

<button
class="btn light full"
style="margin-top:10px"
onclick="closeMark()">

閉じる

</button>

</div>

</div>


<!-- ================= FRAME MODAL ================= -->

<div
id="frameModal"
class="modal"
onclick="if(event.target===this)closeFrame()">

<div class="sheet">

<h2>
🎨 枠番を選択
</h2>

<div
id="frameChoices"
class="frame-grid">
</div>

<button
class="btn light full"
style="margin-top:10px"
onclick="closeFrame()">

閉じる

</button>

</div>

</div>


<!-- ================= NUMBER MODAL ================= -->

<div
id="numberModal"
class="modal"
onclick="if(event.target===this)closeNumber()">

<div class="sheet">

<h2>
🔢 馬番を選択
</h2>

<div
id="numberChoices"
class="number-grid">
</div>

<button
class="btn light full"
style="margin-top:10px"
onclick="closeNumber()">

閉じる

</button>

</div>

</div>


<!-- ================= RESULT MODAL ================= -->

<div
id="resultModal"
class="modal"
onclick="if(event.target===this)closeResultSelect()">

<div class="sheet">

<h2 id="resultModalTitle">
🏁 着順を選択
</h2>

<div
id="resultHorseChoices"
class="number-grid">
</div>

<button
class="btn light full"
style="margin-top:10px"
onclick="closeResultSelect()">

閉じる

</button>

</div>

</div>


<div
id="toast"
class="toast">
</div>


<script>

"use strict";


/* =========================
DATABASE
========================= */

const STORE="keiba_bokujou_v10";

const TRACKS=[
"札幌",

function freshDB(){

return{
version:10,
races:[],
lastEvolution:1
};

}


function normalizeRace(r){

return{

id:r.id||
String(Date.now()+Math.random()),

date:r.date||
new Date().toISOString(),

track:r.track||"東京",

raceNo:Number(r.raceNo)||1,

surface:r.surface||"芝",

distance:r.distance||"1600m",

className:r.className||"その他",

ground:r.ground||"良",

fieldSize:Number(r.fieldSize)||5,

stake:Number(r.stake)||0,

horses:(r.horses||[]).map((h,i)=>({

no:Number(h.no)||i+1,

frame:Number(h.frame)||
frameFromNo(Number(h.no)||i+1),

name:String(h.name||""),

mark:MARKS.includes(h.mark)?
h.mark:"－"

})),

result:{

first:String(r.result?.first||""),

second:String(r.result?.second||""),

third:String(r.result?.third||""),

returned:Number(r.result?.returned)||0,

hitStatus:r.result?.hitStatus||"auto",

done:!!r.result?.done

},

odds:Number(r.odds)||0,

popularity:Number(r.popularity)||0

};

}


function loadDB(){

try{

const raw=
localStorage.getItem(STORE)||
localStorage.getItem("keiba_bokujou_v9")||
localStorage.getItem("keiba_bokujou_v8");

if(!raw)return freshDB();

const db=JSON.parse(raw);

db.races=(db.races||[])
.map(normalizeRace);

return db;

}catch(e){

return freshDB();

}

}


let db=loadDB();


function persist(){

localStorage.setItem(
STORE,
JSON.stringify(db)
);

}


function esc(s){

return String(s??"")
.replace(/[&<>"']/g,c=>({

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"

}[c]));

}


function yen(n){

return Number(n||0)
.toLocaleString("ja-JP")+"円";

}


function frameFromNo(no){

return Math.min(
8,
Math.ceil(Number(no)/2)
);

}


function profit(r){

return r.result.done?
Number(r.result.returned||0)-
Number(r.stake||0):
0;

}


function hit(r){

if(!r.result.done)return false;

if(r.result.hitStatus==="hit")
return true;

if(r.result.hitStatus==="miss")
return false;

const top=[
r.result.first,
r.result.second,
r.result.third
];

return r.horses.some(h=>
h.mark!=="－" &&
top.includes(String(h.no))
);

}

}

function levelInfo(exp){

const level=
Math.min(
50,
Math.floor(exp/100)+1
);

let name;
let stage;

if(level<=4){

name="赤ちゃん馬";
stage="foal";

}else if(level<=9){

name="子馬";
stage="young";

}else if(level<=14){

name="若駒";
stage="juvenile";

}else if(level<=19){

name="成長馬";
stage="grown";

}else if(level<=24){

name="競走馬";
stage="racehorse";

}else if(level<=29){

name="強豪競走馬";
stage="strong";

}else if(level<=34){

name="重賞級";
stage="graded";

}else if(level<=39){

name="チャンピオン";
stage="champion";

}else if(level<=44){

name="最強馬";
stage="elite";

}else if(level<=49){

name="王者";
stage="king";

}else{

name="伝説の競走馬";
stage="legend";

}

return{

level,
name,
stage,

current:
level===50?
100:
exp%100,

need:100

};

}

/* =========================

========================= */

function fillSelect(
id,
arr,
value,
race=false,
suffix=""
){

const s=
document.getElementById(id);

s.innerHTML="";

arr.forEach(x=>{

let text=x;

if(race)
text=x+"R";

else if(suffix)
text=x+suffix;

s.add(
new Option(text,x)
);

});

s.value=value;

}


function renderChoice(
id,
arr,
value,
callback
){

const box=
document.getElementById(id);

box.innerHTML="";

arr.forEach(x=>{

const b=
document.createElement("button");

b.className=
"choice"+
(x===value?
" selected":
"");

b.textContent=x;

b.onclick=()=>{

box.querySelectorAll(".choice")
.forEach(z=>
z.classList.remove("selected")
);

b.classList.add("selected");

callback(x);

};

box.appendChild(b);

});

}


function updateDistance(){

const s=
document.getElementById("surface").value;

const d=
s==="芝"?
"1600m":
s==="ダート"?
"1200m":
"3000m";

fillSelect(
"distance",
DIST[s],
d
);

}

);

if(editId){

db.races.find(
x=>String(x.id)===String(editId)

toast("予想を更新しました");

editId=null;

db.races.unshift(

);

/* =========================
EXP
========================= */

function getRaceExp(r){

if(!r.result.done)return 0;

let e=15;

if(hit(r))
e+=35;

const stake=
Number(r.stake||0);

const ret=
Number(r.result.returned||0);

if(stake){

const roi=
ret/stake*100;

if(roi>=100)e+=15;
if(roi>=150)e+=15;
if(roi>=200)e+=20;

}

return e;

}


function calcExp(){

let e=0;

db.races.forEach(r=>{

e+=10;

if(r.result.done)
e+=getRaceExp(r);

});

return e;

}


/* =========================
STATS
========================= */

function stats(){

const done=
db.races.filter(
r=>r.result.done
);

const stake=
db.races.reduce(
(a,r)=>
a+Number(r.stake||0),
0
);

const returned=
done.reduce(
(a,r)=>
a+Number(r.result.returned||0),
0
);

const hits=
done.filter(hit).length;

return{

races:db.races.length,

done:done.length,

hits,

stake,

returned,

profit:
returned-stake,

roi:
stake?
returned/stake*100:
0,

hitRate:
done.length?
hits/done.length*100:
0

};

}

function makeAnalysisMap(
getter,
filterFn
){

const map={};

db.races
.filter(r=>
r.result.done &&
(!filterFn||filterFn(r))
)
.forEach(r=>{

let key=getter(r);

if(!key)return;

if(!map[key]){

map[key]={
races:0,
hits:0,
stake:0,
ret:0
};

}

map[key].races++;

if(hit(r))
map[key].hits++;

map[key].stake+=
Number(r.stake||0);

map[key].ret+=
Number(r.result.returned||0);

});

return map;

}


function aggregate(races){

const x={
races:0,
hits:0,
stake:0,
ret:0
};

races.forEach(r=>{

x.races++;

if(hit(r))
x.hits++;

x.stake+=
Number(r.stake||0);

x.ret+=
Number(r.result.returned||0);

});

return x;

}


function sortAnalysis(map){

return Object.keys(map)
.sort((a,b)=>{

const ar=
map[a].stake?
map[a].ret/map[a].stake:
0;

const br=
map[b].stake?
map[b].ret/map[b].stake:
0;

return br-ar;

});

}

analysisCondition="総合";

function selectAnalysisCondition(condition){

analysisCondition=condition;

analysisCondition=null;

analysisCondition=null;
