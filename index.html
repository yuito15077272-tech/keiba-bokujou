<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>競馬牧場</title>

<style>
:root{
--bg:#f4f6f8;
--card:#fff;
--ink:#172033;
--muted:#667085;
--line:#e4e7ec;
--navy:#0f172a;
--blue:#2563eb;
--green:#16a34a;
--red:#dc2626;
--gold:#d4a72c;
--orange:#f97316;
}

*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

body{
margin:0;
background:var(--bg);
color:var(--ink);
font-family:-apple-system,BlinkMacSystemFont,
"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
}

button,input,select{
font:inherit;
}

button{
cursor:pointer;
}

.app{
max-width:760px;
margin:auto;
padding-bottom:92px;
}

/* =========================
HEADER
========================= */

header{
position:sticky;
top:0;
z-index:30;
background:linear-gradient(135deg,#0b1220,#1e293b);
color:#fff;
padding:14px 15px;
box-shadow:0 3px 14px #0003;
}

.brand{
display:flex;
align-items:center;
gap:10px;
}

.brand-mark{
width:43px;
height:43px;
border-radius:13px;
background:#ffffff12;
display:grid;
place-items:center;
font-size:25px;
}

.title{
font-size:23px;
font-weight:950;
}

.subtitle{
font-size:11px;
color:#cbd5e1;
margin-top:2px;
}

/* =========================
PAGE
========================= */

.page{
display:none;
padding:12px;
}

.page.active{
display:block;
}

/* =========================
CARD
========================= */

.card{
background:#fff;
border:1px solid var(--line);
border-radius:17px;
padding:14px;
margin-bottom:11px;
box-shadow:0 2px 10px #1018280a;
}

h2{
font-size:18px;
margin:0 0 11px;
font-weight:950;
}

h3{
font-size:15px;
margin:0 0 9px;
}

label{
display:block;
font-size:12px;
font-weight:900;
color:var(--muted);
margin-bottom:6px;
}

input,select{
width:100%;
height:45px;
border:1px solid #d0d5dd;
border-radius:11px;
background:#fff;
color:var(--ink);
padding:0 12px;
outline:none;
}

input:focus,select:focus{
border-color:var(--blue);
box-shadow:0 0 0 3px #2563eb18;
}

.grid2{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
}

.btn{
border:0;
border-radius:11px;
min-height:43px;
padding:9px 13px;
font-weight:950;
}

.btn:active{
transform:scale(.985);
}

.primary{
background:var(--navy);
color:#fff;
}

.green{
background:var(--green);
color:#fff;
}

.red{
background:var(--red);
color:#fff;
}

.light{
background:#eef2f6;
color:var(--ink);
}

.gold{
background:#f4d66d;
color:#3b2b00;
}

.full{
width:100%;
}

.small{
font-size:12px;
color:var(--muted);
}

.center{
text-align:center;
}

.plus{
color:var(--green)!important;
}

.minus{
color:var(--red)!important;
}

/* =========================
COMPACT SECTION
========================= */

.section-head{
display:flex;
align-items:center;
justify-content:space-between;
gap:8px;
margin-bottom:9px;
}

.section-head h2{
margin:0;
}

.section-arrow{
font-size:17px;
transition:.2s;
}

.section-arrow.open{
transform:rotate(180deg);
}

.toggle-area{
display:none;
margin-top:10px;
}

.toggle-area.open{
display:block;
}

/* =========================
CHARACTER
========================= */

.character-wrap{
height:245px;
border-radius:17px;
background:
linear-gradient(#dff3ff 0%,#e8f7dc 62%,#c9e6b6 62%);
position:relative;
display:flex;
align-items:flex-end;
justify-content:center;
overflow:hidden;
margin-bottom:10px;
}

.character-wrap:after{
content:"";
position:absolute;
bottom:0;
left:0;
right:0;
height:52px;
background:
repeating-linear-gradient(
155deg,
#8fc17d 0 7px,
#a9d494 7px 14px
);
opacity:.75;
}

.character-svg{
position:relative;
z-index:2;
width:96%;
height:235px;
filter:drop-shadow(0 8px 5px #0002);
}

.levelline{
display:flex;
justify-content:space-between;
align-items:center;
gap:8px;
}

.level{
font-size:20px;
font-weight:950;
}

.pill{
border-radius:999px;
padding:5px 9px;
font-size:11px;
font-weight:950;
background:#eef2f6;
}

.expbar{
height:11px;
border-radius:99px;
background:#e5e7eb;
overflow:hidden;
margin:7px 0;
}

.expfill{
height:100%;
width:0;
background:linear-gradient(90deg,#22c55e,#a3e635);
transition:.6s;
}

.growth-badge{
display:inline-flex;
align-items:center;
gap:5px;
background:#fff7ed;
color:#9a3412;
border:1px solid #fed7aa;
border-radius:999px;
padding:5px 9px;
font-size:11px;
font-weight:950;
}

/* =========================
STATS
========================= */

.statgrid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:8px;
}

.stat{
background:#f8fafc;
border:1px solid var(--line);
border-radius:12px;
padding:10px;
}

.stat .v{
font-size:20px;
font-weight:950;
margin-top:3px;
}

.mini-stat{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:7px;
}

.mini-stat-box{
background:#f8fafc;
border:1px solid var(--line);
border-radius:10px;
padding:8px;
text-align:center;
}

.mini-stat-box b{
display:block;
font-size:16px;
margin-top:2px;
}

/* =========================
HORSE COMPACT
========================= */

.horse{
border:1px solid var(--line);
border-radius:13px;
margin:7px 0;
background:#fff;
overflow:hidden;
}

.horse-summary{
display:grid;
grid-template-columns:38px 42px 1fr 35px 26px;
align-items:center;
gap:6px;
padding:9px;
min-height:53px;
}

.horse-summary:active{
background:#f8fafc;
}

.frame-mini{
width:38px;
height:34px;
border-radius:8px;
display:grid;
place-items:center;
font-weight:950;
font-size:13px;
}

.number-mini{
width:40px;
height:34px;
border-radius:8px;
display:grid;
place-items:center;
font-weight:950;
font-size:16px;
background:#f8fafc;
border:1px solid #d0d5dd;
}

.horse-summary-name{
font-size:13px;
font-weight:900;
overflow:hidden;
white-space:nowrap;
text-overflow:ellipsis;
}

.horse-summary-name.empty{
color:#98a2b3;
font-weight:700;
}

.horse-mark{
width:30px;
height:30px;
border-radius:8px;
display:grid;
place-items:center;
font-weight:950;
font-size:15px;
}

.horse-arrow{
font-size:14px;
color:#667085;
transition:.2s;
}

.horse.open .horse-arrow{
transform:rotate(180deg);
}

.horse-detail{
display:none;
padding:0 9px 10px;
border-top:1px solid var(--line);
background:#fafbfc;
}

.horse.open .horse-detail{
display:block;
}

.horse-detail-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
padding-top:10px;
}

.detail-control{
background:#fff;
border:1px solid var(--line);
border-radius:10px;
padding:8px;
}

.detail-control label{
margin-bottom:5px;
}

.horse-name-input{
height:40px!important;
font-weight:800;
}

.horse-detail-actions{
display:grid;
grid-template-columns:1fr 1fr;
gap:7px;
margin-top:8px;
}

.horse-action{
height:38px;
border:0;
border-radius:9px;
background:#eef2f6;
font-size:12px;
font-weight:900;
}

/* =========================
FRAME
========================= */

.frame-btn{
width:44px;
height:42px;
border:2px solid #cbd5e1;
border-radius:10px;
font-weight:950;
font-size:17px;
}

.frame-grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:7px;
}

.frame-1{
background:#fff;
color:#111;
border-color:#999;
}

.frame-2{
background:#111;
color:#fff;
}

.frame-3{
background:#dc2626;
color:#fff;
}

.frame-4{
background:#2563eb;
color:#fff;
}

.frame-5{
background:#facc15;
color:#111;
}

.frame-6{
background:#16a34a;
color:#fff;
}

.frame-7{
background:#f97316;
color:#fff;
}

.frame-8{
background:#f472b6;
color:#111;
}

.frame-btn.selected{
box-shadow:0 0 0 3px #111827;
}

/* =========================
NUMBER
========================= */

.number-grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:7px;
}

.num-btn{
border:1px solid #d0d5dd;
background:#f8fafc;
border-radius:10px;
min-height:52px;
font-weight:950;
font-size:15px;
}

.num-btn.selected{
background:#111827;
color:#fff;
border-color:#111827;
}

/* =========================
CHOICES
========================= */

.choice-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:7px;
}

.choice{
border:1px solid var(--line);
background:#f8fafc;
border-radius:10px;
padding:10px 4px;
font-weight:950;
}

.choice.selected{
background:#111827;
color:#fff;
}

/* =========================
MARK
========================= */

.mark-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:8px;
}

.mark{
border:0;
border-radius:11px;
padding:12px 10px;
font-weight:950;
font-size:16px;
}

.m-◎{
background:#fee2e2;
color:#b91c1c;
}

.m-○{
background:#dbeafe;
color:#1d4ed8;
}

.m-▲{
background:#fef3c7;
color:#92400e;
}

.m-☆{
background:#fce7f3;
color:#be185d;
}

.m-△{
background:#dcfce7;
color:#166534;
}

.m-消{
background:#e5e7eb;
color:#374151;
}

.m-－{
background:#f3f4f6;
color:#6b7280;
}

/* =========================
RACE LIST
========================= */

.raceitem{
display:flex;
justify-content:space-between;
align-items:center;
gap:8px;
border:1px solid var(--line);
border-radius:12px;
padding:10px 11px;
margin:7px 0;
background:#fff;
}

.raceitem:active{
background:#f8fafc;
}

.meta{
font-size:11px;
color:var(--muted);
margin-top:3px;
}

.race-title{
font-size:14px;
font-weight:950;
}

.race-result{
text-align:right;
min-width:75px;
}

.badge{
display:inline-block;
border-radius:999px;
padding:4px 7px;
font-size:10px;
font-weight:950;
background:#eef2f6;
}

.badge.ok{
background:#dcfce7;
color:#166534;
}

.badge.ng{
background:#fee2e2;
color:#991b1b;
}

.sheet-actions{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
}

/* =========================
RESULT
========================= */

.result-horse{
border:1px solid var(--line);
border-radius:12px;
padding:9px;
margin:7px 0;
background:#fff;
}

.result-top{
display:flex;
align-items:center;
gap:8px;
}

.result-place{
font-size:17px;
font-weight:950;
min-width:40px;
}

.result-select{
border:2px solid #d0d5dd;
border-radius:10px;
background:#fff;
padding:9px;
font-weight:900;
flex:1;
text-align:left;
}

.result-select.active{
border-color:#111827;
background:#f8fafc;
}

.place-buttons{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:7px;
}

.place-btn{
border:0;
border-radius:10px;
padding:11px 5px;
font-weight:950;
background:#eef2f6;
}

.place-btn.active{
background:#111827;
color:#fff;
}

/* =========================
ANALYSIS DRILLDOWN
========================= */

.analysis-header{
display:flex;
align-items:center;
gap:9px;
margin-bottom:10px;
}

.back-btn{
border:0;
background:#eef2f6;
border-radius:9px;
width:36px;
height:36px;
font-weight:950;
}

.analysis-title{
font-size:17px;
font-weight:950;
}

.analysis-list{
display:flex;
flex-direction:column;
gap:6px;
}

.analysis-item{
display:flex;
align-items:center;
justify-content:space-between;
gap:8px;
padding:11px 10px;
border:1px solid var(--line);
border-radius:11px;
background:#fff;
}

.analysis-item:active{
background:#f8fafc;
}

.analysis-rank{
width:27px;
font-size:13px;
font-weight:950;
color:#667085;
}

.analysis-name{
flex:1;
font-weight:900;
font-size:13px;
}

.analysis-roi{
font-weight:950;
font-size:14px;
}

.analysis-arrow{
color:#98a2b3;
font-size:17px;
}

.roi-good{
color:var(--green);
}

.roi-bad{
color:var(--red);
}

.roi-normal{
color:var(--ink);
}

.analysis-subtabs{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:7px;
margin-bottom:10px;
}

.analysis-subtab{
border:1px solid var(--line);
background:#f8fafc;
border-radius:10px;
padding:10px 4px;
font-size:12px;
font-weight:950;
}

.analysis-subtab.active{
background:#111827;
color:#fff;
}

.analysis-detail-card{
border:1px solid var(--line);
border-radius:13px;
padding:12px;
background:#fff;
}

.analysis-detail-title{
font-size:16px;
font-weight:950;
margin-bottom:10px;
}

.analysis-detail-stats{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:7px;
}

.analysis-detail-stat{
background:#f8fafc;
border:1px solid var(--line);
border-radius:10px;
padding:9px;
text-align:center;
}

.analysis-detail-stat span{
display:block;
font-size:10px;
color:var(--muted);
font-weight:900;
}

.analysis-detail-stat b{
display:block;
font-size:17px;
margin-top:2px;
}

.analysis-extra{
margin-top:9px;
font-size:11px;
color:var(--muted);
line-height:1.7;
}

/* =========================
CHART
========================= */

canvas{
width:100%;
height:180px;
border:1px solid var(--line);
border-radius:12px;
background:#fff;
}

/* =========================
NAV
========================= */

.nav{
position:fixed;
left:0;
right:0;
bottom:0;
z-index:40;
background:#fff;
border-top:1px solid var(--line);
display:grid;
grid-template-columns:repeat(4,1fr);
padding-bottom:env(safe-area-inset-bottom);
}

.nav button{
border:0;
background:#fff;
color:#667085;
padding:8px 3px 7px;
font-size:11px;
font-weight:900;
}

.nav button strong{
display:block;
font-size:20px;
line-height:21px;
}

.nav button.active{
color:#111827;
}

/* =========================
MODAL
========================= */

.modal{
display:none;
position:fixed;
inset:0;
z-index:60;
background:#0008;
align-items:flex-end;
}

.modal.show{
display:flex;
}

.sheet{
width:100%;
max-width:760px;
margin:auto;
background:#fff;
border-radius:20px 20px 0 0;
padding:15px;
max-height:90vh;
overflow:auto;
}

/* =========================
TOAST
========================= */

.toast{
position:fixed;
left:50%;
bottom:78px;
z-index:90;
transform:translate(-50%,20px);
opacity:0;
background:#111827;
color:#fff;
padding:10px 15px;
border-radius:12px;
font-weight:900;
pointer-events:none;
transition:.25s;
white-space:nowrap;
font-size:13px;
}

.toast.show{
opacity:1;
transform:translate(-50%,0);
}

.empty{
text-align:center;
color:var(--muted);
padding:25px 8px;
font-size:13px;
}

.divider{
height:1px;
background:var(--line);
margin:11px 0;
}

/* =========================
EVOLUTION
========================= */

.evo-text{
text-align:center;
font-size:25px;
font-weight:950;
color:#b45309;
margin:4px 0 10px;
}

.evo{
animation:evo .7s ease;
}

@keyframes evo{
0%{
transform:scale(.55);
opacity:0;
}
60%{
transform:scale(1.08);
}
100%{
transform:scale(1);
opacity:1;
}
}

.evo-glow{
animation:glow 1s infinite alternate;
}

@keyframes glow{
from{
filter:drop-shadow(0 0 3px #d4a72c);
}
to{
filter:drop-shadow(0 0 18px #facc15);
}
}

@media(min-width:700px){

.nav{
position:static;
max-width:760px;
margin:auto;
border:1px solid var(--line);
border-radius:15px;
}

.app{
padding-bottom:20px;
}

.toast{
bottom:20px;
}

}
</style>
</head>

<body>

<div class="app">

<header>
<div class="brand">
<div class="brand-mark">🏇</div>
<div>
<div class="title">競馬牧場</div>
<div class="subtitle">予想するほど、あなたの馬が強くなる。</div>
</div>
</div>
</header>


<!-- =========================
HOME
========================= -->

<section id="home" class="page active">

<div class="card">

<div id="characterBox" class="character-wrap"></div>

<div class="levelline">
<div id="level" class="level">Lv.1 赤ちゃん馬</div>
<div id="rank" class="pill">赤ちゃん馬</div>
</div>

<div class="small" id="expText">EXP 0 / 100</div>

<div class="expbar">
<div id="expFill" class="expfill"></div>
</div>

<div class="small">
次の進化まであと
<b id="nextText">100 EXP</b>
</div>

<button
class="btn light full"
style="margin-top:10px"
onclick="toggleGrowth()">

🐎 成長を見る
<span id="growthArrow">▼</span>

</button>

<div id="growthDetail" class="toggle-area">

<div class="divider"></div>

<div class="statgrid">

<div class="stat">
<div class="small">現在の能力</div>
<div id="growthLevel" class="v">Lv.1</div>
</div>

<div class="stat">
<div class="small">累計レース</div>
<div id="growthRaces" class="v">0</div>
</div>

<div class="stat">
<div class="small">的中数</div>
<div id="growthHits" class="v">0</div>
</div>

<div class="stat">
<div class="small">回収率</div>
<div id="growthROI" class="v">0.0%</div>
</div>

</div>

<div style="margin-top:10px">

<div class="growth-badge">
🌱 育成中
</div>

<div
id="growthCondition"
class="small"
style="margin-top:8px;line-height:1.7">
</div>

</div>

</div>

</div>


<div class="card">

<div class="section-head">
<h2>📊 現在の成績</h2>
</div>

<div class="mini-stat">

<div class="mini-stat-box">
<div class="small">レース</div>
<b id="sRaces">0</b>
</div>

<div class="mini-stat-box">
<div class="small">的中</div>
<b id="sHits">0</b>
</div>

<div class="mini-stat-box">
<div class="small">回収率</div>
<b id="sROI">0.0%</b>
</div>

</div>

<div
id="homeProfit"
class="center"
style="margin-top:9px;font-weight:950">
累計収支 0円
</div>

</div>


<button
class="btn primary full"
onclick="showPage('predict')">

🏇 予想をはじめる

</button>

</section>


<!-- =========================
PREDICT
========================= -->

<section id="predict" class="page">

<div class="card">

<h2>📝 予想を登録</h2>

<div class="grid2">

<div>
<label>競馬場</label>
<select id="track"></select>
</div>

<div>
<label>レース</label>
<select id="raceNo"></select>
</div>

</div>

<div class="grid2" style="margin-top:9px">

<div>
<label>芝・ダート・障害</label>
<select id="surface"></select>
</div>

<div>
<label>距離</label>
<select id="distance"></select>
</div>

</div>

<div style="margin-top:9px">

<label>クラス</label>
<div id="classChoices" class="choice-grid"></div>

</div>

<div style="margin-top:9px">

<label>馬場状態</label>
<div id="groundChoices" class="choice-grid"></div>

</div>

<div style="margin-top:9px">

<label>頭数</label>
<select id="fieldSize"></select>

</div>

</div>


<div class="card">

<div class="section-head">

<div>
<h2>🐴 出走馬</h2>
<div class="small">
タップすると詳細入力
</div>

function freshDB(){

return{
version:9,
races:[],
lastEvolution:1
};

}


function normalizeRace(r){

const horses=(r.horses||[]).map((h,i)=>({

no:Number(h.no)||i+1,

frame:Number(h.frame)||
frameFromNo(Number(h.no)||i+1),

name:String(h.name||""),

mark:MARKS.includes(h.mark)?
h.mark:"－"

}));

return{

id:r.id||
String(Date.now()+Math.random()),

date:r.date||
new Date().toISOString(),

track:r.track||"東京",

raceNo:Number(r.raceNo)||1,

surface:r.surface||"芝",

distance:r.distance||"1600m",

className:r.className||"その他",

ground:r.ground||"良",

fieldSize:Number(r.fieldSize)||
horses.length||1,

stake:Number(r.stake)||0,

horses,

result:{

first:String(r.result?.first||""),

second:String(r.result?.second||""),

third:String(r.result?.third||""),

returned:Number(r.result?.returned)||0,

hitStatus:r.result?.hitStatus||"auto",

done:!!r.result?.done

},

odds:Number(r.odds)||0,

popularity:Number(r.popularity)||0

};

}


function loadDB(){

try{

const raw=
localStorage.getItem(STORE)||
localStorage.getItem("keiba_bokujou_v8")||
localStorage.getItem("keiba_bokujou_v7")||
localStorage.getItem("keiba_bokujou_v6");

if(!raw)return freshDB();

const x=JSON.parse(raw);

x.races=(x.races||[]).map(normalizeRace);

x.version=9;

return x;

}catch(e){

return freshDB();

}

}


function persist(){

localStorage.setItem(
STORE,
JSON.stringify(db)
);

}


function esc(s){

return String(s??"")
.replace(/[&<>"']/g,c=>({

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"

}[c]));

}


function yen(n){

return Number(n||0)
.toLocaleString("ja-JP")+"円";

}


function frameFromNo(no){

return Math.min(
8,
Math.ceil(Number(no)/2)
);

}


function frameColorClass(f){

return"frame-"+f;

}


function profit(r){

return r.result.done?
Number(r.result.returned||0)-
Number(r.stake||0):0;

}


function hit(r){

if(!r.result.done)return false;

if(r.result.hitStatus==="hit")return true;

if(r.result.hitStatus==="miss")return false;

const top=[
r.result.first,
r.result.second,
r.result.third
].map(String);

return r.horses.some(h=>
h.mark!=="－" &&
top.includes(String(h.no))
);

}


function toast(msg){

const e=document.getElementById("toast");

e.textContent=msg;

e.classList.add("show");

setTimeout(
()=>e.classList.remove("show"),
1800
);

}

function levelInfo(exp){

const level=
Math.min(
50,
Math.floor(exp/100)+1
);

let name;
let stage;

if(level<=4){
name="赤ちゃん馬";
stage="foal";
}

else if(level<=9){
name="子馬";
stage="young";
}

else if(level<=14){
name="若駒";
stage="juvenile";
}

else if(level<=19){
name="成長馬";
stage="grown";
}

else if(level<=24){
name="競走馬";
stage="racehorse";
}

else if(level<=29){
name="強豪競走馬";
stage="strong";
}

else if(level<=34){
name="重賞級";
stage="graded";
}

else if(level<=39){
name="チャンピオン";
stage="champion";
}

else if(level<=44){
name="最強馬";
stage="elite";
}

else if(level<=49){
name="王者";
stage="king";
}

else{
name="伝説の競走馬";
stage="legend";
}

return{

level,
name,
stage,

current:
level===50?
100:
exp%100,

need:100

};

}

/* =========================

function init(){

fillSelect(
"track",
TRACKS,
"東京"
);

fillSelect(
"raceNo",
Array.from(
{length:12},
(_,i)=>i+1
),
1,
true
);

fillSelect(
"surface",
SURFACES,
"芝"
);

fillSelect(
"fieldSize",
Array.from(
{length:14},
(_,i)=>i+5
),
8,
false,
"頭"
);

renderChoice(
"classChoices",
CLASSES,
"その他",
v=>currentClass=v
);

renderChoice(
"groundChoices",
GROUNDS,
"良",
v=>currentGround=v
);

document.getElementById("surface").onchange=
updateDistance;

document.getElementById("fieldSize").onchange=
syncFieldSize;

updateDistance();

horsesForm=[];

for(let i=1;i<=8;i++){
horsesForm.push(blankHorse(i));
}

renderHorses();

refresh();

showPage("home");

}


function fillSelect(
id,
arr,
value,
race=false,
suffix=""
){

const s=document.getElementById(id);

s.innerHTML="";

arr.forEach(x=>{

let text=x;

if(race)
text=x+"R";
else if(suffix)
text=x+suffix;

s.add(
new Option(text,x)
);

});

s.value=value;

}


function renderChoice(
id,
arr,
value,
callback
){

const box=document.getElementById(id);

box.innerHTML="";

arr.forEach(x=>{

const b=document.createElement("button");

b.className=
"choice"+
(x===value?" selected":"");

b.textContent=x;

b.onclick=()=>{

box
.querySelectorAll(".choice")
.forEach(z=>
z.classList.remove("selected")
);

b.classList.add("selected");

callback(x);

};

box.appendChild(b);

});

}


function updateDistance(){

const s=
document.getElementById("surface").value;

let d=
s==="芝"?
"1600m":
s==="ダート"?
"1200m":
"3000m";

fillSelect(
"distance",
DIST[s],
d
);

}

========================= */

return{

no,
frame:frameFromNo(no),
name:"",
mark:"－"

};

}


function syncFieldSize(){

const n=
Number(
document.getElementById("fieldSize").value
);

while(horsesForm.length<n){

horsesForm.push(
blankHorse(horsesForm.length+1)
);

}

horsesForm=
horsesForm.slice(0,n);

renderHorses();

}


function addHorse(){

if(horsesForm.length>=18){

toast("最大18頭です");

return;

}

horsesForm.push(
blankHorse(
horsesForm.length+1
)
);

document.getElementById("fieldSize").value=
horsesForm.length;

renderHorses();

}

if(!el)return;

el.classList.toggle("open");

}

renderHorses();

box.appendChild(b);

}

horsesForm[frameHorse].frame=f;

renderHorses();

function collectHorseNames(){

horsesForm.forEach((h,i)=>{

/* =========================
EXP
========================= */

function getRaceExp(r){

if(!r.result.done)return 0;

let e=15;

if(hit(r))
e+=35;

const stake=
Number(r.stake||0);

const ret=
Number(r.result.returned||0);

if(stake){

const roi=
ret/stake*100;

if(roi>=100)e+=15;
if(roi>=150)e+=15;
if(roi>=200)e+=20;

const win=
Math.max(
0,
ret-stake
);

if(win>=1000)e+=5;
if(win>=3000)e+=10;
if(win>=5000)e+=15;
if(win>=10000)e+=25;
if(win>=30000)e+=40;
if(win>=50000)e+=60;

}

return e;

}


function calcExp(){

let e=0;

db.races.forEach(r=>{

e+=10;

if(r.result.done)
e+=getRaceExp(r);

});

return e;

}


/* =========================
STATS
========================= */

function stats(){

const done=
db.races.filter(
r=>r.result.done
);

const stake=
db.races.reduce(
(a,r)=>
a+Number(r.stake||0),
0
);

const returned=
done.reduce(
(a,r)=>
a+Number(r.result.returned||0),
0
);

const hits=
done.filter(hit).length;

return{

races:db.races.length,

done:done.length,

hits,

stake,

returned,

profit:
returned-stake,

roi:
stake?
returned/stake*100:
0,

hitRate:
done.length?
hits/done.length*100:
0

};

}

/* =========================

========================= */

function renderAnalysisConditions(box,track,category){

const races=
db.races.filter(
r=>r.result.done &&
r.track===track
);

let groups={};

races.forEach(r=>{

let keys=[];

if(category==="距離")
keys=[r.distance];

else if(category==="芝/ダート")
keys=[r.surface];

else if(category==="馬場")
keys=[r.ground];

else if(category==="クラス")
keys=[r.className];

else if(category==="印"){

keys=[
...new Set(
r.horses
.filter(h=>h.mark!=="－")
.map(h=>h.mark)
)
];

}

keys.forEach(k=>{

if(!groups[k]){

groups[k]={
races:[],
stake:0,
ret:0
};

}

groups[k].races.push(r);

groups[k].stake+=
Number(r.stake||0);

groups[k].ret+=
Number(r.result.returned||0);

});

});

const keys=
Object.keys(groups)
.sort((a,b)=>{

const ra=
groups[a].stake?
groups[a].ret/groups[a].stake:
0;

const rb=
groups[b].stake?
groups[b].ret/groups[b].stake:
0;

return rb-ra;

});

box.innerHTML=`

<div class="analysis-header">

<button
class="back-btn"
onclick="analysisBack()">
‹
</button>

<div class="analysis-title">
🏇 ${esc(track)}
</div>

</div>

<div class="analysis-subtabs">

${["総合","距離","芝/ダート","馬場","クラス","印"]
.map(x=>`

<button
class="analysis-subtab ${
x===category?"active":""
}"
onclick="openAnalysisCategory('${esc(track)}','${esc(x)}')">

${x}

</button>

`).join("")}

</div>

<div class="small" style="margin-bottom:8px">
${esc(track)}・${esc(category)}別
<br>
条件をタップすると詳細を表示
</div>

<div class="analysis-list">

${keys.map((k,i)=>{

const x=groups[k];

const roi=
x.stake?
x.ret/x.stake*100:
0;

return`

<div
class="analysis-item"
onclick="openAnalysisCondition(
'${esc(track)}',
'${esc(category)}',
'${esc(k)}'
)">

<div class="analysis-rank">
${i+1}.
</div>

<div class="analysis-name">
${esc(k)}
</div>

<div class="analysis-roi ${
roi>=100?
"roi-good":
roi<90?
"roi-bad":
"roi-normal"
}">
${roi.toFixed(1)}%
</div>

<div class="analysis-arrow">
›
</div>

</div>

`;

}).join("")}

</div>

`;

}


/* =========================
ANALYSIS DETAIL
========================= */

function renderAnalysisDetail(
box,
track,
category,
condition
){

let races=
db.races.filter(
r=>r.result.done &&
r.track===track
);

if(category==="距離")
races=races.filter(
r=>r.distance===condition
);

else if(category==="芝/ダート")
races=races.filter(
r=>r.surface===condition
);

else if(category==="馬場")
races=races.filter(
r=>r.ground===condition
);

else if(category==="クラス")
races=races.filter(
r=>r.className===condition
);

else if(category==="印"){

races=races.filter(r=>
r.horses.some(h=>
h.mark===condition
)
);

}

box.innerHTML=`

<div class="analysis-header">

<button
class="back-btn"
onclick="analysisBack()">
‹
</button>

<div class="analysis-title">
${esc(track)}・${esc(condition)}
</div>

</div>

<div class="analysis-detail-card">

<div class="analysis-detail-title">
${esc(track)}${category==="芝/ダート"&&condition==="芝"?"芝":""}${category==="芝/ダート"&&condition==="ダート"?"ダート":""}${category==="芝/ダート"&&condition==="障害"?"障害":""}
${category==="距離"?condition:""}
</div>

${makeAnalysisStats(races)}

</div>

<div style="margin-top:9px">

<button
class="btn light full"
onclick="analysisBack()">

← ${esc(category)}一覧へ戻る

</button>

</div>

`;

}


/* =========================
ANALYSIS STATS
========================= */

function makeAnalysisStats(races){

if(!races.length){

return`
<div class="empty">
データがありません。
</div>
`;

}

const racesN=races.length;

const hits=races.filter(hit).length;

const stake=
races.reduce(
(a,r)=>a+Number(r.stake||0),
0
);

const ret=
races.reduce(
(a,r)=>a+Number(r.result.returned||0),
0
);

const balance=
ret-stake;

const roi=
stake?
ret/stake*100:
0;

const hitRate=
hits/racesN*100;

return`

<div class="analysis-detail-stats">

<div class="analysis-detail-stat">

<span>総レース</span>

<b>${racesN}R</b>

</div>

<div class="analysis-detail-stat">

<span>的中</span>

<b>${hits}R</b>

</div>

<div class="analysis-detail-stat">

<span>的中率</span>

<b>${hitRate.toFixed(1)}%</b>

</div>

<div class="analysis-detail-stat">

<span>回収率</span>

<b class="${
roi>=100?
"plus":
"minus"
}">
${roi.toFixed(1)}%
</b>

</div>

<div class="analysis-detail-stat">

<span>投資</span>

<b>${yen(stake)}</b>

</div>

<div class="analysis-detail-stat">

<span>回収</span>

<b>${yen(ret)}</b>

</div>

</div>

<div
class="analysis-extra ${
balance>=0?
"plus":
"minus"
}">

収支　
<b>
${balance>=0?"+":""}${yen(balance)}
</b>

</div>

`;

}


/* =========================
ANALYSIS NAVIGATION
========================= */

function openAnalysisTrack(track){

detailPath=[track];

renderAnalysis();

}

function openAnalysisCategory(track,category){

if(category==="総合"){

detailPath=[track];

renderAnalysis();

return;

}

detailPath=[track,category];

renderAnalysis();

}

function openAnalysisCondition(
track,
category,
condition
){

detailPath=[
track,
category,
condition
];

renderAnalysis();

}

function analysisBack(){

detailPath.pop();

renderAnalysis();

}


/* =========================
CHART
========================= */

function toggleChart(){

chartOpen=!chartOpen;

const area=
document.getElementById("chartArea");

const arrow=
document.getElementById("chartArrow");

area.classList.toggle(
"open",
chartOpen
);

arrow.textContent=
chartOpen?
"▲":
"▼";

if(chartOpen){

setTimeout(
drawChart,
50
);

}

}


function drawChart(){

const c=
document.getElementById("chart");

if(!c)return;

const w=
Math.max(
300,
c.clientWidth||300
);

const h=180;

const dpr=
Math.max(
1,
devicePixelRatio||1
);

c.width=w*dpr;
c.height=h*dpr;

const ctx=
c.getContext("2d");

ctx.setTransform(
dpr,
0,
0,
dpr,
0,
0
);

ctx.clearRect(
0,0,w,h
);

const vals=[];

let total=0;

db.races
.slice()
.reverse()
.forEach(r=>{

if(!r.result.done)return;

total+=profit(r);

vals.push(total);

});

if(!vals.length){

ctx.fillStyle="#667085";

ctx.font="12px sans-serif";

ctx.fillText(
"結果入力したレースが増えるとグラフが表示されます",
15,
90
);

return;

}

const max=
Math.max(
1000,
...vals.map(v=>Math.abs(v))
);

const pad=25;

const mid=h/2;

const y=v=>
pad+
(max-v)/
(max*2)*
(h-pad*2);

const x=i=>
vals.length===1?
w/2:
pad+
i*
(w-pad*2)/
(vals.length-1);

ctx.strokeStyle="#d0d5dd";

ctx.beginPath();

ctx.moveTo(
pad,
mid
);

ctx.lineTo(
w-pad,
mid
);

ctx.stroke();

ctx.beginPath();

vals.forEach((v,i)=>{

if(i)
ctx.lineTo(
x(i),
y(v)
);

else
ctx.moveTo(
x(i),
y(v)
);

});

ctx.strokeStyle="#2563eb";

ctx.lineWidth=2.4;

ctx.stroke();

vals.forEach((v,i)=>{

ctx.beginPath();

ctx.arc(
x(i),
y(v),
3.3,
0,
Math.PI*2
);

ctx.fillStyle=
v>=0?
"#16a34a":
"#dc2626";

ctx.fill();

});

document.getElementById(
"chartNote"
).textContent=
`${vals.length}レース｜最終累計 ${
total>=0?"+":""
}${yen(total)}`;

}
